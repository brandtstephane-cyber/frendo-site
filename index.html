  const sansReponse = (state.revData || []).reduce((n, l) => n + (l.reviews || []).filter((r) => !r.reply).length, 0);
  /* Avec deux magasins, tout afficher à la suite oblige à faire défiler tous

  const revFiltre = `

  /* On garde l'index d'origine : les boutons Répondre et Copier pointent dans
     state.revData, pas dans la liste filtrée. */
  const avis = (state.revData || [])
    .map((loc, li) => ({ loc, li }))
    .filter(({ loc }) => revLoc === "all" || loc.location_name === revLoc)
    .map(({ loc, li }) => {
    if (loc.error) return `<div class="pagecard" style="padding:12px 14px;margin-bottom:10px;">
      <div style="font-weight:600;font-size:13px;">${escapeHtml(loc.title)}</div>

    return `<div class="pagecard" style="padding:12px 14px;margin-bottom:10px;">

        <div style="font-weight:600;font-size:13px;">${escapeHtml(loc.title)}</div>

  root.innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px;">

        : mode === "avis"
          ? "Du plus récent au plus ancien, comme sur votre fiche. L'écran s'ouvre sur ce qui attend une réponse ; « Tous les avis » relit l'historique. Répondre compte autant que la note — le client suivant lit les réponses pour savoir à qui il a affaire, et une réponse posée à une critique rassure plus qu'une moyenne parfaite. Les réponses partent directement sur Google."
          : "10 dernières publications par page Facebook, compte Instagram, Threads et Bluesky, classées par engagement (👍 + 2×💬 + 3×🔁). Filtre sur un réseau pour que les jours et les créneaux ne mélangent plus des publications vues et des publications jamais diffusées."}</p>
    ${mode === "gal" ? `

      ${!state.galBusy && state.galData !== null ? (gal || `<div class="msg">Aucun établissement Google connecté.</div>`) : ""}
    ` : mode === "avis" ? `
      ${state.revBusy ? `<div class="center muted" style="margin:30px 0;">⏳ Lecture des avis…</div>` : ""}
      ${state.revErr && !state.revBusy ? `<div class="msg err">${escapeHtml(state.revErr)}</div>` : ""}
      ${!state.revBusy && state.revData !== null ? revFiltre + revTabs : ""}
      ${!state.revBusy && state.revData !== null ? (avis || `<div class="msg">Aucun établissement Google connecté.</div>`) : ""}
    ` : `
      ${state.statsBusy ? `<div class="center muted" style="margin:30px 0;">⏳ Chargement des publications…</div>` : ""}
      ${state.statsErr && !state.statsBusy ? `<div class="msg err">${escapeHtml(state.statsErr)}</div>` : ""}
      ${!state.statsBusy && mode === "post" ? filterRow : ""}
      ${!state.statsBusy && mode === "post" ? avgBlock : ""}
      ${!state.statsBusy && mode === "post" && !posts.length ? `<div class="msg">Aucune publication sur ce réseau.</div>` : ""}
      ${!state.statsBusy ? (mode === "envoi" ? sends : rows) : ""}
    `}`;
  const _sb = document.getElementById("stats-back"); if (_sb) _sb.onclick = () => { state.view = null; render(); };
  const _sr = document.getElementById("stats-refresh"); if (_sr) _sr.onclick = () => {
    if (mode === "gal") { state.galData = null; loadGalleryStats(); }
    else if (mode === "avis") { state.revData = null; state.revOpen = ""; loadReviews(); }
    else { state.statsData = null; loadStats(); }
  };
  const _sme = document.getElementById("stats-mode-envoi"); if (_sme) _sme.onclick = () => { state.statsMode = "envoi"; renderStats(true); };
  const _smp = document.getElementById("stats-mode-post"); if (_smp) _smp.onclick = () => { state.statsMode = "post"; renderStats(true); };
  const _smg = document.getElementById("stats-mode-gal"); if (_smg) _smg.onclick = () => {
    state.statsMode = "gal"; renderStats(true);
    if (state.galData === null && !state.galBusy) loadGalleryStats();
  };
  const _sma = document.getElementById("stats-mode-avis"); if (_sma) _sma.onclick = () => {
    state.statsMode = "avis"; renderStats(true);
    if (state.revData === null && !state.revBusy) loadReviews();
  };
  root.querySelectorAll("[data-netf]").forEach((b) => {
    b.onclick = () => { state.statsNet = b.getAttribute("data-netf"); renderStats(true); };
  });
  root.querySelectorAll(".rev-send").forEach((b) => {
    b.onclick = () => sendReviewReply(+b.getAttribute("data-li"), +b.getAttribute("data-ri"));
  });
  root.querySelectorAll(".rev-edit").forEach((b) => {

  });
  root.querySelectorAll("[data-revloc]").forEach((b) => {

  });
  root.querySelectorAll("[data-revf]").forEach((b) => {

      } catch (e) { alert("Copie impossible sur cet appareil."); }
    };
  });
  // Le champ ouvert prend le curseur : on enchaîne la frappe sans viser.
  if (state.revOpen) {
    const ta = document.getElementById("rev-ta-" + state.revOpen);
    if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  }
}
// Meta et YouTube répondent souvent « objet introuvable » APRÈS avoir bien
// supprimé le contenu (ou parce qu'il n'existait déjà plus). Ce n'est pas un
// échec : le contenu n'est plus en ligne, c'est exactement le but.
// N'est appliqué qu'aux réponses des réseaux, jamais à nos propres messages.
function unpubGone(msg) {
  const m = String(msg || "").toLowerCase();
  return m.includes("does not exist")
    || m.includes("unsupported delete request")
    || m.includes("unsupported get request")
    || m.includes("no longer exists")
    || m.includes("not found")
    || m.includes("videonotfound")
    || m.includes("deleted");
}
// Dépublie une entrée d'historique sur tous les réseaux où elle est vraiment partie (irréversible).
async function unpublishEntry(e, hi) {
  if (!confirm("Dépublier définitivement cette publication sur tous les réseaux où elle est partie ?\n\nAction irréversible.")) return;
  const btn = document.getElementById("hist-unpub-" + hi);
  if (btn) { btn.disabled = true; btn.textContent = "Suppression en cours…"; }
  const results = [];
  const _items = e.items || [];
  /* Les destinations confiées au robot n'ont pas d'identifiant de post dans
     l'historique : le robot publie sur le serveur, l'historique vit sur
     l'appareil. Depuis le 24.10.2026 le robot note ce qu'il a créé ; on vient
     le chercher ici, avant de commencer, pour pouvoir retirer réellement. */
  const pubMap = {};
  try {
    const jobIds = _items.filter((x) => x && x.ok && x.sched && x.jobId && !x.postId).map((x) => x.jobId);
    if (jobIds.length) {
      const { ok, data } = await api("/api/stories-schedule", { pwd: state.pwd, action: "published_list", jobIds });
      if (ok && data && data.ok) (data.published || []).forEach((p) => { if (p && p.jobId) pubMap[String(p.jobId)] = p; });
    }
  } catch (err) { /* sans le registre, on retombe sur l'ancien message honnête */ }
  for (let _k = 0; _k < _items.length; _k++) {
    const it = _items[_k];
    if (!it.ok) continue; // seulement ce qui a réellement été publié
    if (it.unpubOk) continue; // déjà dépublié lors d'une tentative précédente
    const _mark = results.length; // pour rattacher l'origine aux lignes ajoutées ci-dessous
    try {
      if (it.sched && it.jobId) {
        /* Destination confiée au robot. Deux situations opposées, qu'on
           confondait jusqu'au 19.10.2026 :
           — la tâche existe encore : elle n'a pas été publiée, l'annuler suffit ;
           — la tâche a disparu : elle a DÉJÀ été publiée. L'annulation ne
             supprime alors rien du tout, et Frendo annonçait pourtant « réussi ».
           Jusqu'au 24.10.2026 le second cas était sans issue : l'identifiant du
           post naissait sur le serveur et n'arrivait jamais jusqu'ici. Le robot
           le consigne désormais, et on va le relire — il ne reste à faire à la
           main que les publications antérieures à ce changement. */
        const { ok, data } = await api("/api/stories-schedule", { pwd: state.pwd, action: "cancel", id: it.jobId });
        if (!ok || !data || !data.ok) {
          results.push({ name: it.name, ok: false, error: (data && data.error) || "échec de l'annulation" });
          continue;
        }
        if (data.found !== false) {
          /* La tâche existait encore : rien n'était publié, l'annuler suffit.
             On le dit explicitement — « annulée avant publication » et « retirée
             du réseau » sont deux résultats très différents, et les confondre
             sous un même « réussi » empêchait de savoir ce qui s'était passé. */
          results.push({ name: it.name, ok: true, annule: true });
          continue;
        }
        /* La tâche a disparu : le robot a déjà publié. Si son registre contient
           l'identifiant du post, on peut le retirer pour de bon — on complète
           la fiche et on laisse la suite faire le travail réseau par réseau. */
        const rec = pubMap[String(it.jobId)];
        if (!rec || (!rec.postId && !rec.url && !rec.uri)) {
          results.push({ name: it.name, ok: false, manuel: true,
            error: "déjà publiée par le robot avant le suivi des identifiants — à supprimer à la main sur le réseau" });
          continue;
        }
        it.postId = it.postId || rec.postId || null;
        it.url = it.url || rec.url || null;
        it.pageId = it.pageId || rec.pageId || null;
        it.igUserId = it.igUserId || rec.igUserId || null;
        it.accountKey = it.accountKey || rec.accountKey || null;
        it.sched = false; // ce n'est plus une tâche à annuler, c'est un post à retirer
        it._viaRegistre = 1; // pour distinguer le retrait réel de la simple annulation
      }
      if (it.network === "fb" || it.network === "ig") {
        if (!it.postId || !it.pageId) { results.push({ name: it.name, ok: false, error: "identifiant introuvable (publication trop ancienne, avant le suivi)" }); continue; }
        const token = await getPageToken(it.pageId);
        if (!token) { results.push({ name: it.name, ok: false, error: "jeton introuvable" }); continue; }
        const r = await fbDelete(FBV + it.postId + "?access_token=" + encodeURIComponent(token));
        let _ok = r.success === true || !r.error;
        let _err = r.error && (r.error.error_user_msg || r.error.error_user_title || r.error.message);
        let _gone = false;
        // Meta a refusé la suppression en disant que l'objet n'existe plus :
        // on va vérifier nous-mêmes. Si le contenu est réellement introuvable,
        // c'est une réussite, pas un échec.
        if (!_ok && unpubGone(_err)) {
          const chk = await fbGet(FBV + it.postId + "?fields=id&access_token=" + encodeURIComponent(token));
          if (!chk || !chk.id) { _ok = true; _gone = true; _err = undefined; }
        }
        results.push({ name: it.name, ok: _ok, gone: _gone, error: _err });
      } else if (it.network === "threads") {
        if (!it.postId || !it.accountKey) { results.push({ name: it.name, ok: false, error: "identifiant introuvable (publication trop ancienne)" }); continue; }
        const { ok, data } = await api("/api/threads", { pwd: state.pwd, action: "delete_post", accountKey: it.accountKey, postId: it.postId });
        const _g = !(ok && data && data.ok) && unpubGone(data && data.error);
        results.push({ name: it.name, ok: (ok && data && data.ok) || _g, gone: _g, error: _g ? undefined : (data && data.error) });
      } else if (it.network === "bluesky") {
        if (!it.url || !it.accountKey) { results.push({ name: it.name, ok: false, error: "identifiant introuvable (publication trop ancienne)" }); continue; }
        const { ok, data } = await api("/api/threads", { pwd: state.pwd, action: "bsky_delete", accountKey: it.accountKey, url: it.url });
        results.push({ name: it.name, ok: ok && data && data.ok, error: data && data.error });
      } else if (it.network === "youtube") {
        if (!it.videoId) { results.push({ name: it.name, ok: false, error: "identifiant introuvable (publication trop ancienne)" }); continue; }
        const { ok, data } = await api("/api/youtube", { pwd: state.pwd, action: "delete", channel_id: it.channelId, videoId: it.videoId });
        const _gy = !(ok && data && data.ok) && unpubGone(data && data.error);
        results.push({ name: it.name, ok: (ok && data && data.ok) || _gy, gone: _gy, error: _gy ? undefined : (data && data.error) });
      } else {
        results.push({ name: it.name, ok: false, error: "réseau non pris en charge pour l'instant" });
      }
    } catch (err) {
      results.push({ name: it.name, ok: false, error: String(err) });
    }
    // Chaque ligne garde la destination, le lien et le réseau de la publication
    // d'origine : c'est ce qui rend les échecs cliquables dans le panneau.
    for (let i = _mark; i < results.length; i++) {
      results[i].dest = it.dest || "";
      results[i].url = it.url || "";
      results[i].network = it.network || "";
      if (it._viaRegistre && results[i].ok) results[i].retire = true;
      results[i].ts = e.ts;   // pour retrouver la ligne dans l'historique
      results[i].ii = _k;     // (bouton « Ouvrir » qui reste marqué)
    }
    // Mémoire de l'opération sur l'item lui-même : dépublié pour de bon, ou
    // resté en ligne avec la raison. C'est ce qui survit au rechargement.
    const mine = results.slice(_mark);
    if (mine.length && mine.every((r) => r.ok)) {
      it.unpubOk = 1; delete it.unpubFail; delete it.unpubDone; delete it.unpubOpened;
    } else if (mine.length) {
      const bad = mine.find((r) => !r.ok);
      it.unpubFail = String((bad && bad.error) || "échec de la dépublication");
      it.unpubTs = Date.now();
      delete it.unpubDone; delete it.unpubOpened;
    }
  }
  saveUnpubState(e);
  showUnpublishResult(results);
  renderHistory(true);
}
// Écrit dans l'historique (local + cloud) ce qui a été dépublié et ce qui
// reste à supprimer à la main, pour que la liste survive au rechargement.
function saveUnpubState(entry) {
  try {
    const h = loadHistory();
    const i = h.findIndex((x) => x.ts === entry.ts && (x.name || "") === (entry.name || ""));
    if (i < 0) return;
    const src = entry.items || [];
    (h[i].items || []).forEach((it, k) => {
      const s = src[k];
      if (!s) return;
      if (s.unpubOk) { it.unpubOk = 1; delete it.unpubFail; delete it.unpubDone; delete it.unpubOpened; }
      else if (s.unpubFail) { it.unpubFail = s.unpubFail; it.unpubTs = s.unpubTs || Date.now(); delete it.unpubDone; }
    });
    localStorage.setItem("poster_history", JSON.stringify(h));
  } catch {}
  pushHistoryCloud();
}
// « ↗ Ouvrir » : on retient que la ligne a été ouverte, pour savoir où on en
// est dans la liste après être revenu du réseau social. Survit au rechargement.
function markUnpubOpened(ts, ii, noRender) {
  try {
    const h = loadHistory();
    const i = h.findIndex((x) => String(x.ts) === String(ts));
    if (i >= 0 && h[i].items && h[i].items[ii]) h[i].items[ii].unpubOpened = 1;
    localStorage.setItem("poster_history", JSON.stringify(h));
  } catch {}
  pushHistoryCloud();
  // Redessin différé : l'onglet du réseau social doit d'abord s'ouvrir.
  if (!noRender) setTimeout(() => { if (state.view === "history") renderHistory(true); }, 500);
}
// « ✓ Fait » : la ligne disparaît de la liste des suppressions manuelles.
function markUnpubDone(ts, ii) {
  try {
    const h = loadHistory();
    const i = h.findIndex((x) => String(x.ts) === String(ts));
    if (i >= 0 && h[i].items && h[i].items[ii]) h[i].items[ii].unpubDone = 1;
    localStorage.setItem("poster_history", JSON.stringify(h));
  } catch {}
  pushHistoryCloud();
  renderHistory(true);
}
// Toutes les lignes encore à supprimer à la main, tous envois confondus.
function pendingUnpub(hAll) {
  const out = [];
  (hAll || []).forEach((e) => {
    (e.items || []).forEach((it, ii) => {
      if (it.unpubFail && !it.unpubDone) out.push({ e, it, ii });
    });
  });
  return out;
}

/* ---------- ACTIONS ---------- */
function onFile(e) {
  const fl = e.target.files;
  if (state.media && state.media.kind === "carousel" && fl && fl.length) {
    const valid = Array.from(fl).filter(f => (f.type || "").startsWith("image") || (f.type || "").startsWith("video"));
    const room = Math.max(0, 10 - state.mediaList.length);
    const take = valid.slice(0, room);
    if (take.length === 0) { e.target.value = ""; return; }
    let done = 0;
    take.forEach((f) => {
      loadMediaItem(f, (item) => {
        state.mediaList.push(item);
        done++;
        if (done === take.length) { render(); saveDraft(); }
      });
    });
    e.target.value = "";
    return;
  }
  if (fl && fl.length > 1) { handleFiles(Array.from(fl)); e.target.value = ""; return; }
  const f = fl && fl[0];
  handleFile(f);
  e.target.value = "";
}
// Charge un fichier (image OU vidéo) en tant qu'item de carrousel, avec vignette.
function loadMediaItem(f, cb) {
  const isVideo = (f.type || "").startsWith("video");
  const reader = new FileReader();
  reader.onload = () => {
    const dataUrl = reader.result;
    const item = { previewUrl: dataUrl, name: f.name || (isVideo ? "video" : "photo"), file: f, mime: f.type || (isVideo ? "video/mp4" : "image/jpeg"), kind: isVideo ? "video" : "image" };
    fetch(dataUrl).then(r => r.blob()).then(bl => { item.file = new File([bl], item.name, { type: item.mime }); }).catch(() => {});
    if (isVideo) makeThumb(dataUrl, true, (t) => { item.thumb = t; cb(item); });
    else cb(item);
  };
  reader.readAsDataURL(f);
}
// Plusieurs fichiers choisis d'un coup → carrousel de photos ET/OU vidéos (2 à 10).
function handleFiles(files) {
  const valid = files.filter(f => (f.type || "").startsWith("image") || (f.type || "").startsWith("video"));
  if (valid.length < 2) { if (valid[0]) handleFile(valid[0]); return; }
  const keep = valid.slice(0, 10);
  let done = 0;
  const list = new Array(keep.length);
  keep.forEach((f, i) => {
    loadMediaItem(f, (item) => {
      list[i] = item;
      done++;
      if (done === keep.length) {
        state.mediaList = list;
        const cover = list.find(x => x.kind !== "video") || list[0];
        state.media = { kind: "carousel", name: cover.name, previewUrl: cover.thumb || cover.previewUrl };
        makeThumb(cover.thumb || cover.previewUrl, false, (t) => { state.media.thumb = t; });
        state.thumbTs = null; state.thumbDataUrl = null; state.thumbSlider = 0; state.thumbCustom = false;
        state.error = ""; resetDests(); render(); saveDraft();
      }
    });
  });
}
function handleFile(f) {
  if (!f) return;
  const isVideo = (f.type || "").startsWith("video");
  const isImage = (f.type || "").startsWith("image");
  if (!isVideo && !isImage) { state.error = "Format non reconnu — choisissez une image ou une vidéo."; state.media = null; render(); return; }
  state.mediaList = [];
  const reader = new FileReader();
  reader.onload = () => {
    const dataUrl = reader.result;
    const media = { base64: dataUrl.split(",")[1], mime: f.type || "image/jpeg", previewUrl: dataUrl, kind: isVideo ? "video" : "image", file: f };
    // Android révoque parfois l'accès au fichier choisi après quelques minutes
    // (« permission problems after a reference to a file was acquired »).
    // On matérialise donc tout de suite une copie en mémoire à partir de l'aperçu
    // déjà lu : l'envoi n'aura plus jamais besoin de re-demander le fichier à Android.
    fetch(dataUrl).then((r) => r.blob()).then((bl) => {
      media.file = new File([bl], f.name || "media", { type: f.type || bl.type || "application/octet-stream" });
    }).catch(() => {});
    makeThumb(dataUrl, isVideo, (t) => { media.thumb = t; });
    if (isVideo) {
      const v = document.createElement("video");
      v.preload = "metadata";
      v.onloadedmetadata = () => {
        media.duration = v.duration || null;
        // Dimensions : servent au contrôle avant envoi (vertical attendu par
        // les Shorts, Reels et Stories). Le navigateur les donne gratuitement.
        media.w = v.videoWidth || null;
        media.h = v.videoHeight || null;
        state.error = ""; state.media = media; resetDests(); render(); saveDraft();
      };
      v.onerror = () => { state.error = ""; state.media = media; resetDests(); render(); saveDraft(); };
      v.src = dataUrl;
    } else {
      state.error = ""; state.media = media; resetDests(); render(); saveDraft();
    }
  };
  reader.readAsDataURL(f);
}

/* Envoie un fichier directement vers l'hébergement et renvoie son lien public.
   C'est la base pour les Reels, les Stories et Instagram (qui vont chercher le média via ce lien). */
// Hébergement des médias : Cloudflare R2, et rien d'autre.
// Le circuit Vercel Blob a été supprimé en v254. Si R2 échoue, l'envoi échoue
// franchement avec le message de R2 — mieux qu'un repli silencieux qui faisait
// grossir un stockage parallèle sans que personne ne s'en aperçoive.
async function uploadToBlob(file, onProgress) {
  DBG.length = 0;
  const url = await uploadToR2(file, onProgress);
  dbg("hébergé sur R2 ✓");
  return url;
}

/* ---------- Hébergement des médias sur Cloudflare R2 ---------- */
/* Même rôle que uploadToBlob : héberge un fichier et renvoie son lien public.
   L'envoi part directement du navigateur vers R2 via un lien signé (pas de limite Vercel). */
async function uploadToR2(file, onProgress) {
  const safeName = (file.name || "media");
  // 1) Demander un lien d'envoi signé au serveur Frendo
  const rs = await api("/api/r2", { action: "presign", filename: safeName, contentType: file.type || "application/octet-stream" });
  const j = rs.data || {};
  if (!rs.ok || !j.ok) throw new Error("Lien R2 impossible : " + (j.error || "refusé"));
  // 2) Envoyer le fichier directement à R2, avec suivi de progression
  await new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("PUT", j.uploadUrl);
    xhr.setRequestHeader("Content-Type", file.type || "application/octet-stream");
    xhr.upload.onprogress = (e) => { if (e.lengthComputable && onProgress) onProgress(Math.round(e.loaded / e.total * 100)); };
    xhr.onload = () => (xhr.status >= 200 && xhr.status < 300) ? resolve() : reject(new Error("Envoi R2 refusé (HTTP " + xhr.status + ")"));
    xhr.onerror = () => reject(new Error("Envoi R2 impossible (réseau ou CORS)"));
    xhr.send(file);
  });
  return j.publicUrl;
}

/* ---------- Envoi direct des vidéos vers Facebook (contourne la limite Vercel) ---------- */
function b64toBlob(b64, mime) {
  const bin = atob(b64), len = bin.length, bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: mime || "video/mp4" });
}
function uploadVideo(pageId, token, blob, caption, onProgress, scheduleTs, thumbBlob) {
  return new Promise((resolve) => {
    const fd = new FormData();
    fd.append("access_token", token);
    if (caption) fd.append("description", caption);
    if (scheduleTs) { fd.append("published", "false"); fd.append("scheduled_publish_time", String(scheduleTs)); }
    else { fd.append("published", "true"); }
    if (thumbBlob) fd.append("thumb", thumbBlob, "thumb.jpg");
    fd.append("source", blob, "video.mp4");
    const xhr = new XMLHttpRequest();
    xhr.open("POST", "https://graph.facebook.com/v25.0/" + pageId + "/videos");
    xhr.upload.onprogress = (ev) => { if (ev.lengthComputable && onProgress) onProgress(Math.round(ev.loaded / ev.total * 100)); };
    xhr.onload = () => {
      let data = {}; try { data = JSON.parse(xhr.responseText); } catch {}
      if (xhr.status >= 200 && xhr.status < 300 && data.id) {
        if (thumbBlob) { try { setFbThumbnail(data.id, token, thumbBlob, "Fil " + pageId); } catch {} }
        resolve({ ok: true, id: data.id });
      }
      else resolve({ ok: false, error: (data.error && data.error.message) || ("Erreur Facebook (" + xhr.status + ")") });
    };
    xhr.onerror = () => resolve({ ok: false, error: "Connexion à Facebook impossible." });
    xhr.send(fd);
  });
}

/* ---------- Moteur Reels & Stories (Facebook va chercher le média via son lien) ---------- */
const FBV = "https://graph.facebook.com/v25.0/";
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
async function fbGet(url) { const r = await fetch(url); return r.json().catch(() => ({})); }
async function fbPost(url) { const r = await fetch(url, { method: "POST" }); return r.json().catch(() => ({})); }
async function fbDelete(url) { const r = await fetch(url, { method: "DELETE" }); return r.json().catch(() => ({})); }

// Pose la vignette personnalisée sur une vidéo Facebook (Fil ou Reel).
// 1) On attend que Facebook ait fini de traiter la vidéo (jusqu'à ~2 min).
// 2) On pose la vignette, et on note la réponse exacte pour diagnostic.
async function setFbThumbnail(videoId, token, tb, label) {
  if (!tb || !videoId) return false;
  if (!state.thumbReport) state.thumbReport = [];
  // Registre des vignettes : permet de réessayer celles qui échouent
  if (!state.thumbJobs) state.thumbJobs = [];
  let job = state.thumbJobs.find((j) => j.videoId === videoId && j.label === label);
  if (!job) { job = { videoId, token, tb, label, ok: false }; state.thumbJobs.push(job); }
  const report = (msg) => { state.thumbReport.push((label || "vidéo") + " : " + msg); paintThumbReport(); };
  // Attendre la fin du traitement
  for (let i = 0; i < 24; i++) {
    await sleep(5000);
    try {
      const st = await fbGet(FBV + videoId + "?fields=status&access_token=" + encodeURIComponent(token));
      const vs = (st.status && st.status.video_status) || "";
      const proc = (st.status && st.status.processing_phase && st.status.processing_phase.status) || "";
      if (vs === "ready" || vs === "published" || proc === "complete") break;
      if (st.error) { report("lecture du statut refusée — " + (st.error.message || "?")); break; }
    } catch {}
  }
  // Poser la vignette (3 tentatives)
  let posted = false;
  let lastErr = "";
  for (let i = 0; i < 3; i++) {
    try {
      const tfd = new FormData();
      tfd.append("access_token", token);
      tfd.append("is_preferred", "true");
      tfd.append("source", tb, "thumb.jpg");
      const r = await fetch(FBV + videoId + "/thumbnails", { method: "POST", body: tfd });
      const j = await r.json().catch(() => ({}));
      if (j === true || j.success === true) { posted = true; break; }
      lastErr = (j && j.error && (j.error.message + (j.error.code ? " (#" + j.error.code + ")" : ""))) || JSON.stringify(j).slice(0, 140);
    } catch (e) { lastErr = "réseau : " + (e && e.message ? e.message : e); }
    await sleep(6000);
  }
  if (!posted) { report("❌ " + (lastErr || "refus sans message")); paintThumbReport(); return false; }
  job.ok = true;
  // Facebook garde parfois la vignette en « candidate » sans l'activer :
  // on la re-sélectionne explicitement parmi la liste des vignettes de la vidéo.
  let activated = false;
  try {
    await sleep(4000);
    const lst = await fbGet(FBV + videoId + "/thumbnails?fields=id,uri,is_preferred&access_token=" + encodeURIComponent(token));
    const arr = (lst && lst.data) || [];
    // La nôtre est la plus récente non préférée (ou déjà préférée → rien à faire)
    const already = arr.find((t) => t.is_preferred);
    const candidate = arr.length ? arr[arr.length - 1] : null;
    if (candidate && !candidate.is_preferred) {
      const r2 = await fetch(FBV + candidate.id + "?is_preferred=true&access_token=" + encodeURIComponent(token), { method: "POST" });
      const j2 = await r2.json().catch(() => ({}));
      activated = (j2 === true || j2.success === true);
    } else if (already && candidate && already.id === candidate.id) {
      activated = true;
    }
  } catch {}
  report(activated ? "✅ vignette posée et activée" : "🟡 vignette posée (activation incertaine — vérifier sur Facebook)");
  return true;
}
// Une panne passagère (réseau, quota Meta…) mérite un nouvel essai automatique ;
// une erreur définitive (format refusé, compte manquant…) non.
function isTransientError(e) {
  e = (e || "").toLowerCase();
  return /failed to fetch|réseau|network|timeout|timed out|request limit|temporarily|quota|en traitement|réessaie|processing|#4\b|\(#4\)|#2\b|\(#2\)|#32|#613/.test(e);
}
function clearAutoRetry() {
  if (state.autoRetryTimer) { clearInterval(state.autoRetryTimer); state.autoRetryTimer = null; }
  state.autoRetryCountdown = 0;
}
// Programme un nouvel essai automatique : 30 s, puis 2 min, puis 5 min.
function scheduleAutoRetry() {
  clearAutoRetry();
  const ctx = state.retryRun;
  if (!ctx) return;
  const delays = [30, 120, 300];
  const attempt = state.autoRetryAttempt || 0;
  if (attempt >= delays.length) return;
  const transient = (state.results || []).some((r, i) => r && !r.ok && ctx.tasks[i] && isTransientError(r.error));
  if (!transient) return;
  state.autoRetryCountdown = delays[attempt];
  render();
  state.autoRetryTimer = setInterval(() => {
    state.autoRetryCountdown -= 1;
    const el = document.getElementById("ar-cd");
    if (el) el.textContent = state.autoRetryCountdown;
    if (state.autoRetryCountdown <= 0) {
      clearAutoRetry();
      state.autoRetryAttempt = attempt + 1;
      retryFailedTasks();
    }
  }, 1000);
}
/* L'entrée d'historique est écrite une seule fois, juste après la première
   passe. Sans cette mise à jour, une reprise réussie reste rouge à jamais :
   l'écran de résultats montrait « ✓ terminé » et l'historique « échec ». */
function updateHistoryItem(entryId, idx, r) {
  if (!entryId || !r) return false;
  try {
    const h = loadHistory();
    const i = h.findIndex((x) => x && x.entryId === entryId);
    if (i < 0) return false;
    const it = (h[i].items || [])[idx];
    if (!it) return false;
    it.ok = !!r.ok;
    if (r.ok) {
      delete it.err;
      it.sched = !!r.sched;
      // On ne remplace que ce que la reprise a réellement rapporté : un champ
      // absent du nouveau résultat ne doit pas effacer celui déjà noté.
      ["network", "pageId", "igUserId", "accountKey", "postId", "url", "jobId", "videoId", "channelId"]
        .forEach((k) => { if (r[k]) it[k] = r[k]; });
    } else {
      it.err = (r.error || "").slice(0, 160);
    }
    localStorage.setItem("poster_history", JSON.stringify(h));
    return true;
  } catch (e) { return false; }
}
// Rejoue uniquement les publications qui ont échoué (réseau, quota Meta…)
async function retryFailedTasks() {
  const ctx = state.retryRun;
  if (!ctx || state.retryBusy) return;
  const failedIdx = [];
  (state.results || []).forEach((r, i) => { if (r && !r.ok && ctx.tasks[i]) failedIdx.push(i); });
  if (!failedIdx.length) return;
  clearAutoRetry();
  state.retryBusy = true; render();
  let touched = false;
  for (const i of failedIdx) {
    try {
      const r = await ctx.runTask(ctx.tasks[i], () => {});
      state.results[i] = r;
    } catch (e) {
      state.results[i] = { ok: false, name: state.results[i].name, dest: state.results[i].dest, error: (e && e.message) || "erreur" };
    }
    if (updateHistoryItem(ctx.entryId, i, state.results[i])) touched = true;
  }
  // Un seul envoi au cloud pour toute la reprise, pas un par ligne.
  if (touched) pushHistoryCloud();
  state.retryBusy = false; render();
  scheduleAutoRetry();
}
// Affiche le rapport de pose de vignette sur l'écran de résultats (diagnostic)
function paintThumbReport() {
  const el = document.getElementById("thumb-report");
  if (el && state.thumbReport && state.thumbReport.length) {
    el.style.display = "";
    const pending = (state.thumbJobs || []).filter((j) => !j.ok).length;
    el.innerHTML = "🖼 Vignette Facebook — " + state.thumbReport.map(escapeHtml).join(" · ")
      + (pending && !state.thumbRetryBusy ? '<div style="margin-top:8px;"><button id="thumb-retry" class="btn-ghost" style="padding:6px 12px;font-size:12px;">🔁 Réessayer les vignettes manquantes (' + pending + ')</button></div>' : "")
      + (state.thumbRetryBusy ? '<div style="margin-top:8px;">⏳ Nouvel essai en cours…</div>' : "");
    const btn = document.getElementById("thumb-retry");
    if (btn) btn.onclick = retryThumbs;
  }
}
// Réessaie uniquement les vignettes qui ont échoué (ex : quota Meta atteint)
async function retryThumbs() {
  const jobs = (state.thumbJobs || []).filter((j) => !j.ok);
  if (!jobs.length || state.thumbRetryBusy) return;
  state.thumbRetryBusy = true;
  state.thumbReport.push("— nouvel essai… —");
  paintThumbReport();
  for (const j of jobs) { try { await setFbThumbnail(j.videoId, j.token, j.tb, j.label); } catch (_) {} }
  state.thumbRetryBusy = false;
  paintThumbReport();
}
// Miniature pour l'historique / plan de bataille : la vignette choisie si elle existe,
// réduite à 96 px (légère à stocker), sinon la miniature automatique.
function thumbSmallOrDefault() {
  // La petite version de la vignette choisie si elle est prête, sinon la miniature automatique.
  if (state._thumbSmallCache && state._thumbSmallCacheSrc === state.thumbDataUrl) return state._thumbSmallCache;
  return (state.media && state.media.thumb) || null;
}
// Pré-calcule la petite miniature dès qu'une vignette est choisie (asynchrone, indolore)
function buildThumbSmall() {
  try {
    if (!state.thumbDataUrl) { state._thumbSmallCache = null; state._thumbSmallCacheSrc = null; return; }
    const src = state.thumbDataUrl;
    const im = new Image();
    im.onload = () => {
      try {
        const cv = document.createElement("canvas");
        const sc = 96 / Math.max(im.width, im.height);
        cv.width = Math.round(im.width * sc); cv.height = Math.round(im.height * sc);
        cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
        state._thumbSmallCache = cv.toDataURL("image/jpeg", 0.7);
        state._thumbSmallCacheSrc = src;
      } catch {}
    };
    im.src = src;
  } catch {}
}
/* ---------- Diaporama vidéo (carrousel → Reel) ---------- */
// Assemble les photos du carrousel en vidéo verticale 1080×1920 : fond flouté,
// léger zoom cinématique, fondus enchaînés. Généré dans le navigateur.
async function generateSlideshow() {
  if (state.slideBusy || state.mediaList.length < 2) return;
  // Format de sortie : MP4 si le navigateur sait le produire (requis par Meta), sinon on prévient.
  let mime = null;
  for (const cand of ["video/mp4;codecs=avc1.42E01E,mp4a.40.2", "video/mp4;codecs=avc1", "video/mp4"]) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(cand)) { mime = cand; break; }
  }
  if (!mime) {
    alert("Votre navigateur ne sait pas encore produire de vidéo MP4 (requis par Facebook).\nUtilise Chrome à jour sur PC ou Android.");
    return;
  }
  stopMusicPreview(false);
  state.slideBusy = true; renderMediaSlot();
  try {
    // Précharger les images
    const imgs = await Promise.all(state.mediaList.map((m) => new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = rej;
      im.src = m.previewUrl;
    })));

    const W = 1080, H = 1920, FPS = 30;
    const per = state.slideDur; // secondes par photo
    const fade = 0.6;           // durée du fondu
    const total = imgs.length * per;
    const cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    const ctx = cv.getContext("2d");

    // Dessine une photo : fond flouté qui remplit + photo entière centrée, avec zoom léger
    const drawSlide = (im, localT, alpha) => {
      ctx.save();
      ctx.globalAlpha = alpha;
      // Fond : la photo agrandie pour couvrir, floutée et assombrie
      const cover = Math.max(W / im.width, H / im.height) * 1.1;
      ctx.filter = "blur(36px) brightness(0.6)";
      ctx.drawImage(im, W / 2 - im.width * cover / 2, H / 2 - im.height * cover / 2, im.width * cover, im.height * cover);
      ctx.filter = "none";
      // Photo entière, centrée, zoom 1.00 → 1.06 sur la durée de la diapo
      const zoom = 1 + 0.06 * Math.min(1, Math.max(0, localT / per));
      const fit = Math.min(W / im.width, H / im.height) * 0.92 * zoom;
      ctx.drawImage(im, W / 2 - im.width * fit / 2, H / 2 - im.height * fit / 2, im.width * fit, im.height * fit);
      ctx.restore();
    };

    const stream = cv.captureStream(FPS);

    // ---- Musique : décodage + fondu de sortie, mixée dans la vidéo ----
    let audioCtx = null, audioSrc = null;
    if (state.music) {
      try {
        let arr;
        if (state.music === "custom" && state.musicFile) {
          arr = await state.musicFile.arrayBuffer();
        } else {
          const rMus = await fetch(MUSIC_BASE + state.music);
          if (!rMus.ok) throw new Error("Musique introuvable (HTTP " + rMus.status + ")");
          arr = await rMus.arrayBuffer();
        }
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") await audioCtx.resume();
        const buf = await audioCtx.decodeAudioData(arr);
        audioSrc = audioCtx.createBufferSource();
        audioSrc.buffer = buf;
        audioSrc.loop = buf.duration < total; // boucle si le morceau est plus court que la vidéo
        const gain = audioCtx.createGain();
        const FADE_OUT = Math.min(2, total / 3); // fondu final : 2 s (ou moins si vidéo courte)
        const now = audioCtx.currentTime;
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(1, now + 0.3);              // mini fondu d'entrée
        gain.gain.setValueAtTime(1, now + total - FADE_OUT);
        gain.gain.linearRampToValueAtTime(0, now + total);            // fondu de sortie
        const dest = audioCtx.createMediaStreamDestination();
        audioSrc.connect(gain); gain.connect(dest);
        const aTrack = dest.stream.getAudioTracks()[0];
        if (aTrack) stream.addTrack(aTrack);
        audioSrc.start(now);
        audioSrc.stop(now + total);
      } catch (eMus) {
        console.warn("Musique ignorée :", eMus);
        alert("La musique n'a pas pu être ajoutée (" + ((eMus && eMus.message) || "?") + ") — la vidéo sera créée sans son.");
        audioCtx = null; audioSrc = null;
      }
    }

    const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 6000000 });
    const chunks = [];
    rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    const finished = new Promise((res) => { rec.onstop = res; });
    rec.start(250);

    const t0 = performance.now();
    await new Promise((res) => {
      const frame = () => {
        const t = (performance.now() - t0) / 1000;
        if (t >= total) { res(); return; }
        const idx = Math.min(imgs.length - 1, Math.floor(t / per));
        const localT = t - idx * per;
        ctx.clearRect(0, 0, W, H);
        drawSlide(imgs[idx], localT, 1);
        // Fondu enchaîné vers la photo suivante en fin de diapo
        if (idx < imgs.length - 1 && localT > per - fade) {
          const a = (localT - (per - fade)) / fade;
          drawSlide(imgs[idx + 1], 0, a);
        }
        requestAnimationFrame(frame);
      };
      requestAnimationFrame(frame);
    });
    rec.stop();
    await finished;
    if (audioCtx) { try { audioCtx.close(); } catch (_) {} }

    const blob = new Blob(chunks, { type: mime.split(";")[0] });
    const file = new File([blob], "diaporama.mp4", { type: "video/mp4" });
    state.slideVideo = { file, previewUrl: URL.createObjectURL(blob), mime: "video/mp4" };
  } catch (e) {
    alert("La création du diaporama a échoué : " + (e && e.message ? e.message : e));
  }
  state.slideBusy = false;
  renderPages(); render();
}

// Bluesky limite les images à ~1 Mo : on compresse automatiquement si besoin.
function compressForBsky(previewUrl) {
  return new Promise((resolve) => {
    try {
      const im = new Image();
      im.onload = () => {
        try {
          let scale = Math.min(1, 2048 / Math.max(im.width, im.height));
          const attempt = (q, sc) => {
            const cv = document.createElement("canvas");
            cv.width = Math.round(im.width * sc); cv.height = Math.round(im.height * sc);
            cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
            cv.toBlob((bl) => {
              if (bl && bl.size <= 900000) resolve(bl);
              else if (q > 0.55) attempt(q - 0.1, sc);
              else if (sc > 0.5) attempt(0.8, sc * 0.75);
              else resolve(bl); // au pire, on envoie le plus petit obtenu
            }, "image/jpeg", q);
          };
          attempt(0.85, scale);
        } catch { resolve(null); }
      };
      im.onerror = () => resolve(null);
      im.src = previewUrl;
    } catch { resolve(null); }
  });
}
// Vignette choisie → Blob JPEG (ou null)
function thumbBlobOrNull() {
  try {
    if (!state.thumbDataUrl) return null;
    const b64 = state.thumbDataUrl.split(",")[1];
    return b64toBlob(b64, "image/jpeg");
  } catch { return null; }
}
// Recapture PRÉCISE de la vignette au moment de publier : on recharge la vidéo
// dans un lecteur invisible, on se cale exactement sur l'instant choisi, et on
// attend que l'image soit réellement affichée avant de photographier.
function recaptureThumb() {
  return new Promise((resolve) => {
    try {
      if (state.thumbTs == null || !state.media || state.media.kind !== "video" || !state.media.previewUrl) { resolve(); return; }
      const v = document.createElement("video");
      v.muted = true; v.playsInline = true; v.preload = "auto";
      v.src = state.media.previewUrl;
      const done = () => { try { v.src = ""; } catch {} resolve(); };
      const timer = setTimeout(done, 8000); // garde-fou : jamais bloquant
      v.onloadeddata = () => { v.currentTime = Math.min((v.duration || 9999) - 0.05, state.thumbTs); };
      v.onseeked = () => {
        // Deux images de délai pour être sûr que le décodeur a affiché la bonne image
        requestAnimationFrame(() => requestAnimationFrame(() => {
          try {
            if (v.videoWidth) {
              const cv = document.createElement("canvas");
              const sc = Math.min(1, 1080 / v.videoWidth);
              cv.width = Math.round(v.videoWidth * sc);
              cv.height = Math.round(v.videoHeight * sc);
              cv.getContext("2d").drawImage(v, 0, 0, cv.width, cv.height);
              state.thumbDataUrl = cv.toDataURL("image/jpeg", 0.85);
              buildThumbSmall();
            }
          } catch {}
          clearTimeout(timer); done();
        }));
      };
      v.onerror = () => { clearTimeout(timer); done(); };
    } catch { resolve(); }
  });
}
// Publie un Reel ou une Story vidéo. kind = "reel" | "story".
async function publishVerticalVideo(pageId, token, kind, videoUrl, caption, onStep, scheduleTs) {
  const endpoint = kind === "reel" ? "video_reels" : "video_stories";
  // 1) Démarrage de la session
  onStep && onStep("Préparation…");
  const start = await fbPost(FBV + pageId + "/" + endpoint + "?upload_phase=start&access_token=" + encodeURIComponent(token));
  if (!start.video_id || !start.upload_url) return { ok: false, error: (start.error && start.error.message) || "Échec de l'initialisation." };
  const videoId = start.video_id, uploadUrl = start.upload_url;
  // 2) On donne le lien à Facebook (via notre petit relais serveur)
  onStep && onStep("Transfert vers Facebook…");
  const up = await api("/api/fb-rupload", { pwd: state.pwd, uploadUrl, token, fileUrl: videoUrl });
  if (!up.ok || !up.data || (up.data.success !== true && !up.data.ok)) {
    return { ok: false, error: (up.data && up.data.error) || "Facebook n'a pas pu récupérer la vidéo." };
  }
  // 3) On attend que Facebook ait bien téléchargé (et, pour une story, traité) la vidéo
  onStep && onStep("Traitement par Facebook…");
  for (let i = 0; i < (kind === "story" ? 60 : 40); i++) {
    await sleep(3000);
    const s = await fbGet(FBV + videoId + "?fields=status&access_token=" + encodeURIComponent(token));
    const st = s.status || {};
    const uploading = (st.uploading_phase && st.uploading_phase.status) || "";
    const processing = (st.processing_phase && st.processing_phase.status) || "";
    const vstatus = st.video_status || "";
    if (uploading === "error" || processing === "error") {
      const err = (st.uploading_phase && st.uploading_phase.error) || (st.processing_phase && st.processing_phase.error);
      return { ok: false, error: (err && err.message) || "Facebook a refusé la vidéo (format ou durée ?)." };
    }
    if (kind === "story") {
      // Une story n'est publiable qu'une fois le TRAITEMENT terminé, pas seulement la réception.
      if (processing === "complete" || vstatus === "ready" || vstatus === "published") break;
      if (!st.processing_phase && uploading === "complete") break;
    } else {
      if (uploading === "complete") break;
    }
  }
  // 4) Publication finale
  onStep && onStep("Publication…");
  let finUrl = FBV + pageId + "/" + endpoint + "?upload_phase=finish&video_id=" + encodeURIComponent(videoId) + "&access_token=" + encodeURIComponent(token);
  if (kind === "reel") {
    finUrl += "&video_state=" + (scheduleTs ? "SCHEDULED" : "PUBLISHED");
    if (scheduleTs) finUrl += "&scheduled_publish_time=" + scheduleTs;
    if (caption) finUrl += "&description=" + encodeURIComponent(caption);
  }
  const fin = await fbPost(finUrl);
  // Vignette personnalisée du Reel : envoyée en arrière-plan, avec patience
  // (Facebook la refuse tant que la vidéo est en traitement).
  if (kind === "reel" && (fin.success === true || fin.id || fin.post_id)) {
    const tb = thumbBlobOrNull();
    if (tb) { try { setFbThumbnail(videoId, token, tb, "Reel " + pageId); } catch {} }
  }
  if (fin.success === true || fin.id || fin.post_id) {
    return { ok: true, id: videoId, url: kind === "reel" ? ("https://www.facebook.com/reel/" + videoId) : ("https://www.facebook.com/" + pageId) };
  }
  return { ok: false, error: (fin.error && fin.error.message) || "Échec de la publication finale." };
}

// Publie une Story photo (photo hébergée → Facebook la récupère).
async function publishPhotoStory(pageId, token, photoUrl) {
  const ph = await fbPost(FBV + pageId + "/photos?published=false&url=" + encodeURIComponent(photoUrl) + "&access_token=" + encodeURIComponent(token));
  if (!ph.id) return { ok: false, error: (ph.error && ph.error.message) || "Échec de l'envoi de la photo." };
  const fin = await fbPost(FBV + pageId + "/photo_stories?photo_id=" + encodeURIComponent(ph.id) + "&access_token=" + encodeURIComponent(token));
  // On remonte l'identifiant de la story : sans lui, la dépublication échoue
  // plus tard avec « identifiant introuvable ».
  if (fin.success === true || fin.post_id || fin.id) return { ok: true, id: fin.post_id || fin.id || ph.id || null, url: "https://www.facebook.com/" + pageId };
  return { ok: false, error: (fin.error && fin.error.message) || "Échec de la publication de la story." };
}

// Fil Facebook, vidéo seule (pas d'attached_media) : Facebook ne supporte pas
// le mélange photo+vidéo dans un même post multi-média (limite de l'API, testé et confirmé).
async function fbVideoOnlyFeed(pageId, token, videoUrl, message, scheduleTs) {

// Publie un post texte seul sur le Fil (aucun média).
async function fbTextFeed(pageId, token, message, scheduleTs) {

/* ---------- Marquage de lieu (Facebook) ------------------------------------
   Meta ne documente plus le parametre `place` pour les pages : il a longtemps
   fonctionne, mais rien ne garantit qu'il soit encore accepte. Toute publication
   marquee est donc tentee avec le lieu, puis SANS lui si Meta la refuse pour
   cette raison. Une publication n'est jamais perdue a cause du marquage. */
// L'identifiant d'un lieu Facebook est celui de la Page correspondante : on
// propose donc simplement les pages deja connues de Frendo.
function placeIdFor(pageId) {
  return ((state.placeTag || {})[pageId]) || "";
}
function placeNameFor(pageId) {
  const id = placeIdFor(pageId);
  if (!id) return "";
  const p = (state.pages || []).find((x) => x.id === id);
  return (p && p.name) || id;
}
// Ajoute &place=... a une requete, si un lieu est choisi pour cette page.
function withPlace(qs, pageId) {
  const id = placeIdFor(pageId);
  return id ? qs + "&place=" + encodeURIComponent(id) : qs;
}
// Vrai si Meta a refuse la requete a cause du lieu : on peut alors reessayer sans.
function placeRejected(r) {
  const m = (r && r.error && (r.error.message || "")) || "";
  return /place|location|lieu/i.test(m);
}
// Publie avec le lieu, et rejoue sans lui si c'est le lieu qui bloque.
async function fbPostWithPlaceFallback(url, qs, pageId, token) {
  const tagged = withPlace(qs, pageId);
  const suffix = "&access_token=" + encodeURIComponent(token);
  if (tagged === qs) return await fbPost(url + "?" + qs + suffix);
  const r = await fbPost(url + "?" + tagged + suffix);
  if (r && r.id) return r;
  if (placeRejected(r)) return await fbPost(url + "?" + qs + suffix);
  return r;
}

/* ---------- Carrousel ---------- */
// Fil Facebook : chaque média (photo ou vidéo) est envoyé non publié, puis attaché à un seul post.
async function fbCarouselFeed(pageId, token, items, message, scheduleTs) {
  const ids = [];
  for (const it of items) {
    const isVid = it.kind === "video";
    const ph = isVid
      ? await fbPost(FBV + pageId + "/videos?published=false&file_url=" + encodeURIComponent(it.url) + "&access_token=" + encodeURIComponent(token))
      : await fbPost(FBV + pageId + "/photos?published=false&url=" + encodeURIComponent(it.url) + "&access_token=" + encodeURIComponent(token));
    if (!ph.id) return { ok: false, error: (ph.error && ph.error.message) || "Échec de l'envoi d'un média." };
    if (isVid) {
      let ready = false;
      for (let i = 0; i < 30; i++) {
        const st = await fbGet(FBV + ph.id + "?fields=status&access_token=" + encodeURIComponent(token));
        const vs = st && st.status && st.status.video_status;
        if (vs === "ready") { ready = true; break; }
        if (vs === "error") return { ok: false, error: "Facebook a refusé la vidéo du carrousel." };
        await sleep(2500);
      }
      if (!ready) return { ok: false, error: "La vidéo du carrousel met trop de temps à être traitée — réessaie." };
    }
    ids.push(ph.id);
  }
  let qs = "message=" + encodeURIComponent(message || "");
  ids.forEach((id, i) => { qs += "&attached_media[" + i + "]=" + encodeURIComponent(JSON.stringify({ media_fbid: id })); });
  if (scheduleTs) qs += "&published=false&scheduled_publish_time=" + scheduleTs;
  const r = await fbPostWithPlaceFallback(FBV + pageId + "/feed", qs, pageId, token);
  if (r.id) return { ok: true, url: scheduleTs ? null : ("https://www.facebook.com/" + r.id), id: r.id };
  return { ok: false, error: (r.error && r.error.message) || "Échec du carrousel Facebook." };
}
// Carrousel Instagram : conteneurs enfants puis conteneur CAROUSEL.
async function igCarousel(igId, token, items, caption, onStep) {
  onStep && onStep("Préparation des médias…");
  const children = [];
  for (const it of items) {
    const isVid = it.kind === "video";
    const param = isVid ? ("media_type=VIDEO&video_url=" + encodeURIComponent(it.url)) : ("image_url=" + encodeURIComponent(it.url));
    const c = await fbPost(FBV + igId + "/media?is_carousel_item=true&" + param + "&access_token=" + encodeURIComponent(token));
    if (!c.id) return { ok: false, error: igErrMsg(c) || "Instagram a refusé un des médias." };
    children.push({ id: c.id, isVid });
  }
  // Attendre que CHAQUE média soit prêt (sinon Instagram publie un carrousel
  // incomplet… puis le supprime de lui-même). Les vidéos prennent plus de temps.
  for (let ci = 0; ci < children.length; ci++) {
    onStep && onStep((children[ci].isVid ? "Vidéo " : "Photo ") + (ci + 1) + "/" + children.length + " en traitement…");
    let ready = false;
    const maxTries = children[ci].isVid ? 40 : 20;
    const waitMs = children[ci].isVid ? 3000 : 2500;
    for (let i = 0; i < maxTries; i++) {
      const st = await fbGet(FBV + children[ci].id + "?fields=status_code&access_token=" + encodeURIComponent(token));
      if (st.status_code === "FINISHED") { ready = true; break; }
      if (st.status_code === "ERROR" || st.status_code === "EXPIRED") return { ok: false, error: "Instagram a refusé le média " + (ci + 1) + " (format ?)." };
      if (!st.status_code) { if (st.error) return { ok: false, error: igErrMsg(st) }; ready = true; break; }
      await sleep(waitMs);
    }
    if (!ready) return { ok: false, error: "Le média " + (ci + 1) + " met trop de temps à être traité — réessaie." };
  }
  let qs = "media_type=CAROUSEL&children=" + children.map(c => c.id).join("%2C");
  if (caption) qs += "&caption=" + encodeURIComponent(caption);
  const cr = await fbPost(FBV + igId + "/media?" + qs + "&access_token=" + encodeURIComponent(token));
  if (!cr.id) return { ok: false, error: igErrMsg(cr) || "Instagram a refusé le carrousel." };
  onStep && onStep("Traitement par Instagram…");
  for (let i = 0; i < 40; i++) {
    await sleep(3000);
    const st = await fbGet(FBV + cr.id + "?fields=status_code&access_token=" + encodeURIComponent(token));
    if (st.status_code === "FINISHED") break;
    if (st.status_code === "ERROR" || st.status_code === "EXPIRED") return { ok: false, error: "Instagram a refusé le carrousel (formats des médias ?)." };
    if (!st.status_code) { if (st.error) return { ok: false, error: igErrMsg(st) }; break; }
  }
  onStep && onStep("Publication…");
  const pub = await fbPost(FBV + igId + "/media_publish?creation_id=" + encodeURIComponent(cr.id) + "&access_token=" + encodeURIComponent(token));
  if (!pub.id) return { ok: false, error: igErrMsg(pub) || "Échec de la publication du carrousel." };
  let url = null;
  try { const perm = await fbGet(FBV + pub.id + "?fields=permalink&access_token=" + encodeURIComponent(token)); url = perm.permalink || null; } catch {}
  return { ok: true, url, id: pub.id };
}

// Jeton de page (avec cache pour éviter les allers-retours serveur).
async function getPageToken(pageId) {
  if (state.tokens[pageId]) return state.tokens[pageId];
  const tk = await api("/api/pagetoken", { pwd: state.pwd, pageId });

// Détecte, pour chaque page, si un compte Instagram professionnel est relié.
async function detectInstagram() {
  state.igNote = "";
  state.pageHealth = {};
  for (const p of state.pages) {
    try {
      const token = await getPageToken(p.id);
      if (!token) { state.ig[p.id] = null; state.pageHealth[p.id] = { ok: false, why: "aucun jeton pour cette page" }; continue; }
      const r = await fbGet(FBV + p.id + "?fields=instagram_business_account{id,username,profile_picture_url}&access_token=" + encodeURIComponent(token));
      // Ce même appel sert de contrôle de santé du jeton : aucune requête en plus.
      // Un jeton mort répond par une OAuthException (souvent le code 190) ; une
      // erreur de permission Instagram, elle, ne veut pas dire que le jeton est perdu.
      const e = r && r.error;
      if (e && (e.type === "OAuthException" || e.code === 190 || /expired|session has been invalidated|not authorized/i.test(e.message || ""))) {
        state.pageHealth[p.id] = { ok: false, why: (e.message || "jeton expiré").slice(0, 140) };
      } else {
        state.pageHealth[p.id] = { ok: true };
      }
      if (r.instagram_business_account && r.instagram_business_account.id) {
        state.ig[p.id] = { id: r.instagram_business_account.id, username: r.instagram_business_account.username || "", picture: r.instagram_business_account.profile_picture_url || "" };
      } else {
        state.ig[p.id] = null;
        if (r.error && r.error.message) state.igNote = r.error.message;
      }
    } catch (err) { state.ig[p.id] = null; state.pageHealth[p.id] = { ok: false, why: "page injoignable (" + ((err && err.message) || "réseau") + ")" }; }
  }
  state.igChecked = true;
  // Rafraîchit l'écran principal complet (fait disparaître « Recherche… » et affiche les cases Insta ou le message d'explication)
  if (state.authed && state.view === "main" && !state.done && !state.busy) render();
}
/* ---------- Santé des connexions ----------
   Le reproche numéro un fait aux outils concurrents : un jeton expire, les
   publications tombent, et personne n'est prévenu. Ici l'état de chaque
   destination est contrôlé à l'ouverture et affiché en haut de l'accueil.
   Un réseau jamais connecté n'est pas un problème : on ne signale que ce qui
   a déjà fonctionné et ne fonctionne plus. */
/* Cette memoire est propre a CHAQUE compte, pas a l'appareil. Elle etait
   commune : sur un telephone ou le proprietaire avait deja utilise YouTube, un
   client connecte ensuite heritait du « deja vu » et lisait « chaine
   deconnectee — a reconnecter » pour un reseau qu'il n'avait simplement jamais
   branche. Alarmant, et faux. */
const HEALTH_KEY_BASE = "poster_health_seen";
function healthKey() {
  return HEALTH_KEY_BASE + (state.cliCompte && state.cliCompte.id ? ":" + state.cliCompte.id : "");
}
function healthSeenGet() { try { return JSON.parse(localStorage.getItem(healthKey()) || "{}") || {}; } catch { return {}; } }
function healthSeenMark(net) {
  try { const v = healthSeenGet(); if (!v[net]) { v[net] = 1; localStorage.setItem(healthKey(), JSON.stringify(v)); } } catch {}
}

// Liste des destinations à rétablir. Lit l'état déjà détecté : aucun appel réseau.
function healthProblems() {
  const out = [];
  const seen = healthSeenGet();
  (state.pages || []).forEach((p) => {
    const h = state.pageHealth && state.pageHealth[p.id];
    if (h && h.ok === false) out.push({ what: p.name || "Page Facebook", why: h.why || "jeton à régénérer" });
  });
  (state.thAccounts || []).forEach((a) => { if (a && !a.id) out.push({ what: "Threads @" + (a.username || a.key || ""), why: "jeton invalide ou expiré" }); });
  (state.bsAccounts || []).forEach((a) => { if (a && !a.ok) out.push({ what: "Bluesky @" + (a.handle || a.key || ""), why: "connexion impossible — vérifier le mot de passe d'app" }); });
  (state.ttAccounts || []).forEach((a) => { if (a && a.expired) out.push({ what: "TikTok" + (a.username ? " @" + a.username : ""), why: "connexion expirée" }); });
  if (seen.yt && state.youtubeChecked && !(state.ytAccounts || []).length) out.push({ what: "YouTube", why: "la connexion est tombée — à rebrancher" });
  if (seen.gbp && state.gbpChecked && !(state.gbpLocations || []).length) out.push({ what: "Google Business", why: "la connexion est tombée — à rebrancher" });
  return out;
}

/* ---- Notifications sur le téléphone --------------------------------------
   Le journal des échecs ne sert à rien si personne ne va le consulter. Avec
   l'autorisation, Frendo prévient directement : jeton tombé, publication
   échouée. Aucun service extérieur : le navigateur, les clés VAPID, et voilà.
   Sur iPhone, il faut d'abord ajouter Frendo à l'écran d'accueil (contrainte
   d'Apple) ; sur Android ça marche dès la page web. */
const PUSH_OK = typeof navigator !== "undefined" && "serviceWorker" in navigator
  && typeof window !== "undefined" && "PushManager" in window && "Notification" in window;

function b64ToU8(b64) {
  const pad = "=".repeat((4 - (b64.length % 4)) % 4);
  const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
  const out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}

async function swReady() {
  if (!PUSH_OK) return null;
  try { return await navigator.serviceWorker.register("/sw.js"); } catch { return null; }
}

// Met à jour state.pushOn sans rien demander à l'utilisateur.
async function checkPush() {
  if (!PUSH_OK) { state.pushOn = null; return; }
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg ? await reg.pushManager.getSubscription() : null;
    state.pushOn = !!sub && Notification.permission === "granted";
  } catch { state.pushOn = false; }
  if (state.authed && state.view === "settings") renderSettings();
}

async function enablePush() {
  if (!PUSH_OK) { alert("Ce navigateur ne gère pas les notifications. Sur iPhone, ajoutez d'abord Frendo à l'écran d'accueil."); return false; }
  const perm = await Notification.requestPermission();
  if (perm !== "granted") {
    alert(perm === "denied"
      ? "Les notifications ont été refusées. Pour les réactiver, il faut passer par les réglages du navigateur pour ce site."
      : "Autorisation non accordée.");
    return false;
  }
  const reg = await swReady();
  if (!reg) { alert("Le service de notification n'a pas pu démarrer."); return false; }
  const k = await api("/api/stories-schedule", { pwd: state.pwd, action: "push_key" });
  const key = k.ok && k.data && k.data.key;
  if (!key) { alert("Clé de notification absente côté serveur (VAPID_PUBLIC_KEY)."); return false; }
  try {
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(key) });
    const r = await api("/api/stories-schedule", {
      pwd: state.pwd, action: "push_subscribe",
      sub: JSON.parse(JSON.stringify(sub)),
      label: navigator.userAgent.slice(0, 60),
    });
    if (!(r.ok && r.data && r.data.ok)) { alert("Abonnement refusé par le serveur."); return false; }
    state.pushOn = true;
    return true;
  } catch (e) {
    alert("Abonnement impossible : " + ((e && e.message) || e));
    return false;
  }
}

async function disablePush() {
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg ? await reg.pushManager.getSubscription() : null;
    if (sub) {
      await api("/api/stories-schedule", { pwd: state.pwd, action: "push_unsubscribe", endpoint: sub.endpoint });
      await sub.unsubscribe();
    }
  } catch {}
  state.pushOn = false;
  state.pushAsk = false;
  state.pushHelp = false;
}

/* Clic sur une notification -> le bon écran.
   Une alerte « publication échouée » qui retombe sur l'accueil oblige à
   chercher soi-même : autant ne rien envoyer. L'adresse portée par la
   notification (/?v=failed) dit où aller. Frendo étant une page unique, on
   change de vue sans recharger quand il est déjà ouvert — sinon une légende
   en cours de saisie serait perdue. */
const PUSH_VIEWS = { failed: "failed", settings: "settings", history: "history", schedules: "schedules", main: null };
function openFromNotification(url) {
  let v = "";
  try { v = new URL(url, location.origin).searchParams.get("v") || ""; } catch (e) { return; }
  if (!v || !(v in PUSH_VIEWS)) return;
  state.view = PUSH_VIEWS[v];
  if (state.view === "failed") { state.failed = null; loadFailed(); }
  render();
  try { window.scrollTo(0, 0); } catch (e) {}
}
if (PUSH_OK) {
  navigator.serviceWorker.addEventListener("message", (e) => {
    const d = e && e.data;
    if (d && d.type === "poster-open" && state.authed) openFromNotification(d.url || "/");
  });
}

// Ligne discrète : la preuve que les connexions sont surveillées, même quand
// tout va bien. C'est précisément ce que les outils concurrents ne disent pas.
function healthStamp() {
  const h = state.healthReport;
  if (!h || !h.at) return "";
  const d = new Date(h.at);
  // « Ce matin » se juge sur le calendrier, pas sur un nombre d'heures écoulées :
  // un contrôle de 5 h du matin consulté à 16 h n'est plus « il y a peu ».
  const hhmm = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  const jour = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const ecart = Math.round((jour(new Date()) - jour(d)) / 86400000);
  const quand = ecart === 0 ? (d.getHours() < 12 ? "ce matin à " + hhmm : "aujourd'hui à " + hhmm)
    : ecart === 1 ? "hier à " + hhmm
    : "le " + d.toLocaleDateString("fr-CH", { day: "2-digit", month: "2-digit" }) + " à " + hhmm;
  const n = (h.checks || []).length;
  /* Le detail s'ouvre au clic : une alerte qu'on ne peut pas ouvrir ne sert a rien. */
  const detail = state.healthOpen ? `<div class="pagecard" style="padding:12px 14px;margin-top:8px;text-align:left;">
      ${(h.checks || []).slice().sort((x, y) => (x.ok === y.ok) ? 0 : (x.ok ? 1 : -1)).map((c) => `<div style="display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:12px;">
        <span>${c.ok ? "✅" : "⚠️"}</span>
        <span style="flex:1;">
          <b>${escapeHtml(c.name || c.net || "?")}</b> <span class="muted">· ${escapeHtml(c.net || "")}</span>
          ${c.ok ? "" : `<div style="color:#c0564f;line-height:1.4;margin-top:2px;">${escapeHtml(c.error || "erreur non précisée")}</div>`}
        </span>
      </div>`).join("") || '<div class="muted" style="font-size:12px;">Aucun détail enregistré.</div>'}
    </div>` : "";
  if (h.problems > 0) {
    return `<p class="center" style="margin-top:10px;"><button id="health-detail" class="link-btn" style="font-size:11.5px;color:#c0564f;">⚠️ ${h.problems} problème${h.problems > 1 ? "s" : ""} au dernier contrôle, ${quand} ${state.healthOpen ? "▲" : "▼"}</button></p>${detail}`;
  }
  return `<p class="center" style="margin-top:10px;"><button id="health-detail" class="link-btn muted" style="font-size:11.5px;">✅ ${n} connexion${n > 1 ? "s" : ""} vérifiée${n > 1 ? "s" : ""} ${quand} ${state.healthOpen ? "▲" : "▼"}</button></p>${detail}`;
}
