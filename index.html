// Câblage commun des champs de réglage : chaque frappe est enregistrée, sans
// redessiner l'écran pour ne pas casser la saisie en cours.
// Les zones de texte des réglages grandissent avec leur contenu : une
// signature de quatre lignes n'a aucune raison d'être enfermée dans trois
// lignes avec un ascenseur.
function autosize(el) {
  if (!el) return;
  el.style.height = "auto";
  el.style.height = Math.max(el.scrollHeight + 2, 48) + "px";
  el.style.overflowY = "hidden";
}

function wireSettingFields(box) {
  if (!box) return;
  box.querySelectorAll("input[data-tag]").forEach(inp => {
    inp.onclick = (e) => e.stopPropagation();
    inp.oninput = (e) => { saveTags(inp.getAttribute("data-tag"), e.target.value); };
  });
  box.querySelectorAll("textarea[data-sig]").forEach(inp => {
    inp.onclick = (e) => e.stopPropagation();
    inp.oninput = (e) => { saveSig(inp.getAttribute("data-sig"), e.target.value); autosize(inp); };
  });
  box.querySelectorAll("textarea[data-comment]").forEach(inp => {
    inp.onclick = (e) => e.stopPropagation();
    inp.oninput = (e) => { saveComment(inp.getAttribute("data-comment"), e.target.value); autosize(inp); };
  });
  // Ajustement initial : les champs s'ouvrent déjà à la bonne hauteur.
  box.querySelectorAll("textarea.taginput").forEach(autosize);
  box.querySelectorAll("select[data-place]").forEach(sel => {
    sel.onclick = (e) => e.stopPropagation();
    sel.onchange = (e) => { savePlace(sel.getAttribute("data-place"), e.target.value); };
  });
}

/* ---------- Destinations (Fil / Reel / Story) ---------- */
function destAvailability() {
  const m = state.media;
  if (m && m.kind === "carousel") {
    const hasRealVideo = (state.mediaList || []).some(x => x.kind === "video");
    const scheduled = !!state.scheduleAt;
    return {
      feed: { show: true, ok: true },
      reel: { show: true, ok: !!state.slideVideo || hasRealVideo }, // débloqué si diaporama généré OU vraie vidéo dans le carrousel
      story: { show: true, ok: true },       // vraie vidéo, diaporama, ou photos publiées en stories successives
      ig: { show: true, ok: !scheduled },    // carrousel Instagram : jamais programmable (v1), disponible seulement en immédiat
      igstory: { show: true, ok: !scheduled || hasRealVideo || !!state.slideVideo } // programmable seulement si une vidéo existe
    };
  }
  const hasMedia = !!m;
  const hasText = !!(state.caption && state.caption.trim().length > 0);
  const isVideo = m && m.kind === "video";
  const dur = m && m.duration;
  const reelTooLong = isVideo && dur && dur > 180;   // Reels : jusqu'à 3 min
  const storyTooLong = isVideo && dur && dur > 60;   // Story : 60 s max (limite Facebook)
  const igReelTooLong = isVideo && dur && dur > 900;  // Reels Instagram : jusqu'à 15 min
  const igStoryTooLong = isVideo && dur && dur > 60;  // Story Instagram : 60 s max
  return {
    feed: { show: true, ok: hasMedia || hasText },
    reel: { show: true, ok: isVideo && !reelTooLong && (!dur || dur >= 3) },
    story: { show: true, ok: hasMedia && !storyTooLong },
    ig: { show: true, ok: hasMedia && (!isVideo || (!igReelTooLong && (!dur || dur >= 3))) },
    igstory: { show: true, ok: hasMedia && !igStoryTooLong }
  };
}
/* ---- Aperçu exact du texte ------------------------------------------------
   Chez les concurrents, l'aperçu ne correspond pas à ce qui sort : c'est un
   reproche récurrent. Ici l'aperçu appelle composeText() exactement comme le
   fait publish(), avec la signature et les hashtags de CHAQUE page. Ce qui est
   affiché est donc ce qui partira, au caractère près.
   Les limites indiquées sont celles des réseaux, et le texte coupé est montré. */
const NET_LIMITS = { fb: 0, ig: 2200, th: 500, bs: 300, yt: 5000, gbp: 1500 };

function textPreviews() {
  const out = [];
  // Accepte soit une chaîne (YouTube), soit le {text, dropped} de composeInfo.
  const add = (dest, net, info) => {
    const i = (typeof info === "string" || info == null) ? { text: info || "", dropped: [] } : info;
    out.push({ dest, net, text: i.text || "", dropped: i.dropped || [], suites: i.suites || [], limit: NET_LIMITS[net] || 0 });
  };
  (state.pages || []).forEach((p) => {
    const d = pageDests(p);
    if (!d.length) return;
    const name = p.name || "Page";
    if (d.some((x) => x === "feed" || x === "reel" || x === "story")) {
      add(name + " · Facebook", "fb", composeInfo(state.caption, state.pageTags[p.id], state.pageSig[p.id], NET_LIMITS.fb));
    }
    if (d.some((x) => x === "ig" || x === "igstory")) {
      const ig = state.ig && state.ig[p.id];
      add((ig && ig.username ? "@" + ig.username : name) + " · Instagram", "ig",
        composeInfo(state.caption, state.pageTags[p.id + "_ig"], state.pageSig[p.id], NET_LIMITS.ig));
    }
  });
  ytSelected().forEach((a) => {
    const title = (state.caption || "Vidéo Frendo").split("\n")[0].slice(0, 90) || "Vidéo Frendo";
    add((a.title || "YouTube") + " · titre", "yt", title);
    add((a.title || "YouTube") + " · description", "yt", (state.caption ? state.caption + "\n\n" : "") + YT_SIGNATURE);
  });
  thSelected().forEach((a) => {
    add("@" + (a.username || a.key) + " · Threads", "th",
      composeThread(state.caption, state.pageTags["th_" + (a.key || "")], state.pageSig["th_" + (a.key || "")], NET_LIMITS.th));
  });
  bsSelected().forEach((a) => {
    add("@" + (a.handle || a.key) + " · Bluesky", "bs",
      composeThread(state.caption, state.pageTags["bs_" + (a.key || "")], state.pageSig["bs_" + (a.key || "")], NET_LIMITS.bs));
  });
  gbpSelected().forEach((l) => {
    add((l.title || "Google Business") + " · Google Business", "gbp", composeInfo(state.caption, null, null, NET_LIMITS.gbp));
  });
  return out;
}

function textPreviewHtml() {
  const list = textPreviews().filter((x) => x.text);
  if (!list.length) return "";
  // Plus de « trop long » : le texte est désormais ajusté avant l'envoi. On
  // compte les destinations où quelque chose a dû être retiré, et on dit quoi.
  const adapt = list.filter((x) => (x.dropped && x.dropped.length) || (x.suites && x.suites.length)).length;
  return `<details style="margin-top:12px;">
    <summary style="cursor:pointer;font-size:12.5px;font-weight:600;">👁️ Aperçu du texte envoyé (${list.length})${adapt ? ` <span style="color:#b8860b;">· ${adapt} raccourci${adapt > 1 ? "s" : ""}</span>` : ""}</summary>
    ${list.map((x) => {
      const n = x.text.length;
      const dr = x.dropped || [];
      const su = x.suites || [];
      const coupe = dr.includes("la fin du texte");
      return `<div style="margin-top:10px;padding:10px 12px;border:1px solid ${coupe ? "#c0564f" : dr.length ? "#b8860b" : "var(--border)"};border-radius:8px;background:var(--surface);">
        <div style="font-size:12px;font-weight:700;">${escapeHtml(x.dest)}
          <span class="muted" style="font-weight:400;">· ${n} caractère${n > 1 ? "s" : ""}${x.limit ? " / " + x.limit : ""}</span></div>
        ${dr.length ? `<div style="font-size:11.5px;color:${coupe ? "#c0564f" : "#b8860b"};margin-top:4px;">Trop long pour ce réseau : Frendo a retiré ${escapeHtml(dr.join(" puis "))}. Ce qui suit est exactement ce qui partira.${coupe ? "" : " L'adresse reste dans le commentaire automatique."}</div>` : ""}
        ${su.length ? `<div style="font-size:11.5px;color:#2d6a4f;margin-top:4px;">Trop long pour un seul message : la suite part en fil, ${su.length} message${su.length > 1 ? "s" : ""} de plus sous celui-ci. Rien n'est perdu.</div>` : ""}
        <div style="font-size:12px;margin-top:6px;white-space:pre-wrap;line-height:1.5;">${escapeHtml(x.text)}</div>
        ${su.map((m, k) => `<div style="font-size:12px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);white-space:pre-wrap;line-height:1.5;"><span class="muted" style="font-size:11px;">↳ message ${k + 2} · ${m.length} caractères</span><br>${escapeHtml(m)}</div>`).join("")}
      </div>`;
    }).join("")}
  </details>`;
}

/* ---- Contrôle du média avant l'envoi -------------------------------------
   Chez les outils concurrents, une vidéo au mauvais format part en
   programmation et échoue trois jours plus tard, sans explication. Ici, ce qui
   est vérifiable dans le navigateur l'est tout de suite : durée, dimensions,
   poids. On n'empêche rien — on prévient pendant qu'il est encore temps de
   changer le fichier. Les limites viennent des réseaux, pas de Frendo. */
/* Galerie Google Business : la vidéo peut-elle y être déposée ?
   Les limites annoncées par Google sont 30 s, 75 Mo et 720p. Vérification faite
   le 11.10.2026 : une vidéo de 55 s est en ligne, entière, sur la fiche de
   Genève. La durée n'est donc pas appliquée comme elle est écrite — on
   avertit, on ne bloque pas. On ne bloque que ce qui échouera à coup sûr. */
function galleryAvail() {
  const m = state.media;
  if (!m) return { ok: false, why: "aucun média" };
  if (m.kind !== "video") return { ok: false, why: "réservé à la vidéo — une photo part déjà avec la publication" };
  const mo = m.file && m.file.size ? m.file.size / (1024 * 1024) : 0;
  if (mo > 75) return { ok: false, why: Math.round(mo) + " Mo — Google refuse au-delà de 75 Mo" };
  const petit = m.w && m.h ? Math.min(m.w, m.h) : null;
  if (petit && petit < 720) return { ok: false, why: petit + "p — Google demande 720p au minimum" };
  return { ok: true };
}
/* Ce qui partira réellement dans la PUBLICATION Google — écrit sur la case,
   pour qu'on n'ait jamais à le deviner. */
function gbpPubSuffix() {
  const m = state.media;
  if (!m) return "";                                   // texte seul assumé : rien à signaler
  if (state.gbpPhoto && state.gbpPhoto.file) return " — texte + photo";
  if (m.kind === "video") return state.thumbDataUrl ? " — texte + vignette" : " — texte seul";
  return " — texte + photo";
}
function galleryNote() {
  const m = state.media;
  if (!m || m.kind !== "video") return "";
  const out = [];
  const d = Math.round(m.duration || 0);
  const mo = m.file && m.file.size ? m.file.size / (1024 * 1024) : 0;
  /* Les deux limites annoncées par Google sont fausses, et pas dans le même
     sens. La durée : 30 s annoncées, une vidéo de 55 s est en ligne. Le poids :
     75 Mo annoncés, un fichier de 25,6 Mo a été refusé le 11.10.2026 (« Request
     contains an invalid argument », sans autre détail). On avertit donc sur les
     faits observés plutôt que sur la documentation. */
  if (d > 30) out.push("⚠️ " + d + " s — Google annonce 30 s comme limite, mais une vidéo de 55 s est bien en ligne sur votre fiche. Ça devrait passer.");
  if (mo > 20) out.push("⚠️ " + Math.round(mo) + " Mo — Google annonce 75 Mo, mais a refusé un fichier de 25,6 Mo. Au-delà de 20 Mo le dépôt peut échouer ; les autres réseaux, eux, ne sont pas concernés.");
  return out.join(" ");
}

function mediaWarnings() {
  const m = state.media;
  if (!m) return [];
  const out = [];
  const isVideo = m.kind === "video";
  const d = isVideo ? (m.duration || 0) : 0;
  const mo = m.file && m.file.size ? m.file.size / (1024 * 1024) : 0;
  const vertical = (m.w && m.h) ? (m.h > m.w) : null;
  const sec = (x) => Math.round(x) + " s";

  // YouTube : au-delà de 3 min, la vidéo part en vidéo classique, pas en Short.
  if (isVideo && ytSelected().length && d > 180) {
    out.push("YouTube : " + sec(d) + " — au-delà de 3 min ce ne sera pas un Short mais une vidéo classique.");
  }
  // Threads : la vidéo est plafonnée à 5 min.
  if (isVideo && thSelected().length && d > 300) {
    out.push("Threads : " + sec(d) + " — la limite est de 5 min, l'envoi sera refusé.");
  }
  // Bluesky : 60 s et environ 50 Mo, c'est le réseau le plus strict.
  if (bsSelected().length) {
    if (isVideo && d > 60) out.push("Bluesky : " + sec(d) + " — la limite est de 60 s, l'envoi sera refusé.");
    if (mo > 50) out.push("Bluesky : " + Math.round(mo) + " Mo — la limite est d'environ 50 Mo.");
  }
  // Format vertical : attendu par les Shorts, Reels et Stories.
  if (vertical === false) {
    const verticalDests = [];
    if (ytSelected().length) verticalDests.push("Short YouTube");
    if (state.pages.some((p) => (state.pageDest[p.id] || {}).reel)) verticalDests.push("Reel");
    if (state.pages.some((p) => { const x = state.pageDest[p.id] || {}; return x.story || x.igstory; })) verticalDests.push("Story");
    if (verticalDests.length) {
      out.push("Vidéo horizontale (" + m.w + "×" + m.h + ") — " + verticalDests.join(", ") + " attendent du vertical : l'image sera recadrée ou encadrée de noir.");
    }
  }
  /* La PUBLICATION Google Business n'accepte pas la vidéo — limite de l'API,
     pas de Frendo. Mais la GALERIE, elle, l'accepte : l'avertissement n'a donc
     de sens que si la case Galerie n'est pas cochée, sinon il ferait croire à
     une perte alors que la vidéo part bel et bien. */
  if (isVideo && gbpSelected().length && !gbpGallerySelected().length) {
    out.push(galleryAvail().ok
      ? "Google Business : la publication n'accepte pas la vidéo. Cochez 🎬 Galerie pour qu'elle parte quand même sur la fiche — c'est là que se font le plus de vues."
      : "Google Business : seul le texte partira — " + galleryAvail().why + ".");
  }
  /* Photo dédiée oubliée : on le dit AVANT l'envoi, parce que dix secondes de
     correction valent mieux qu'une image recadrée de travers sur la fiche. */
  if (isVideo && gbpSelected().length && !(state.gbpPhoto && state.gbpPhoto.file)) {
    out.push(state.thumbDataUrl
      ? "Google Business : aucune photo dédiée — la vignette verticale de la vidéo sera utilisée, et Google la recadrera. Ajoutez une photo au format paysage pour un meilleur rendu."
      : "Google Business : aucune photo dédiée et aucune vignette — la publication partira en texte seul, sans rien pour montrer le produit.");
  }
  return out;
}

// Explique pourquoi une destination est grisée (durée vidéo).
function destHint() {
  const m = state.media;
  if (!m || m.kind !== "video" || !m.duration) return "";
  const d = Math.round(m.duration);
  const msgs = [];
  if (m.duration < 3) msgs.push("Reel et Insta (fil) indisponibles (vidéo de " + d + " s, minimum 3 s) — Fil Facebook et Stories restent possibles");
  if (m.duration > 180) msgs.push("Reel Facebook indisponible (vidéo de " + d + " s, max 3 min) — Insta reste possible jusqu'à 15 min");
  if (m.duration > 60) msgs.push("Story indisponible (vidéo de " + d + " s, max 60 s sur Facebook)");
  return msgs.join(" · ");
}
// Destinations réellement retenues pour une page (cochées ET possibles avec ce média)
function pageDests(p) {
  const av = destAvailability();
  const d = state.pageDest[p.id] || {};
  const out = [];
  if (av.feed.ok && d.feed) out.push("feed");
  if (av.reel.ok && d.reel) out.push("reel");
  if (av.story.ok && d.story) out.push("story");
  const hasIg = !!(state.ig && state.ig[p.id]);
  if (hasIg && av.ig.ok && d.ig) out.push("ig");
  if (hasIg && av.igstory.ok && d.igstory) out.push("igstory");
  return out;
}
function progressParts() {
  const p = state.progress || {};
  if (p.parallel) {
    return {
      title: "Publication en parallèle",
      step: "",
      count: `${p.doneCount || 0}/${p.total || 0}`,
      list: (p.items || []).map(it => {
        const mark = it.done ? (it.ok ? "✅" : "❌") : "⏳";
        return `<div class="prog-line">${mark} <strong>${escapeHtml(it.name)}</strong> · ${escapeHtml(it.destLabel)} — ${escapeHtml(it.label)}</div>`;
      }).join("")
    };
  }
  const title = p.page
    ? (escapeHtml(p.page) + (p.destLabel ? ` · ${escapeHtml(p.destLabel)}` : ""))
    : (p.label ? escapeHtml(p.label) : "Préparation");
  const step = p.page
    ? (p.label ? escapeHtml(p.label) + (p.pct != null ? ` · ${p.pct}%` : "") : "")
    : (p.pct != null ? `${p.pct}%` : "");
  const count = p.total ? `${p.i}/${p.total}` : "";
  return { title, step, count, list: "" };
}
// ---- Journal de diagnostic (visible pendant la publication et sous les erreurs) ----
const DBG = [];
function dbg(msg) {
  const t = new Date();
  const hh = String(t.getHours()).padStart(2, "0"), mm = String(t.getMinutes()).padStart(2, "0"), ss = String(t.getSeconds()).padStart(2, "0");
  DBG.push(hh + ":" + mm + ":" + ss + "  " + msg);
  if (DBG.length > 14) DBG.shift();
  let el = document.getElementById("prog-dbg");
  if (!el) {
    const prog = document.querySelector(".prog");
    if (prog) { prog.insertAdjacentHTML("beforeend", '<div class="prog-dbg" id="prog-dbg"></div>'); el = document.getElementById("prog-dbg"); }
  }
  if (el) { el.innerHTML = dbgHtml(true); el.scrollTop = el.scrollHeight; }
}
function dbgHtml(inner) {
  const body = DBG.map(escapeHtml).join("\n");
  return inner ? body : (DBG.length ? `<div class="prog-dbg" id="prog-dbg">${body}</div>` : "");
}
function renderProgressPanel() {
  const { title, step, count, list } = progressParts();
  return `<div class="prog">
    <div class="prog-head"><span class="readout">Publication en cours</span><span class="prog-count" id="prog-count">${count}</span></div>
    <div class="prog-page" id="prog-title">${title}</div>
    <div class="prog-step" id="prog-step">${step}</div>
    <div id="prog-list">${list}</div>
    <div class="prog-orb-wrap"><div class="prog-orb"><div class="og1"></div><div class="og2"></div><div class="og3"></div><div class="ologo logo" style="width:auto;height:auto;"></div></div></div>
    ${dbgHtml()}
  </div>`;
}
// Met à jour UNIQUEMENT les textes du panneau (sans re-dessiner la page),
// pour que le gyroscope tourne sans à-coups pendant la publication.
function paintProgress() {
  const t = document.getElementById("prog-title");
  if (!t) { render(); return; } // panneau pas encore affiché → rendu complet une fois
  const { title, step, count, list } = progressParts();
  t.innerHTML = title;
  const s = document.getElementById("prog-step"); if (s) s.innerHTML = step;
  const c = document.getElementById("prog-count"); if (c) c.textContent = count;
  const l = document.getElementById("prog-list"); if (l) l.innerHTML = list;
}

/* ---------- HISTORIQUE DES ENVOIS (léger, conservé sur cet appareil) ---------- */
function loadHistory() { try { return JSON.parse(localStorage.getItem("poster_history") || "[]"); } catch { return []; } }
function addHistory(entry) {
  try {
    const h = loadHistory();
    h.unshift(entry);
    while (h.length > 200) h.pop();
    localStorage.setItem("poster_history", JSON.stringify(h));
  } catch {}
  // Copie cloud : on fusionne d'abord avec le cloud, puis on envoie la liste
  // complète — sinon deux publications rapprochées s'écrasent mutuellement
  // (le stockage cloud met quelques secondes à se propager).
  pushHistoryCloud();
}
async function pushHistoryCloud() {
  try {
    let merged = loadHistory();
    const { ok, data } = await api("/api/stories-schedule", { pwd: state.pwd, action: "hist_list" });
    if (ok && data && data.ok && Array.isArray(data.hist)) {
      const seen = new Set(merged.map(e => (e.ts || 0) + "|" + (e.name || "")));
      data.hist.forEach(e => { const k = (e.ts || 0) + "|" + (e.name || ""); if (!seen.has(k)) { merged.push(e); seen.add(k); } });
      merged.sort((a, b) => (b.ts || 0) - (a.ts || 0));
      merged = merged.slice(0, 200);
      try { localStorage.setItem("poster_history", JSON.stringify(merged)); } catch {}
    }
    api("/api/stories-schedule", { pwd: state.pwd, action: "hist_set", hist: merged });
  } catch {}
}

// Synchronise l'historique avec le cloud : migre l'existant local (une fois),
// puis récupère la liste commune à tous les appareils.
let histSyncing = false;
async function syncHistory() {
  if (histSyncing || !state.pwd) return;
  histSyncing = true;
  try {
    let migrated = false;
    try { migrated = localStorage.getItem("poster_hist_migrated") === "1"; } catch {}
    const local = loadHistory();
    if (!migrated && local.length) {
      await api("/api/stories-schedule", { pwd: state.pwd, action: "hist_add", entries: local });
    }
    try { localStorage.setItem("poster_hist_migrated", "1"); } catch {}
    const { ok, data } = await api("/api/stories-schedule", { pwd: state.pwd, action: "hist_list" });
    if (ok && data && data.ok && Array.isArray(data.hist)) {
      // Fusion cloud + local (jamais d'écrasement : le vide ne gagne pas)
      const localNow = loadHistory();
      const seen = new Set();
      const merged = [];
      [...data.hist, ...localNow].forEach((e) => {
        const k = (e.ts || 0) + "|" + (e.name || "");
        if (!seen.has(k)) { seen.add(k); merged.push(e); }
      });
      merged.sort((a, b) => (b.ts || 0) - (a.ts || 0));
      const capped = merged.slice(0, 200);
      try { localStorage.setItem("poster_history", JSON.stringify(capped)); } catch {}
      // Si le local avait des entrées inconnues du cloud, on répare le cloud
      if (capped.length > data.hist.length) {
        api("/api/stories-schedule", { pwd: state.pwd, action: "hist_set", hist: capped });
      }
      if (state.view === "history") renderHistory(true);
    }
  } catch {}
  histSyncing = false;
}
// Petite vignette 96 px (image ou 1ʳᵉ image de la vidéo) pour l'historique.
function makeThumb(dataUrl, isVideo, cb) {
  const draw = (src, w, h) => {
    try {
      const c = document.createElement("canvas");
      const s = 96 / Math.max(w, h, 1);
      c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
      c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
      cb(c.toDataURL("image/jpeg", 0.7));
    } catch { cb(null); }
  };
  try {
    if (isVideo) {
      const v = document.createElement("video");
      v.preload = "auto"; v.muted = true; v.playsInline = true;
      let done = false;
      const finish = () => { if (done) return; done = true; draw(v, v.videoWidth, v.videoHeight); };
      v.onloadeddata = () => { try { v.currentTime = Math.min(0.3, (v.duration || 1) / 2); } catch { finish(); } };
      v.onseeked = finish;
      v.onerror = () => { if (!done) { done = true; cb(null); } };
      setTimeout(() => { if (!done) { done = true; cb(null); } }, 8000);
      v.src = dataUrl;
    } else {
      const im = new Image();
      im.onload = () => draw(im, im.width, im.height);
      im.onerror = () => cb(null);
      im.src = dataUrl;
    }
  } catch { cb(null); }
}
/* ---------- Boîte de réception : messages Messenger de toutes les pages ---------- */
// Charge la liste des conversations traitées depuis le Blob (partagée entre appareils).
async function loadMsgDone() {
  try {
    const { ok, data } = await api("/api/stories-schedule", { pwd: state.pwd, action: "msg_done_list" });
    state.msgDone = (ok && data && data.ok && data.done && typeof data.done === "object") ? data.done : {};
  } catch { state.msgDone = {}; }
}
// Signale à Facebook que la conversation est lue (remet le compteur non-lu à zéro côté Meta).
async function markSeen(c) {
  if (!c || !c.userId) return;
  try { await fbPost(FBV + c.pageId + "/messages?recipient=" + encodeURIComponent(JSON.stringify({ id: c.userId })) + "&sender_action=mark_seen&access_token=" + encodeURIComponent(c.token)); } catch (_) {}
}
// Marque une conversation comme traitée : lue côté Meta + mémorisée dans le Blob.
async function markDone(c) {
  if (!c) return;
  if (!state.msgDone) state.msgDone = {};
  state.msgDone[c.convId] = Date.now();
  markSeen(c);
  try {
    const { ok, data } = await api("/api/stories-schedule", { pwd: state.pwd, action: "msg_done_mark", convId: c.convId });
    if (!ok || !data || !data.ok) {
      alert("⚠️ Mémoire « traités » non enregistrée : " + ((data && data.error) || "réponse inattendue") + "\nSi le message dit « Action inconnue », c'est que api/stories-schedule.js n'est pas à jour sur Vercel.");
    }
  } catch (e) {
    alert("⚠️ Mémoire « traités » injoignable (réseau) : " + (e && e.message ? e.message : e));
  }
}
async function checkUnread() {
  try {
    const all = [];
    state.igMsgErr = "";
    let permErr = false;
    await Promise.all((state.pages || []).map(async (p) => {
      try {
        const token = await getPageToken(p.id);
        if (!token) return;
        const d = await fbGet(FBV + p.id + "/conversations?fields=participants,updated_time,unread_count,snippet&limit=15&access_token=" + encodeURIComponent(token));
        if (d.error) {
          if ((d.error.message || "").match(/permission|OAuth/i)) permErr = true;
          if (!state.msgLastErr) state.msgLastErr = (d.error.message || "erreur Facebook") + " (page " + p.name + ")";
          return;
        }
        (d.data || []).forEach((c) => {
          const other = ((c.participants && c.participants.data) || []).find((x) => x.id !== p.id);
          all.push({ convId: c.id, pageId: p.id, pageName: p.name, token, who: (other && other.name) || "Client", userId: other && other.id, snippet: c.snippet || "", updated: c.updated_time, unread: c.unread_count || 0 });
        });
        /* Boîte Instagram de la meme page. Instagram passe par la Page Facebook
           (platform=instagram) mais ne fournit ni unread_count ni snippet : on lit
           donc le dernier message et on considere la conversation « en attente »
           tant que ce dernier message ne vient pas de nous. */
        const igAcc = state.ig && state.ig[p.id];
        if (igAcc && igAcc.id) {
          const di = await fbGet(FBV + p.id + "/conversations?platform=instagram&fields=participants,updated_time,messages.limit(1){message,from,created_time,attachments}&limit=15&access_token=" + encodeURIComponent(token));
          if (di.error) {
            if (!state.igMsgErr) state.igMsgErr = (di.error.message || "erreur Instagram") + " (page " + p.name + ")";
          } else {
            (di.data || []).forEach((c) => {
              const parts = (c.participants && c.participants.data) || [];
              const other = parts.find((x) => String(x.id) !== String(igAcc.id));
              const last = ((c.messages && c.messages.data) || [])[0];
              const deNous = !!(last && last.from && String(last.from.id) === String(igAcc.id));
              const piece = !!(last && last.attachments && last.attachments.data && last.attachments.data.length);
              const texte = (last && last.message) || "";
              /* Une reaction a une story ou un partage de publication arrive sans texte
                 ET sans piece jointe : Instagram n'en fournit pas le contenu. Il n'y a
                 donc rien a lire ni a repondre — on ne la compte pas comme en attente. */
              const vide = !texte && !piece;
              all.push({
                convId: c.id, pageId: p.id, pageName: p.name + " · Instagram", token,
                who: "@" + ((other && (other.username || other.name)) || "client"),
                userId: other && other.id,
                snippet: texte || (piece ? "📷 photo" : "réaction ou partage de story"),
                updated: c.updated_time,
                unread: (deNous || vide) ? 0 : 1,
                ig: true, igId: igAcc.id,
              });
            });
          }
        }
      } catch (_) {}
    }));
    if (state.msgDone === null) await loadMsgDone();
    const doneMap = state.msgDone || {};
    // Masque les conversations traitées ; les fait réapparaître (et les dé-marque)
    // si le client a récrit après le traitement (marge de 15 s pour ignorer notre propre réponse).
    const visible = [];
    for (const c of all) {
      const dAt = doneMap[c.convId];
      if (!dAt) { visible.push(c); continue; }
      if (new Date(c.updated).getTime() > dAt + 15000) {
        delete doneMap[c.convId];
        api("/api/stories-schedule", { pwd: state.pwd, action: "msg_done_unmark", convId: c.convId }).catch(() => {});
        visible.push(c);
      }
    }
    visible.sort((a, b) => (b.unread - a.unread) || (new Date(b.updated) - new Date(a.updated)));
    state.msgConvs = visible;
    state.unreadTotal = visible.reduce((s, c) => s + (c.unread || 0), 0);
    if (!visible.length && state.msgLastErr && !state.msgErr) state.msgErr = state.msgLastErr;
    state.msgLastErr = null;
    if (permErr && !visible.length) state.msgErr = "Autorisation manquante : le jeton n'a pas la permission pages_messaging.";
    if ((!state.view || state.view === "main") && !state.busy && !state.done) render();
    else if (state.view === "messages" && !state.msgOpen && !state.msgBusy) renderMessages();
  } catch (_) {}
}
async function loadConversations() {
  state.msgBusy = true; state.msgErr = ""; renderMessages();
  await checkUnread();
  state.msgBusy = false;
  renderMessages();
}
async function openConversation(c) {
  state.msgOpen = c; state.msgThread = null; renderMessages();
  try {
    // Instagram refuse le bloc attachments{...} detaille de Messenger, mais accepte
    // « attachments » tout court : il renvoie alors image_data (url + preview_url).
    const champs = c.ig ? "from,message,created_time,attachments" : "from,message,created_time,attachments{image_data,video_data,file_url,mime_type,name}";
    const d = await fbGet(FBV + c.convId + "/messages?fields=" + champs + "&limit=15&access_token=" + encodeURIComponent(c.token));
    state.msgThread = (d.data || []).reverse();
  } catch (_) { state.msgThread = []; }
  renderMessages();
}
async function sendReply() {

    const r = await fbPost(FBV + c.pageId + "/messages?recipient=" + encodeURIComponent(JSON.stringify({ id: c.userId })) + "&message=" + encodeURIComponent(JSON.stringify({ text: txt })) + "&messaging_type=RESPONSE&access_token=" + encodeURIComponent(c.token));

      alert((r.error.message || "").match(/window|24/i) ? "Message trop ancien : Facebook n'autorise les réponses que dans les 24 h. Réponds via Messenger/Business Suite pour celui-ci." : "Envoi refusé : " + (r.error.message || "erreur"));
    } else {
      if (inp) inp.value = "";
      markDone(c); // réponse envoyée = conversation traitée (elle réapparaîtra si le client récrit)
      openConversation(c);

async function checkComments() {
  try {
    const all = [];
    let permErr = false;
    await Promise.all((state.pages || []).map(async (p) => {
      const token = await getPageToken(p.id);
      if (!token) return;
      // Commentaires Facebook (niveau supérieur uniquement) sur les 10 dernières publications
      try {
        const d = await fbGet(FBV + p.id + "/feed?fields=message,created_time,comments.filter(toplevel).limit(30){from,message,created_time,id}&limit=10&access_token=" + encodeURIComponent(token));
        if (d.error) {
          if ((d.error.message || "").match(/permission|OAuth/i)) permErr = true;
          if (!state.cmtLastErr) state.cmtLastErr = (d.error.message || "erreur Facebook") + " (page " + p.name + ")";
        } else {
          (d.data || []).forEach((post) => {
            ((post.comments && post.comments.data) || []).forEach((cm) => {
              if (cm.from && cm.from.id === p.id) return; // notre propre réponse
              all.push({ commentId: cm.id, pageId: p.id, pageName: p.name, token, network: "fb", who: (cm.from && cm.from.name) || "Client", fromId: (cm.from && cm.from.id) || null, snippet: cm.message || "", updated: cm.created_time, postSnippet: (post.message || "").slice(0, 60) });
            });
          });
        }
      } catch (_) {}
      // Commentaires Instagram sur les 10 dernières publications du compte relié
      const igAcc = state.ig && state.ig[p.id];
      if (igAcc && igAcc.id) {
        try {
          const d2 = await fbGet(FBV + igAcc.id + "/media?fields=caption,timestamp,comments.limit(30){text,timestamp,id,username}&limit=10&access_token=" + encodeURIComponent(token));
          if (d2.error) {
            if ((d2.error.message || "").match(/permission|OAuth/i)) permErr = true;
          } else {
            (d2.data || []).forEach((post) => {
              ((post.comments && post.comments.data) || []).forEach((cm) => {
                if (cm.username && igAcc.username && cm.username.toLowerCase() === igAcc.username.toLowerCase()) return; // notre propre réponse
                all.push({ commentId: cm.id, pageId: p.id, pageName: p.name + " (Instagram)", igUserId: igAcc.id, token, network: "ig", who: cm.username || "Client", snippet: cm.text || "", updated: cm.timestamp, postSnippet: (post.caption || "").slice(0, 60) });
              });
            });
          }
        } catch (_) {}
      }
    }));
    // Commentaires Threads (tous les comptes configurés en un appel)
    try {
      const { ok, data } = await api("/api/threads", { pwd: state.pwd, action: "list_comments" });
      if (ok && data && data.ok) {
        (data.comments || []).forEach((cm) => {
          const acc = (state.thAccounts || []).find((a) => a.key === cm.accountKey);
          all.push({ commentId: cm.commentId, accountKey: cm.accountKey, pageName: (acc ? "@" + acc.username : cm.accountKey) + " (Threads)", network: "threads", who: cm.who, snippet: cm.snippet, updated: cm.updated, postSnippet: cm.postSnippet });
        });
      }
    } catch (_) {}
    // Commentaires Bluesky (tous les comptes configurés en un appel)
    try {
      const { ok, data } = await api("/api/threads", { pwd: state.pwd, action: "bsky_list_comments" });
      if (ok && data && data.ok) {
        (data.comments || []).forEach((cm) => {
          const acc = (state.bsAccounts || []).find((a) => a.key === cm.accountKey);
          all.push({ commentId: cm.commentId, accountKey: cm.accountKey, pageName: (acc ? "@" + acc.handle : cm.accountKey) + " (Bluesky)", network: "bluesky", who: cm.who, snippet: cm.snippet, updated: cm.updated, uri: cm.uri, cid: cm.cid, rootUri: cm.rootUri, rootCid: cm.rootCid });
        });
      }
    } catch (_) {}
    if (state.cmtDone === null) await loadCmtDone();
    const doneMap = state.cmtDone || {};
    const visible = all.filter((c) => !doneMap[c.commentId]);
    visible.sort((a, b) => new Date(b.updated) - new Date(a.updated));
    state.cmtConvs = visible;
    state.unreadCmt = visible.length;
    if (!visible.length && state.cmtLastErr && !state.cmtErr) state.cmtErr = state.cmtLastErr;
    state.cmtLastErr = null;
    if (permErr && !visible.length) state.cmtErr = "Autorisation manquante : le jeton n'a pas la permission pages_manage_engagement / instagram_manage_comments.";
    if ((!state.view || state.view === "main") && !state.busy && !state.done) render();
    else if (state.view === "comments" && !state.cmtOpen && !state.cmtBusy) renderComments();
  } catch (_) {}
}

        .concat(replies.map((r) => ({ who: r.username || "Vous", text: r.text || "", mine: true, created_time: r.timestamp })));
    } else {
      // Threads / Bluesky : pas de fil complet récupéré (API plus limitée) — on affiche le commentaire seul.
      state.cmtThread = [{ who: c.who, text: c.snippet, mine: false, created_time: c.updated }];
    }
  } catch (_) { state.cmtThread = []; }
  renderComments();
}
async function sendCommentReply() {

  try {
    let sent = false, errMsg = "erreur";
    if (c.network === "fb" || c.network === "ig") {
      const url = c.network === "fb"
        ? FBV + c.commentId + "/comments?message=" + encodeURIComponent(txt) + "&access_token=" + encodeURIComponent(c.token)
        : FBV + c.commentId + "/replies?message=" + encodeURIComponent(txt) + "&access_token=" + encodeURIComponent(c.token);
      const r = await fbPost(url);
      if (r.error) errMsg = r.error.message || "erreur"; else sent = true;
    } else if (c.network === "threads") {
      const { ok, data } = await api("/api/threads", { pwd: state.pwd, action: "reply_comment", accountKey: c.accountKey, commentId: c.commentId, text: txt });
      if (ok && data && data.ok) sent = true; else errMsg = (data && data.error) || "erreur";
    } else if (c.network === "bluesky") {
      const { ok, data } = await api("/api/threads", { pwd: state.pwd, action: "bsky_reply_comment", accountKey: c.accountKey, uri: c.uri, cid: c.cid, rootUri: c.rootUri, rootCid: c.rootCid, text: txt });
      if (ok && data && data.ok) sent = true; else errMsg = (data && data.error) || "erreur";
    }
    if (!sent) {
      alert("Envoi refusé : " + errMsg);
    } else {
      if (inp) inp.value = "";
      markCmtDone(c);
      openComment(c);
    }
  } catch (_) { alert("Envoi impossible (réseau)."); }
  if (btn) { btn.disabled = false; btn.textContent = "Envoyer"; }
}
/* ---------- Modération d'un commentaire ----------
   Masquer vaut mieux que supprimer : l'auteur continue de voir son propre
   commentaire, il ne se sait donc pas censuré et ne revient pas en écrire
   trois autres, tandis que plus personne d'autre ne le voit. La suppression
   et le blocage restent disponibles, mais derrière une confirmation. */
async function cmtMasquer(c, cacher) {
  if (!c || !c.commentId) return;
  const btn = document.getElementById("cmt-hide");
  if (btn) { btn.disabled = true; btn.textContent = "⏳"; }
  try {
    let r;
    if (c.network === "fb") {
      r = await fbPost(FBV + c.commentId + "?is_hidden=" + (cacher ? "true" : "false") + "&access_token=" + encodeURIComponent(c.token));
    } else if (c.network === "ig") {
      r = await fbPost(FBV + c.commentId + "?hide=" + (cacher ? "true" : "false") + "&access_token=" + encodeURIComponent(c.token));
    } else {
      alert("Le masquage n'est pas possible sur ce réseau.");
      if (btn) { btn.disabled = false; btn.textContent = "🙈 Masquer"; }
      return;
    }
    if (r && r.error) {
      alert("Refusé : " + (r.error.message || "erreur"));
    } else {
      c.hidden = !!cacher;
      if (cacher) markCmtDone(c);
    }
  } catch (e) {
    alert("Réseau : " + ((e && e.message) || e));
  }
  renderComments();
}
async function cmtSupprimer(c) {
  if (!c || !c.commentId) return;
  if (!confirm("Supprimer définitivement ce commentaire ?\n\nIl disparaîtra pour tout le monde, y compris pour son auteur — qui le remarquera peut-être. Masquer est souvent préférable.")) return;
  try {
    const r = await fbDelete(FBV + c.commentId + "?access_token=" + encodeURIComponent(c.token));
    if (r && r.error) { alert("Refusé : " + (r.error.message || "erreur")); return; }
    markCmtDone(c);
    state.cmtOpen = null; state.cmtThread = null;
    state.cmtConvs = (state.cmtConvs || []).filter((x) => x.commentId !== c.commentId);
    state.unreadCmt = (state.cmtConvs || []).length;
    renderComments();
  } catch (e) { alert("Réseau : " + ((e && e.message) || e)); }
}
async function cmtBloquer(c) {
  if (!c) return;
  if (c.network !== "fb") {
    alert("Instagram ne permet pas de bloquer quelqu'un depuis une application : il faut le faire dans l'application Instagram, sur le profil de la personne.");
    if (c.who) window.open("https://www.instagram.com/" + encodeURIComponent(c.who.replace(/^@/, "")) + "/", "_blank", "noopener");
    return;
  }
  if (!c.fromId) { alert("Identifiant de l'auteur inconnu — actualisez la liste des commentaires, puis réessayez."); return; }
  if (!confirm("Bloquer " + c.who + " de la page " + c.pageName + " ?\n\nLa personne ne pourra plus commenter ni écrire à la page. À savoir avant de valider : Facebook refuse de rebloquer quelqu'un qu'on vient de débloquer, et une personne bloquée le raconte parfois ailleurs.\n\nMasquer son commentaire suffit dans la plupart des cas.")) return;
  try {
    const r = await fbPost(FBV + c.pageId + "/blocked?user=" + encodeURIComponent(c.fromId) + "&access_token=" + encodeURIComponent(c.token));
    if (r && r.error) { alert("Refusé : " + (r.error.message || "erreur")); return; }
    alert("✅ " + c.who + " est bloqué de la page " + c.pageName + ".");
  } catch (e) { alert("Réseau : " + ((e && e.message) || e)); }
}

  root.innerHTML = `

/* ---------- 📊 Stats : performance des dernières publications (Facebook + Instagram) ---------- */
// Score d'engagement simple, façon community manager : commentaire vaut 2 j'aime, partage en vaut 3.
async function loadStats() {
  state.statsBusy = true; state.statsErr = ""; renderStats(true);
  const posts = [];
  const fbErrs = [];
  try {
    for (const p of state.pages) {
      const token = await getPageToken(p.id);
      if (!token) continue;
      // Publications Facebook de la page
      try {
        const d = await fbGet(FBV + p.id + "/posts?fields=message,created_time,permalink_url,attachments{media_type},shares,likes.summary(true),comments.summary(true).limit(30){from},insights.metric(post_media_view)&limit=10&access_token=" + encodeURIComponent(token));
        if (d.error) fbErrs.push((p.name || p.id) + " [jeton …" + String(token).slice(-8) + "] : " + (d.error.message || "erreur inconnue").slice(0, 80));
        for (const m of (d.data || [])) {
          const likes = (m.likes && m.likes.summary && m.likes.summary.total_count) || 0;
          // Le commentaire automatique de Frendo (horaires, adresses) est poste par
          // la page elle-meme : le compter fausserait tous les scores, qui
          // partiraient tous a 2. On ne garde que les commentaires des visiteurs.
          const allComments = (m.comments && m.comments.summary && m.comments.summary.total_count) || 0;
          const ownComments = ((m.comments && m.comments.data) || []).filter(c => c && c.from && String(c.from.id) === String(p.id)).length;
          const comments = Math.max(0, allComments - ownComments);
          const shares = (m.shares && m.shares.count) || 0;
          let views = null;
          try {
            const iv = m.insights && m.insights.data && m.insights.data[0] && m.insights.data[0].values && m.insights.data[0].values[0];
            if (iv && iv.value != null) views = iv.value;
          } catch (_) {}
          const mt = (m.attachments && m.attachments.data && m.attachments.data[0] && m.attachments.data[0].media_type) || "";
          posts.push({
            net: "fb", pageName: p.name || "", msg: m.message || "", date: m.created_time,
            url: m.permalink_url || "", kind: /video/i.test(mt) ? "🎬" : (/photo|album/i.test(mt) ? "📷" : "📝"),
            likes, comments, shares, views, score: likes + comments * 2 + shares * 3,
          });
        }
      } catch (_) {}
      // Publications Instagram du compte relié (si présent)
      const ig = state.ig[p.id];
      if (ig && ig.id) {
        try {
          const d = await fbGet(FBV + ig.id + "/media?fields=caption,media_type,permalink,timestamp,like_count,comments_count,comments.limit(30){username},insights.metric(views)&limit=10&access_token=" + encodeURIComponent(token));
          for (const m of (d.data || [])) {
            const likes = m.like_count || 0;
            // Meme correction que pour Facebook : on retire les commentaires
            // postes par le compte lui-meme.
            const allC = m.comments_count || 0;
            const ownC = ((m.comments && m.comments.data) || []).filter(c => c && c.username && ig.username && String(c.username).toLowerCase() === String(ig.username).toLowerCase()).length;
            const comments = Math.max(0, allC - ownC);
            let views = null;
            try {
              const iv = m.insights && m.insights.data && m.insights.data[0] && m.insights.data[0].values && m.insights.data[0].values[0];
              if (iv && iv.value != null) views = iv.value;
            } catch (_) {}
            posts.push({
              net: "ig", pageName: ig.username ? "@" + ig.username : (p.name || ""), msg: m.caption || "", date: m.timestamp,
              url: m.permalink || "", kind: m.media_type === "VIDEO" ? "🎬" : (m.media_type === "CAROUSEL_ALBUM" ? "🖼️" : "📷"),
              likes, comments, shares: 0, views, score: likes + comments * 2,
            });
          }
        } catch (_) {}
      }
    }
    // Threads + Bluesky (via la fonction serveur)
    try {
      const { ok, data } = await api("/api/threads", { pwd: state.pwd, action: "stats" });
      if (ok && data && data.ok) {
        const KMAP = { VIDEO: "🎬", IMAGE: "📷", CAROUSEL_ALBUM: "🖼️" };
        for (const p of (data.posts || [])) {
          posts.push({
            net: p.net, pageName: p.account || "", msg: p.text || "", date: p.date,
            url: p.url || "", kind: KMAP[p.kind] || "📝",
            likes: p.likes || 0, comments: p.comments || 0, shares: p.shares || 0, views: p.views != null ? p.views : null,
            score: (p.likes || 0) + (p.comments || 0) * 2 + (p.shares || 0) * 3,
          });
        }
      }
    } catch (_) {}
    posts.sort((a, b) => b.score - a.score);
    state.statsData = posts;
    saveBestSlots(posts); // les créneaux conseillés de l'écran de rédaction suivent ces chiffres
    if (fbErrs.length) state.statsErr = "Facebook n'a pas fourni les publications de : " + fbErrs.join(" · ");
    if (!posts.length) state.statsErr = "Aucune publication trouvée (ou jetons sans accès lecture)." + (fbErrs.length ? " Détail : " + fbErrs.join(" · ") : "");
  } catch (e) {
    state.statsErr = "Chargement impossible : " + (e && e.message ? e.message : e);
  }
  state.statsBusy = false; renderStats(true);
}
// Rapports de verification, indexes par publication. Charges une fois par

// Rend l'etat d'une destination verifiee : pastille + apercu + lien.
function verifyBadge(entryId, it) {
  const rep = state.verifyReports && entryId ? state.verifyReports[entryId] : null;
  if (!rep) return "";
  const c = (rep.items || []).find((x) => x.dest === it.dest && x.name === it.name);
  if (!c) return "";
  if (c.status === "ok") return ` <span title="Verifie en ligne" style="font-size:11px;">🟢</span>`;
  if (c.status === "expired") return ` <span class="muted" style="font-size:11px;">— Story expiree (normal)</span>`;
  if (c.status === "unsupported") return "";
  const why = c.error ? " : " + escapeHtml(c.error) : "";
  return ` <span style="font-size:11px;color:var(--maple);">🔴 introuvable en ligne${why}</span>`;
}

/* ---------- Fermetures exceptionnelles des fiches Google ----------
   Fermer un jour, c'est aujourd'hui quatre endroits a modifier et un oubli

function fermJours(debut, fin) {
  if (!debut) return [];
  const d1 = new Date(debut + "T12:00:00");
  const d2 = fin ? new Date(fin + "T12:00:00") : d1;
  if (isNaN(d1.getTime()) || isNaN(d2.getTime()) || d2 < d1) return [];
  const out = [];
  for (let d = new Date(d1); d <= d2 && out.length < 60; d.setDate(d.getDate() + 1)) {
    out.push(d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"));
  }
  return out;
}
function fermTexte(d) {
  if (!d) return "";
  return String(d.day).padStart(2, "0") + "." + String(d.month).padStart(2, "0") + "." + d.year;
}
async function fermAppliquer(dates, closed) {
  const noms = (state.fermLocs || []).map((l) => l.location_name).filter((n) => state.fermSel[n]);
  if (!noms.length) { alert("Choisissez au moins un magasin."); return; }
  if (!dates.length) { alert("Choisissez une date."); return; }
  state.fermBusy = true; renderFermetures();
  try {
    const { ok, data } = await api("/api/youtube", { pwd: state.pwd, action: "gbp_hours_set", location_names: noms, dates, closed });
    const rs = (data && data.results) || [];
    const kos = rs.filter((r) => !r.ok);
    if (!ok || !data || !data.ok) {
      alert("Échec : " + ((data && data.error) || "réponse inattendue"));
    } else if (kos.length) {
      alert("Refusé pour " + kos.length + " établissement(s) :\n" + kos.map((r) => "· " + r.error).join("\n"));
    }
  } catch (e) {
    alert("Réseau : " + ((e && e.message) || e));
  }
  state.fermBusy = false;
  state.fermLocs = null;
  await loadFermetures();
}
function renderFermetures() {
  let body = "";
  if (state.fermBusy) {
    body = '<div class="muted center" style="padding:30px 0;">Lecture des fiches Google…</div>';
  } else if (state.fermErr) {
    body = `<div class="pagecard" style="padding:14px;color:#9b1c2e;">${escapeHtml(state.fermErr)}</div>`;
  } else if (state.fermLocs && state.fermLocs.length) {
    const auj = new Date(); auj.setHours(0, 0, 0, 0);
    body = state.fermLocs.map((l) => {
      const periodes = ((l.specialHours && l.specialHours.specialHourPeriods) || [])
        .filter((p) => p && p.startDate)
        .sort((a, b) => (a.startDate.year - b.startDate.year) || (a.startDate.month - b.startDate.month) || (a.startDate.day - b.startDate.day));
      const aVenir = periodes.filter((p) => new Date(p.startDate.year, p.startDate.month - 1, p.startDate.day) >= auj);
      return `<div class="pagecard" style="padding:14px;margin-bottom:10px;">
        <label style="display:flex;align-items:center;gap:10px;cursor:pointer;">
          <input type="checkbox" class="ferm-loc" data-loc="${escapeHtml(l.location_name)}" ${state.fermSel[l.location_name] ? "checked" : ""}>
          <span style="font-weight:600;">${escapeHtml(l.title || l.location_name)}</span>
        </label>
        ${l.error ? `<div style="color:#c0564f;font-size:12px;margin-top:6px;">${escapeHtml(l.error)}</div>` : ""}
        <div class="muted" style="font-size:11.5px;margin-top:8px;">${aVenir.length ? "Fermetures à venir :" : "Aucune fermeture enregistrée à venir."}</div>
        ${aVenir.map((p) => `<div style="display:flex;align-items:center;gap:8px;font-size:13px;margin-top:5px;">
          <span>🚪 ${fermTexte(p.startDate)}${p.closed === false ? " (horaires spéciaux)" : ""}</span>
          <button class="btn-ghost ferm-undo" data-loc="${escapeHtml(l.location_name)}" data-date="${p.startDate.year}-${String(p.startDate.month).padStart(2, "0")}-${String(p.startDate.day).padStart(2, "0")}" style="padding:2px 8px;font-size:11px;">Rouvrir</button>
        </div>`).join("")}
      </div>`;
    }).join("");
    body += `<div class="pagecard" style="padding:14px;margin-top:4px;">
      <div style="font-weight:600;font-size:13px;">Fermer une ou plusieurs journées</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;align-items:flex-end;">
        <div><div class="muted" style="font-size:11.5px;">Du</div><input type="date" id="ferm-debut" class="field" value="${escapeHtml(state.fermDebut)}" style="font-size:15px;"></div>
        <div><div class="muted" style="font-size:11.5px;">Au (facultatif)</div><input type="date" id="ferm-fin" class="field" value="${escapeHtml(state.fermFin)}" style="font-size:15px;"></div>
        <button id="ferm-go" class="btn-ghost" style="padding:9px 16px;font-weight:600;">🚪 Fermer</button>
      </div>
      <div class="muted" style="font-size:11.5px;margin-top:10px;line-height:1.5;">La fermeture part immédiatement sur la fiche Google des magasins cochés. Google l'affiche aux clients à la place des horaires habituels, et vos horaires normaux reprennent tout seuls le lendemain. Rien n'est publié sur les réseaux sociaux — c'est un autre geste.</div>
    </div>`;
  } else if (state.fermLocs) {
    body = '<div class="muted center" style="padding:30px 0;">Aucune fiche Google connectée.</div>';
  }
  root.innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;">
      <button id="ferm-back" class="btn-ghost" style="padding:8px 14px;">← Retour</button>
      <h1 class="serif" style="font-size:18px;color:var(--title);">🚪 Fermetures</h1>${aideBouton("fermetures")}
      <button id="ferm-refresh" class="btn-ghost" style="padding:6px 12px;margin-left:auto;font-size:12px;">↻ Actualiser</button>
    </div>
    ${body}`;
  const _b = document.getElementById("ferm-back");
  if (_b) _b.onclick = () => { state.view = "main"; render(); window.scrollTo(0, 0); };
  const _r = document.getElementById("ferm-refresh");
  if (_r) _r.onclick = () => { state.fermLocs = null; loadFermetures(); };
  document.querySelectorAll(".ferm-loc").forEach((el) => {
    el.onchange = () => { state.fermSel[el.getAttribute("data-loc")] = el.checked; };
  });
  const _d = document.getElementById("ferm-debut");
  if (_d) _d.onchange = () => { state.fermDebut = _d.value; };
  const _f = document.getElementById("ferm-fin");
  if (_f) _f.onchange = () => { state.fermFin = _f.value; };
  const _g = document.getElementById("ferm-go");
  if (_g) _g.onclick = () => {
    const debut = (document.getElementById("ferm-debut") || {}).value || "";
    const fin = (document.getElementById("ferm-fin") || {}).value || "";
    state.fermDebut = debut; state.fermFin = fin;
    const jours = fermJours(debut, fin);
    if (!jours.length) { alert("Choisissez une date de début, et une date de fin postérieure si vous en mettez une."); return; }
    const quoi = jours.length === 1 ? "le " + jours[0].split("-").reverse().join(".") : jours.length + " journées";
    if (!confirm("Fermer " + quoi + " sur les fiches Google cochées ?")) return;
    fermAppliquer(jours, true);
  };
  document.querySelectorAll(".ferm-undo").forEach((el) => {
    el.onclick = () => {
      const loc = el.getAttribute("data-loc"), d = el.getAttribute("data-date");
      if (!confirm("Rouvrir le " + d.split("-").reverse().join(".") + " ?")) return;
      const garde = { ...state.fermSel };
      state.fermSel = {}; state.fermSel[loc] = true;
      fermAppliquer([d], false).then(() => { state.fermSel = garde; renderFermetures(); });
    };
  });
}
/* ---------- Administration des comptes clients ----------
   Écran réservé au propriétaire : il vit derrière le mot de passe de
   l'application, que seul Stéphane connaît. C'est d'ici qu'on crée un compte,
   qu'on offre des mois, qu'on récupère le lien de connexion tant que l'envoi
   de courriels n'existe pas, et qu'on libère le commerce d'un client parti. */
async function loadComptes() {
  state.admBusy = true; state.admErr = ""; renderComptes();
  try {
    const a = await api("/api/stories-schedule", { pwd: state.pwd, action: "compte_liste" });
    const b = await api("/api/stories-schedule", { pwd: state.pwd, action: "compte_actifs" });
    state.admComptes = (a.ok && a.data && a.data.ok) ? (a.data.comptes || []) : [];
    state.admActifs = (b.ok && b.data && b.data.ok) ? (b.data.actifs || {}) : {};
    if (!a.ok || !a.data || !a.data.ok) state.admErr = (a.data && a.data.error) || "Lecture impossible. Si le message parle d'action inconnue, api/stories-schedule.js n'est pas à jour.";
  } catch (e) {
    state.admErr = "Réseau : " + ((e && e.message) || e);
    state.admComptes = []; state.admActifs = {};
  }
  state.admBusy = false; renderComptes();
}
async function admAction(payload, apres) {
  state.admBusy = true; renderComptes();
  try {
    const { ok, data } = await api("/api/stories-schedule", { pwd: state.pwd, ...payload });
    if (!ok || !data || !data.ok) { alert((data && data.error) || "Échec."); }
    else if (apres) apres(data);
  } catch (e) { alert("Réseau : " + ((e && e.message) || e)); }
  state.admBusy = false;
  state.admComptes = null;
  await loadComptes();
}
function admEtatTexte(c) {
  const e = c.etat || {};
  if (e.statut === "actif") return "client payant";
  if (e.statut === "suspendu") return "suspendu";
  if (e.statut === "essai") return "essai · " + e.joursRestants + (e.joursRestants > 1 ? " jours restants" : " jour restant");
  return "figé — ne publie plus";
}

/* ---------- Aperçu de ce que verra le client ----------
   Rien n'est branché : on dessine les écrans pour pouvoir les juger et les
   corriger avant qu'un vrai client les voie. La session du propriétaire n'est
   jamais touchée. */
/* L'apercu ne redessine rien : il appelle les vrais ecrans du client avec un
   compte fictif. Ce que l'on voit ici est, au pixel pres, ce que verra le
   client — sinon ce serait un ersatz et les corrections porteraient a faux. */
const AP_MOMENTS = [
  { cle: "connexion", titre: "Arrivée" },
  { cle: "essai",     titre: "Essai (47 j)" },
  { cle: "fin",       titre: "Dernière semaine" },
  { cle: "fige",      titre: "Essai terminé" },
  { cle: "actif",     titre: "Abonné" },
];
function apercuCompteFictif() {
  const m = state.apVue;
  state.cliCompte = { nom: "Boulangerie du Lac", email: "contact@boulangerie-du-lac.ch" };
  state.cliPages = (m === "actif" || m === "fin") ? [{ id: "1", name: "Boulangerie du Lac" }] : [];
  if (m === "essai")      state.cliEtat = { statut: "essai", joursRestants: 47, peutPublier: true };
  else if (m === "fin")   state.cliEtat = { statut: "essai", joursRestants: 5, peutPublier: true };
  else if (m === "fige")  state.cliEtat = { statut: "fige", joursRestants: 0, peutPublier: false };
  else                    state.cliEtat = { statut: "actif", joursRestants: null, peutPublier: true };
}

      <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;">${onglets}</div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:7px;">
        <span style="font-size:11.5px;font-weight:600;white-space:nowrap;" title="Écran réel, compte fictif">👁 Aperçu · ${APP_VERSION} · ${API_LOT}</span>
        <button id="ap-quit" class="link-btn" style="font-size:12px;">Quitter l'aperçu</button>
      </div>
    </div>`;
  document.body.appendChild(barre);
  barre.querySelectorAll(".ap-tab").forEach((b) => {
    b.onclick = () => { state.apVue = b.getAttribute("data-ap"); render(); window.scrollTo(0, 0); };

/* ---------- Côté client : connexion et espace ----------
   Volontairement separe de l'entree du proprietaire : son mot de passe ouvre
   l'outil complet, l'adresse de courriel ouvre un compte client. Les deux
   chemins ne se croisent jamais. */
async function cliDemanderLien(creer) {
  const champ = document.getElementById("cli-email");
  const email = (champ && champ.value || "").trim();
  if (!email) { state.cliErr = "Indiquez votre adresse."; render(); return; }
  if (state.apercu) {   // aperçu : aucun courriel ne part vraiment
    state.cliMsg = "✉️ C'est parti — regardez votre boîte de courriel. Le lien vaut 30 minutes.";
    state.cliErr = ""; render(); return;
  }
  state.cliBusy = true; state.cliErr = ""; state.cliMsg = ""; render();
  try {
    const { ok, data } = await api("/api/stories-schedule", {
      action: creer ? "compte_inscrire" : "compte_lien_public",
      email, base: location.origin,
    });
    if (!ok || !data || data.ok === false) {
      state.cliErr = (data && data.error) || "Impossible pour le moment.";
    } else if (data.envoye) {
      state.cliMsg = "✉️ C'est parti — regardez votre boîte de courriel. Le lien vaut 30 minutes.";
    } else {
      state.cliErr = "Le compte est bien là, mais l'envoi de courriels n'est pas encore branché" + (data.raison ? " (" + data.raison + ")" : "") + ".";
    }
  } catch (e) { state.cliErr = "Réseau : " + ((e && e.message) || e); }
  state.cliBusy = false; render();
}

/* Un client connecte doit obtenir la meme application que le proprietaire,
   avec SES pages et SES donnees. Tout le reste de l'interface ignore la
   difference : c'est api() qui porte l'identite, et le serveur qui range au
   bon endroit. On refait donc ici, pour lui, ce que init() fait pour le
   proprietaire. */
async function demarrerEspaceClient() {
  const { ok, data } = await api("/api/pages", {});
  state.pages = (ok && data && Array.isArray(data.pages)) ? data.pages : [];
  state.cliPages = state.pages;
  if (state.pages.length) {
    seedPages(); detectInstagram(); detectTikTok(); detectYouTube();
    detectThreads(); detectBluesky(); detectGbp(); loadPlan();
    setTimeout(checkUnread, 2500); setTimeout(checkComments, 3200);
  }
  setTimeout(loadVerifyReports, 2200);
}

/* Ouverture d'une session a partir du lien recu par courriel. On nettoie
   aussitot l'adresse de la barre : un lien de connexion qui traine dans
   l'historique du navigateur est un lien qu'on peut rejouer. */
async function cliOuvrirDepuisLien(jeton) {
  try {
    const { ok, data } = await api("/api/stories-schedule", { action: "compte_ouvrir", jeton });
    if (ok && data && data.ok) {
      state.cliSession = data.session; state.cliCompte = data.compte; state.cliEtat = data.etat;
      try { localStorage.setItem("frendo_session", data.session); } catch (e) {}
      return true;
    }
    state.cliVue = "connexion";
    state.cliErr = (data && data.error) || "Lien invalide.";
  } catch (e) { state.cliVue = "connexion"; state.cliErr = "Réseau : " + ((e && e.message) || e); }
  return false;
}
async function cliReprendreSession() {
  let sid = null;
  try { sid = localStorage.getItem("frendo_session") || null; } catch (e) {}
  if (!sid) return false;
  try {
    const { ok, data } = await api("/api/stories-schedule", { action: "compte_session", session: sid });
    if (ok && data && data.ok) {
      state.cliSession = sid; state.cliCompte = data.compte; state.cliEtat = data.etat;
      return true;
    }
  } catch (e) {}
  try { localStorage.removeItem("frendo_session"); } catch (e) {}
  return false;
}
function cliQuitter() {
  if (state.apercu) { state.apVue = "connexion"; render(); window.scrollTo(0, 0); return; }
  const sid = state.cliSession;
  state.cliSession = null; state.cliCompte = null; state.cliEtat = null; state.cliVue = null;
  try { localStorage.removeItem("frendo_session"); } catch (e) {}
  if (sid) api("/api/stories-schedule", { action: "compte_deconnecter", session: sid }).catch(() => {});
  render();
}
async function cliChargerPages() {
  state.cliPagesBusy = true;
  try {
    const { ok, data } = await api("/api/pages", { session: state.cliSession });
    state.cliPages = (ok && data && Array.isArray(data.pages)) ? data.pages : [];
    if (state.cliPages.length && !state.pages.length) { await demarrerEspaceClient(); render(); return; }
  } catch (e) { state.cliPages = []; }
  state.cliPagesBusy = false;
  if (state.cliCompte) render();
}

/* ---- L'assistant -----------------------------------------------------------
   Les petits « i » repondent a la question posee a l'endroit ou elle se pose.
   Restent toutes les autres : celles qu'on n'avait pas prevues, un samedi a
   21 h. Quelqu'un qui bloque a ce moment-la n'ecrit pas un mail et n'attend
   pas lundi — il abandonne. D'ou ce bouton.

   Le robot ne sait que ce qui est ecrit dans lib/_savoir.js, et il a pour
   consigne de dire qu'il ne sait pas plutot que d'inventer. Un assistant qui
   invente une fonction inexistante fait perdre une heure, puis la confiance.

   La conversation vit dans state.botMsgs : on peut fermer la fenetre, aller
   voir l'ecran dont on parle, et revenir sans avoir tout reperdu. */
const BOT_SUGGESTIONS = [
  "Je ne vois pas mes pages Facebook, pourquoi ?",
  "Quelle différence entre un Fil, un Reel et une Story ?",
  "Mon Instagram n'apparaît pas dans la liste",
  "À quoi sert la rediffusion ?",
];

/* Le modele ecrit en Markdown par habitude : des **etoiles** autour de ce
   qu'il veut mettre en gras, des tirets devant ses listes. Affiche tel quel,
   ca donne des asterisques au milieu du texte — ce qui, sur un ecran
   d'assistance, fait exactement l'effet d'un outil mal fini. On traduit donc
   le strict minimum, et on echappe AVANT de poser les balises : jamais
   l'inverse, sinon une reponse contenant du HTML s'executerait. */
function botTexte(t) {
  return String(t || "").split("\n").map((ligne) => {
    if (!ligne.trim()) return `<div class="bot-air"></div>`;
    const puce = /^\s*[-•*]\s+/.test(ligne);
    const corps = escapeHtml(puce ? ligne.replace(/^\s*[-•*]\s+/, "") : ligne)
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    return puce ? `<div class="bot-puce">• ${corps}</div>` : `<div>${corps}</div>`;
  }).join("");
}

function botOuvrir() {
  if (!state.botMsgs) state.botMsgs = [];
  const ov = document.createElement("div");
  ov.className = "aide-ov";
  ov.innerHTML = `<div class="bot-box">
    <div class="bot-h">
      <span style="font-size:16px;">💬</span>
      <div style="flex:1;">
        <div style="font-weight:700;font-size:14.5px;line-height:1.2;">Besoin d'aide ?</div>
        <div class="muted" style="font-size:11px;margin-top:2px;">Posez votre question sur Frendo.</div>
      </div>
      <button class="bot-x" aria-label="Fermer" style="background:none;border:none;font-size:19px;cursor:pointer;color:var(--muted);line-height:1;padding:0 2px;">✕</button>
    </div>
    <div class="bot-fil" id="bot-fil"></div>
    <div class="bot-p">
      <textarea id="bot-q" class="field" rows="2" style="min-height:auto;resize:none;font-size:13.5px;" placeholder="Votre question…"></textarea>
      <button id="bot-go" class="btn-ghost" style="width:100%;margin-top:8px;padding:10px;font-size:13px;font-weight:600;">Envoyer</button>
    </div>
  </div>`;
  document.body.appendChild(ov);

  const fil = ov.querySelector("#bot-fil");
  const champ = ov.querySelector("#bot-q");
  const go = ov.querySelector("#bot-go");

  const peindre = () => {
    fil.innerHTML = state.botMsgs.length
      ? state.botMsgs.map((m) => m.role === "user"
          ? `<div class="bot-m moi">${escapeHtml(m.content)}</div>`
          : `<div class="bot-m lui">${botTexte(m.content)}</div>`).join("")
      : `<div class="muted" style="font-size:12.5px;line-height:1.55;margin-bottom:13px;">
           Je connais l'application et je réponds tout de suite. Si je ne sais pas, je le dis —
           vous écrivez alors à <b>contact@frendo.ch</b>.
         </div>`
        + BOT_SUGGESTIONS.map((q) => `<button class="bot-q" data-q="${escapeHtml(q)}">${escapeHtml(q)}</button>`).join("");
    if (state.botBusy) {
      fil.insertAdjacentHTML("beforeend", `<div class="bot-m lui muted"><span class="spin" style="border-top-color:var(--maple);"></span> Je cherche…</div>`);
    }
    fil.scrollTop = fil.scrollHeight;
    fil.querySelectorAll(".bot-q").forEach((b) => {
      b.onclick = () => demander(b.getAttribute("data-q"));
    });
  };

  const demander = async (texte) => {
    const q = String(texte || "").trim();
    if (!q || state.botBusy) return;
    state.botMsgs.push({ role: "user", content: q });
    state.botBusy = true;
    champ.value = "";
    peindre();
    const { ok, data } = await api("/api/improve", {
      action: "aide",
      question: q,
      historique: state.botMsgs.slice(0, -1).slice(-8),
    });
    state.botBusy = false;
    state.botMsgs.push({
      role: "assistant",
      content: ok && data.reponse
        ? data.reponse
        : "Je n'arrive pas à répondre pour l'instant" + (data && data.error ? " (" + data.error + ")" : "")
          + ". Réessayez dans un instant, ou écrivez à contact@frendo.ch.",
    });
    peindre();
  };

  go.onclick = () => demander(champ.value);
  champ.onkeydown = (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); demander(champ.value); }
  };

  const fermer = () => { ov.remove(); document.removeEventListener("keydown", surEchap); };
  const surEchap = (e) => { if (e.key === "Escape") fermer(); };
  document.addEventListener("keydown", surEchap);
  ov.querySelector(".bot-x").onclick = fermer;
  ov.onclick = (e) => { if (e.target === ov) fermer(); };

  peindre();
  setTimeout(() => { try { champ.focus(); } catch (e) {} }, 60);
}

// Regroupement par ENVOI : un même envoi Frendo part vers plusieurs réseaux à
// quelques secondes d'intervalle, avec le même texte de départ. La signature et
// les hashtags de page sont ajoutés À LA FIN et diffèrent donc d'une page à
// l'autre : on ne compare que le DÉBUT du texte, et jamais une longueur fixe
// (sur un texte court, la queue propre à la page entrerait dans la comparaison).
function sendKey(msg) {
  return String(msg || "")
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9 ]+/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

// Deux publications viennent du même envoi si leur début coïncide et si elles
// sont parties à moins de 45 minutes d'écart.
function sameSend(a, b) {
  const ka = sendKey(a.msg), kb = sendKey(b.msg);
  const n = Math.min(ka.length, kb.length, 40);
  if (n < 20) return false; // texte trop court : on ne devine pas, on laisse seul
  if (ka.slice(0, n) !== kb.slice(0, n)) return false;
  return Math.abs(new Date(a.date) - new Date(b.date)) < 45 * 60 * 1000;
}

// Nom du produit d'un envoi : l'historique local le contient depuis la v249. On
// rattache par le début du texte et la date, comme pour le regroupement — les
// réseaux ne renvoient évidemment pas nos champs internes.
function productOf(item, hist) {
  for (const e of (hist || [])) {
    if (sameSend({ msg: e.caption, date: e.ts }, item)) return e.product;
  }
  return "";
}

// Transforme la liste des publications en liste d'envois consolidés.
function groupSends(posts) {
  const groups = [];
  // L'historique n'est relu qu'une fois par appel, pas une fois par publication.
  let hist = [];
  try { hist = loadHistory().filter(e => e && e.product && e.caption); } catch {}
  (posts || []).slice().sort((a, b) => new Date(a.date) - new Date(b.date)).forEach(s => {
    let g = groups.find(x => sameSend(x.items[0], s));
    if (!g) { g = { title: s.msg || "(sans texte)", items: [], likes: 0, comments: 0, shares: 0, views: null, score: 0, date: s.date }; groups.push(g); }
    g.items.push(s);
    if (!g.product) g.product = productOf(s, hist);
    g.likes += s.likes || 0; g.comments += s.comments || 0; g.shares += s.shares || 0;
    g.score += s.score || 0;
    if (s.views != null) g.views = (g.views || 0) + s.views;
    if (new Date(s.date) < new Date(g.date)) g.date = s.date;
    if ((s.msg || "").length > (g.title || "").length) g.title = s.msg;
  });
  groups.forEach(g => g.items.sort((a, b) => (b.views || 0) - (a.views || 0)));
  groups.sort((a, b) => (b.views || 0) - (a.views || 0) || b.score - a.score);
  return groups;
}

/* La galerie de la fiche Google est le canal le plus vu des magasins, et le

/* Les avis Google sont le seul endroit où un commerce de quartier se fait
   juger en public, et la réponse pèse autant que la note : le client suivant
   la lit pour savoir à qui il a affaire. Chargés à la demande, comme la
   galerie — un appel par établissement. */
/* Le nombre d'avis en attente est affiché sur l'accueil, mais interroger
   Google à chaque retour à l'accueil coûterait un appel par établissement pour
   rien. On garde donc le dernier compte connu en local : il date de la
   dernière consultation, ce qui suffit à savoir s'il y a quelque chose à
   faire. Le vrai chiffre arrive dès qu'on ouvre l'écran. */
function avisEnAttente() {
  if (state.revData) return state.revData.reduce((n, l) => n + ((l.reviews || []).filter((r) => !r.reply).length), 0);
  try { return parseInt(localStorage.getItem("poster_avis_attente") || "0", 10) || 0; }
  catch (e) { return 0; }
}

async function loadReviews() {

    if (ok && data && data.ok) state.revData = data.locations || [];
    else { state.revData = []; state.revErr = (data && data.error) || "Lecture des avis impossible."; }
  } catch (e) {
    state.revData = []; state.revErr = (e && e.message) || "Lecture des avis impossible.";
  }
  try { localStorage.setItem("poster_avis_attente", String(avisEnAttente())); } catch (e) {}
  state.revBusy = false; renderStats(true);
}

async function sendReviewReply(locIdx, revIdx) {
  const loc = (state.revData || [])[locIdx];
  const rev = loc && (loc.reviews || [])[revIdx];
  const ta = document.getElementById(`rev-ta-${locIdx}-${revIdx}`);
  if (!loc || !rev || !ta) return;
  const texte = (ta.value || "").trim();
  if (!texte) { alert("Écrivez une réponse d'abord."); return; }
  const btn = document.getElementById(`rev-send-${locIdx}-${revIdx}`);
  if (btn) { btn.disabled = true; btn.textContent = "⏳ Envoi…"; }
  try {
    const { ok, data } = await api("/api/youtube", {
      pwd: state.pwd, action: "gbp_review_reply",
      review_name: rev.name, location_name: loc.location_name, comment: texte,
    });
    if (ok && data && data.ok) {
      rev.reply = data.reply || { comment: texte, updateTime: new Date().toISOString() };
      state.revOpen = "";
      try { localStorage.setItem("poster_avis_attente", String(avisEnAttente())); } catch (e) {}
    } else {
      alert("Réponse non publiée : " + ((data && data.error) || "réponse inattendue"));
      if (btn) { btn.disabled = false; btn.textContent = "Publier la réponse"; }
      return;
    }
  } catch (e) {
    alert("Réponse non publiée (réseau) : " + ((e && e.message) || e));
    if (btn) { btn.disabled = false; btn.textContent = "Publier la réponse"; }
    return;
  }
  renderStats(true);
}

function renderStats(fromLoad) {
  if (!fromLoad && state.statsData === null && !state.statsBusy) loadStats();
  const fmt = (iso) => { const d = new Date(iso); return d.toLocaleDateString("fr-CH", { day: "2-digit", month: "2-digit" }) + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
  const medals = ["🥇", "🥈", "🥉"];
  const NETS = { fb: { label: "Facebook", color: "#1877f2" }, ig: { label: "Instagram", color: "#8a3ab9" }, threads: { label: "Threads", color: "#1c1c1c" }, bsky: { label: "Bluesky", color: "#1185fe" } };
  const netOf = (n) => NETS[n] || { label: n, color: "#666" };
  // ---- Moyennes par facteur : où se cache le "pourquoi" ----
  const JOURS = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
  const KINDS = { "🎬": "Vidéo / Reel", "📷": "Photo", "🖼️": "Carrousel", "📝": "Texte / lien" };
  const creneau = (h) => h < 6 ? "Nuit (23h-6h)" : h < 11 ? "Matin (6h-11h)" : h < 14 ? "Midi (11h-14h)" : h < 18 ? "Après-midi (14h-18h)" : h < 23 ? "Soir (18h-23h)" : "Nuit (23h-6h)";
  const avgTable = (title, groups, noteFor) => {
    const arr = Object.entries(groups).map(([label, list]) => ({ label, list, n: list.length, avg: Math.round((list.reduce((s, x) => s + x.score, 0) / list.length) * 10) / 10 })).sort((a, b) => b.avg - a.avg);
    if (!arr.length) return "";
    const max = Math.max(1, arr[0].avg);
    return `<div class="pagecard" style="padding:12px 14px;flex:1;min-width:210px;">
      <div style="font-weight:600;font-size:13px;margin-bottom:8px;">${title}</div>
      ${arr.map((g, i) => { const note = noteFor ? noteFor(g.label, g.list) : ""; return `<div style="margin-top:${i ? 7 : 0}px;">
        <div style="display:flex;justify-content:space-between;font-size:12px;"><span>${i === 0 && arr.length > 1 && g.avg > 0 ? "⭐ " : ""}${g.label}</span><span style="white-space:nowrap;"><b>${g.avg}</b> <span class="muted" style="font-size:10.5px;">(${g.n} pub${g.n > 1 ? "s" : ""})</span></span></div>
        <div style="height:5px;background:var(--border);border-radius:3px;margin-top:3px;"><div style="height:5px;width:${Math.round(g.avg / max * 100)}%;background:var(--maple);border-radius:3px;"></div></div>
        ${note ? `<div class="muted" style="font-size:10px;margin-top:2px;line-height:1.35;">${note}</div>` : ""}
      </div>`; }).join("")}
    </div>`;
  };

  /* Un réseau qui ne rend aucun engagement — page qui ne diffuse plus, ou
     chiffre que l'API ne donne pas — tire vers le bas toutes les moyennes
     tant qu'il reste dans le calcul. D'où le filtre : les jours et les
     créneaux se lisent réseau par réseau, sinon ils mélangent des
     publications vues et des publications jamais diffusées. */
  const allPosts = state.statsData || [];
  const netFilter = state.statsNet || "all";
  const posts = netFilter === "all" ? allPosts : allPosts.filter((s) => s.net === netFilter);
  const netsPresent = [...new Set(allPosts.map((s) => s.net))];
  const netMuet = (list) => list.length >= 5 && list.reduce((s, x) => s + x.score, 0) === 0;

  let avgBlock = "";
  if (allPosts.length >= 3) {
    const byKind = {}, byDay = {}, byHour = {}, byNet = {};
    for (const s of posts) {
      const d = new Date(s.date);
      (byKind[KINDS[s.kind] || "Autre"] = byKind[KINDS[s.kind] || "Autre"] || []).push(s);
      (byDay[JOURS[d.getDay()]] = byDay[JOURS[d.getDay()]] || []).push(s);
      (byHour[creneau(d.getHours())] = byHour[creneau(d.getHours())] || []).push(s);
    }
    // « Par réseau » reste calculé sur tout : c'est le tableau où l'on choisit.
    for (const s of allPosts) (byNet[netOf(s.net).label] = byNet[netOf(s.net).label] || []).push(s);
    const muets = Object.entries(byNet).filter(([, l]) => netMuet(l)).map(([lab]) => lab);

    /* Une moyenne ne compare que ce qu'on lui a donne a comparer. Un commercant
       qui publie toujours le soir verra « meilleur creneau : soir » — ce qui ne
       lui apprend rien, c'est le seul qu'il ait essaye. Le tableau a l'air de
       repondre alors qu'il ne fait que refleter l'habitude, et c'est le genre de
       faux conseil qui coute cher. Autant que l'application le dise elle-meme
       plutot que d'esperer que le client y pense. */
    const dominant = (groupes) => {
      const tot = Object.values(groupes).reduce((n, l) => n + l.length, 0);
      if (tot < 6) return null;
      const ent = Object.entries(groupes).sort((x, y) => y[1].length - x[1].length)[0];
      if (!ent || Object.keys(groupes).length < 2) return { lab: ent ? ent[0] : "", part: 100, seul: true };
      const part = Math.round(ent[1].length / tot * 100);
      return part >= 70 ? { lab: ent[0], part } : null;
    };
    const dh = dominant(byHour), dj = dominant(byDay);
    const varier = (!dh && !dj) ? "" : `<div style="margin:-6px 0 14px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,.02);">
      <div style="font-size:12.5px;font-weight:600;">🔬 Pour que ces moyennes vous apprennent quelque chose</div>
      <div class="muted" style="font-size:11.5px;margin-top:5px;line-height:1.55;">
        ${dh ? `Vous publiez presque toujours ${dh.seul ? "au même créneau" : "en <b>" + escapeHtml(dh.lab.toLowerCase()) + "</b> (" + dh.part + " % de vos envois)"}. ` : ""}${dj ? `${dh ? "Et surtout le " : "Vous publiez surtout le "}<b>${escapeHtml(dj.lab)}</b>${dj.seul ? "" : " (" + dj.part + " %)"}. ` : ""}Le tableau ci-dessus ne peut donc que confirmer votre habitude : il n'a rien d'autre à comparer.
        Essayez deux ou trois publications à un autre moment — un matin, un dimanche — et revenez dans quinze jours.

    avgBlock = `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;">
      ${avgTable("🎞️ Score moyen par format", byKind)}
      ${avgTable("📅 Par jour de publication", byDay)}

    ${muets.length && netFilter === "all" ? `<p class="muted" style="font-size:11px;margin:-6px 0 10px;line-height:1.5;">🔇 ${muets.join(", ")} ${muets.length > 1 ? "ne rapportent" : "ne rapporte"} aucun engagement. Tant que ${muets.length > 1 ? "ces réseaux restent" : "ce réseau reste"} dans le calcul, les jours et les créneaux ci-dessus sont tirés vers le bas — filtre sur un réseau qui répond pour les lire vraiment.</p>` : ""}

  }
  const mode = state.statsMode || "envoi";
  const filterRow = (mode === "post" && netsPresent.length > 1) ? `

  // ---- Vue par envoi : une ligne par produit, détail dépliable ----

  const rows = posts.slice(0, 50).map((s, i) => `
    <div class="pagecard" style="padding:12px 14px;margin-bottom:8px;${i < 3 ? "border-left:4px solid var(--maple);" : ""}">

      <div style="display:flex;gap:14px;margin-top:6px;font-size:12.5px;align-items:center;flex-wrap:wrap;">

        ${s.url ? `<a href="${s.url}" target="_blank" rel="noopener" style="margin-left:auto;font-size:12px;">Voir →</a>` : ""}
      </div>
    </div>`).join("");
  // ---- Galerie Google : un bloc par établissement, les plus vues en tête ----
  // Sans date, new Date(null) donne le 01.01.1970 : un tiret est plus honnête.
  const galFmt = (iso) => {
    if (!iso) return "—";

  };
  const GAL_CAT = { PRODUCT: "Produits", EXTERIOR: "Extérieur", INTERIOR: "Intérieur", FOOD_AND_DRINK: "Nourriture", AT_WORK: "Au travail", MENU: "Menu", COMMON_AREA: "Espaces communs", TEAMS: "Équipes", ROOMS: "Chambres", ADDITIONAL: "Sans catégorie", COVER: "Couverture", PROFILE: "Profil" };
  const gal = (state.galData || []).map((loc) => {
    if (loc.error) return `<div class="pagecard" style="padding:12px 14px;margin-bottom:10px;">

  /* --- Avis Google : une liste de choses à faire, pas un tableau de bord.

  const STARS = (n) => n ? "★".repeat(n) + "☆".repeat(5 - n) : "—";
