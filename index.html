<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Frendo</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#121B38">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E7E9ED; --ink:#14171C; --muted:#767C85; --border:#CDD2D9;
    --maple:#1C1F26; --maple-soft:#D6DBE1; --fb:#2A2E36;
    --grid:rgba(20,23,28,.045); --frame:#D7DBE1;
    --surface:#fff; --btn:#3B414A; --title:#565C64; --drop-over:#EFF2F4;
  }
  body.dark{
    --paper:#15171B; --ink:#E7E9ED; --muted:#8A9099; --border:#3A3F48;
    --maple:#E7E9ED; --maple-soft:#31363F; --fb:#3A3F48;
    --grid:rgba(255,255,255,.04); --frame:#2B2F37;
    --surface:#1E2127; --btn:#454C57; --title:#AAB1BB; --drop-over:#262A31;
  }
  body.dark .msg.err{background:#2A2E36;color:#E7E9ED;}
  #theme-toggle{position:fixed;top:12px;right:12px;z-index:50;width:38px;height:38px;border:1.5px solid var(--frame);border-radius:50%;background:var(--surface);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;transition:background .18s ease,border-color .18s ease;}
  #theme-toggle:hover{border-color:var(--ink);}
  #theme-toggle .tport{position:relative;width:24px;height:24px;}
  #theme-toggle .tr1,#theme-toggle .tr2{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;}
  #theme-toggle .tr1{border-top-color:#4a4a4a;border-bottom-color:#4a4a4a;animation:fx7r 2.4s linear infinite;}
  #theme-toggle .tr2{inset:4px;border-left-color:#8c8c8c;border-right-color:#8c8c8c;animation:fx7r 1.8s linear infinite reverse;}
  #theme-toggle .tcore{position:absolute;inset:8px;border-radius:50%;background:#2a2a2a;box-shadow:0 0 6px rgba(80,80,80,.6);animation:fx7core 2.4s ease-in-out infinite;transition:background .3s ease;}
  body.dark #theme-toggle .tcore{background:#f2f2f2;box-shadow:0 0 8px rgba(220,220,220,.7);}
  body.dark #theme-toggle .tr1{border-top-color:#bcbcbc;border-bottom-color:#bcbcbc;}
  body.dark #theme-toggle .tr2{border-left-color:#7a7a7a;border-right-color:#7a7a7a;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  body{background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;background-position:-1px -1px;color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  .wrap{width:100%;max-width:440px;margin:0 auto;padding:26px 18px 60px;}
  .aide-i{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;
    border:1px solid var(--border);background:none;color:var(--muted);font-size:11px;font-weight:700;font-style:italic;
    cursor:pointer;padding:0;margin-left:7px;vertical-align:middle;line-height:1;flex-shrink:0;}
  .aide-i:hover{border-color:var(--ink);color:var(--ink);}
  .aide-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:10000;overflow:auto;}
  .aide-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;
    max-width:420px;width:100%;margin:auto;}
  .aide-t{font-weight:700;font-size:15.5px;margin-bottom:12px;}
  .aide-c p{font-size:13.5px;line-height:1.6;margin-bottom:11px;}
  .aide-c p:last-child{margin-bottom:0;}
  .aide-c .aide-note{font-size:12px;color:var(--muted);border-left:2px solid var(--border);padding-left:10px;}
  .bot-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;
    max-width:440px;width:100%;margin:auto;display:flex;flex-direction:column;max-height:86vh;overflow:hidden;}
  .bot-h{padding:16px 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px;}
  .bot-fil{padding:16px 18px;overflow-y:auto;flex:1;min-height:120px;}
  .bot-m{font-size:13.5px;line-height:1.6;margin-bottom:14px;white-space:pre-wrap;word-wrap:break-word;}
  .bot-m.moi{background:var(--border);border-radius:12px;padding:9px 13px;margin-left:34px;}
  .bot-m.lui{padding:0 2px;white-space:normal;}
  .bot-m.lui b{font-weight:700;}
  .bot-puce{padding-left:15px;text-indent:-11px;}
  .bot-air{height:8px;}
  .bot-q{display:block;width:100%;text-align:left;background:none;border:1px solid var(--border);
    border-radius:10px;padding:9px 13px;font-size:12.5px;margin-bottom:7px;cursor:pointer;color:var(--ink);
    font-family:inherit;line-height:1.45;}
  .bot-q:hover{border-color:var(--ink);}
  .bot-p{padding:12px 18px 16px;border-top:1px solid var(--border);}
  .serif{font-family:'Space Grotesk',Georgia,serif;letter-spacing:.01em;}
  .mono{font-family:'Space Mono',ui-monospace,SFMono-Regular,Menlo,monospace;}
  .readout{font-family:'Space Mono',ui-monospace,monospace;text-transform:uppercase;letter-spacing:.14em;font-size:10.5px;color:var(--muted);}
  .center{text-align:center;}
  .muted{color:var(--muted);}
  .logo{width:79px;height:54px;background-image:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDE2IDY5MCIgd2lkdGg9IjEwMTYiIGhlaWdodD0iNjkwIj4KPGRlZnM+PGxpbmVhckdyYWRpZW50IGlkPSJnIiB4MT0iMCIgeTE9IjAiIHgyPSIxIiB5Mj0iMCI+PHN0b3Agb2Zmc2V0PSIwIiBzdG9wLWNvbG9yPSIjMEZFOUNDIi8+PHN0b3Agb2Zmc2V0PSIwLjM1IiBzdG9wLWNvbG9yPSIjOEFFODk0Ii8+PHN0b3Agb2Zmc2V0PSIwLjU1IiBzdG9wLWNvbG9yPSIjRDZENTY2Ii8+PHN0b3Agb2Zmc2V0PSIwLjc1IiBzdG9wLWNvbG9yPSIjRjlCRjUxIi8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjRkU3QjQ0Ii8+PC9saW5lYXJHcmFkaWVudD48L2RlZnM+Cgo8ZyB0cmFuc2Zvcm09InRyYW5zbGF0ZSgtNCwtMTU4KSI+PHJlY3QgeD0iNCIgICB5PSIzODQiIHdpZHRoPSIxNjUiIGhlaWdodD0iMjU4IiByeD0iNzQiIGZpbGw9InVybCgjZykiLz4KPHJlY3QgeD0iODU1IiB5PSIzODQiIHdpZHRoPSIxNjUiIGhlaWdodD0iMjU4IiByeD0iNzQiIGZpbGw9InVybCgjZykiLz4KPHJlY3QgeD0iOTAiICB5PSIxNTgiIHdpZHRoPSI4NDQiIGhlaWdodD0iNjkwIiByeD0iMjU1IiBmaWxsPSJ1cmwoI2cpIi8+CjxyZWN0IHg9IjE2MyIgeT0iMjQzIiB3aWR0aD0iNjk2IiBoZWlnaHQ9IjUxNiIgcng9IjE3NSIgZmlsbD0iIzAyMUM0MCIvPgo8ZyBmaWxsPSJub25lIiBzdHJva2U9IiNGRkZGRkYiIHN0cm9rZS13aWR0aD0iNDQiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCI+CjxwYXRoIGQ9Ik0gMjQ2IDQ5NyBBIDk1IDgyIDAgMCAxIDQyNCA0OTciLz4KPHBhdGggZD0iTSA2MDAgNDk3IEEgOTUgODIgMCAwIDEgNzc4IDQ5NyIvPgo8cGF0aCBkPSJNIDM5MiA1OTIgQSAxMzIgMTAwIDAgMCAwIDYzMiA1OTIiLz4KPC9nPjwvZz4KPC9zdmc+Cg==");background-size:contain;background-repeat:no-repeat;background-position:center;}
  .card{background:var(--surface);border:1.5px solid var(--frame);border-radius:0;}
  .field{width:100%;border:1px solid var(--border);border-radius:0;padding:12px 14px;font-size:16px;color:var(--ink);outline:none;background:var(--surface);}
  textarea.field{resize:none;}
  /* Les indications grisées des champs reprennent la taille de .drop-sub (12px)
     pour que toutes les cases se ressemblent. On ne touche PAS au font-size du
     champ lui-même : en dessous de 16px, Safari sur iPhone zoome à la saisie. */
  .field::placeholder{font-size:12px;color:var(--muted);opacity:1;}
  .field::-webkit-input-placeholder{font-size:12px;color:var(--muted);}
  .field:focus{border-color:var(--maple);}
  .btn{width:100%;padding:14px;border-radius:14px;background:var(--btn);color:#fff;font-weight:600;font-size:16px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s ease,box-shadow .2s ease,opacity .2s ease;letter-spacing:.02em;}
  .btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 18px rgba(20,23,28,.18);}
  .btn:active:not(:disabled){transform:translateY(0);}
  .btn:disabled{background:var(--border);color:var(--muted);cursor:not-allowed;}
  .btn-ghost{background:var(--surface);border:1px solid var(--border);color:var(--ink);border-radius:14px;padding:12px 20px;font-weight:500;cursor:pointer;}
  .when-row{display:flex;gap:8px;}
  .when-opt{flex:1;padding:11px;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;border-radius:0;transition:border-color .15s ease,color .15s ease;}
  .when-opt.on{border-color:var(--ink);color:var(--ink);}
  .slot-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;}
  .slot-lbl{font-family:'Space Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:2px;}
  .slot{padding:6px 10px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:12.5px;cursor:pointer;border-radius:0;transition:border-color .15s ease;}
  .slot:hover{border-color:var(--muted);}
  .slot.on{border-color:var(--ink);font-weight:600;}
  .rb-cfg{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;}
  .rb-lbl{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink);}
  .rb-num{width:56px;padding:7px 8px;border:1.5px solid var(--border);background:var(--surface);color:var(--ink);font-size:14px;border-radius:0;text-align:center;}
  .link-btn{background:none;border:none;color:var(--title);font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:6px;}
  .link-btn:hover{color:var(--ink);}
  .step{margin-bottom:20px;}
  .step-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .step-n{width:24px;height:22px;border-radius:6px;background:transparent;border:1.5px solid var(--ink);color:var(--ink);font-family:'Space Mono',ui-monospace,monospace;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .step-l{font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;}
  .drop{width:100%;border:1.5px dashed var(--border);border-radius:0;background:var(--surface);padding:34px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;color:var(--muted);transition:border-color .18s ease,background .18s ease,color .18s ease;}
  .drop:hover{border-color:var(--ink);color:var(--ink);}
  .drop.over{border-color:var(--ink);background:var(--drop-over);color:var(--ink);}
  .drop-ic{display:flex;}
  .drop-title{font-size:14px;font-weight:600;color:var(--ink);}
  .drop-sub{font-size:12px;color:var(--muted);}
  .media-box{position:relative;border:1.5px solid var(--frame);border-radius:0;overflow:hidden;background:#000;}
  .media-box img{width:100%;max-height:300px;object-fit:contain;display:block;}
  .media-box video{width:100%;max-height:300px;object-fit:contain;display:block;background:#000;}
  .media-x{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:6px;background:rgba(0,0,0,.6);border:none;color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s ease;}
  .media-x:hover{background:rgba(0,0,0,.82);}
  .media-tag{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-family:'Space Mono',ui-monospace,monospace;text-transform:uppercase;letter-spacing:.1em;font-size:9.5px;padding:4px 8px;border-radius:4px;}
  .opt-btn{margin-top:8px;display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:12px;background:var(--maple-soft);color:var(--maple);font-size:14px;font-weight:500;border:none;cursor:pointer;}
  .opt-card{margin-top:12px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px;}
  .opt-text{font-size:14px;white-space:pre-line;line-height:1.55;}
  .opt-use{margin-top:12px;background:none;border:none;color:var(--maple);font-size:13px;font-weight:600;cursor:pointer;}
  .page{width:100%;display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:16px;cursor:pointer;background:var(--surface);border:1.5px solid var(--border);margin-bottom:8px;}
  .page.on{background:var(--maple-soft);border-color:var(--maple);}
  .page-ic{position:relative;overflow:hidden;width:36px;height:36px;border-radius:4px;background:var(--fb);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .page-ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .page-txt{display:flex;flex-direction:column;gap:1px;min-width:0;}
  .page-net{font-size:11px;color:#8a8f98;font-weight:600;line-height:1;}
  .page-name{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-0.2px;}
  .check{flex-shrink:0;width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);font-size:12px;}
  .check.on{background:var(--surface);border-color:var(--ink);}
  .master{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--maple);background:none;border:none;cursor:pointer;}
  .dest-row{display:flex;gap:8px;}
  .destline{display:flex;justify-content:space-between;align-items:center;margin-top:6px;padding-left:6px;}
  .destline .dest:first-child{padding-left:0;}
  .netsec{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;padding-left:6px;}
  .netsec:first-child{margin-top:0;}
  /* Barre de séparation entre réseaux : portail énergétique (niveaux de gris) */
  .sci-fi-divider{position:relative;height:40px;margin:22px 0;display:flex;align-items:center;justify-content:center;}
  .sci-fi-divider .beam{position:absolute;left:0;right:0;top:19px;height:2px;
    background:linear-gradient(90deg,transparent,#9a9a9a 30%,#4a4a4a 50%,#9a9a9a 70%,transparent);
    box-shadow:0 0 10px rgba(80,80,80,.5);animation:fx7beam 6.4s ease-in-out infinite;}
  @keyframes fx7beam{0%,100%{filter:brightness(.8);}50%{filter:brightness(1.8);}}
  .sci-fi-divider .portal{position:relative;width:34px;height:34px;z-index:2;}
  .sci-fi-divider .ring1,.sci-fi-divider .ring2,.sci-fi-divider .ring3{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;}
  .sci-fi-divider .ring1{border-top-color:#4a4a4a;border-bottom-color:#4a4a4a;animation:fx7r 4.8s linear infinite;
    filter:drop-shadow(0 0 5px rgba(70,70,70,.8));}
  .sci-fi-divider .ring2{inset:5px;border-left-color:#8c8c8c;border-right-color:#8c8c8c;animation:fx7r 3.6s linear infinite reverse;
    filter:drop-shadow(0 0 4px rgba(140,140,140,.8));}
  .sci-fi-divider .ring3{inset:10px;border-top-color:#fff;animation:fx7r 2.4s linear infinite;}
  @keyframes fx7r{0%{transform:rotate(0);}100%{transform:rotate(360deg);}}
  .sci-fi-divider .heart{position:absolute;inset:12px;border-radius:50%;
    background:radial-gradient(circle,#fff,#a8a8a8 60%,transparent);
    animation:fx7core 4.8s ease-in-out infinite;}
  @keyframes fx7core{0%,100%{transform:scale(1);}50%{transform:scale(1.18);}}
  .tagwrap{flex:0 0 auto;display:flex;align-items:center;gap:8px;}
  a.netbadge{cursor:pointer;text-decoration:none;}
  a.netbadge:hover{filter:brightness(1.15);}
  .netbadge{width:36px;height:36px;border-radius:4px;display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:700;color:#fff;flex:0 0 auto;user-select:none;margin-left:auto;margin-right:10px;}
  .nb-fb{background:#1877F2;}
  .nb-ig{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);font-size:13px;}
  .nb-tt{background:#000;font-size:13px;}
  .nb-th{background:#000;font-size:16px;}
  .nb-bs{background:#0085ff;font-size:16px;}
  .nb-yt{background:#ff0000;font-size:13px;}
  .dest{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 10px;border:none;background:none;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);line-height:1.2;transition:color .15s ease;}
  .dest.on{color:var(--ink);}
  .dest.off{opacity:.4;cursor:not-allowed;}
  .destbox{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--ink);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-size:12px;line-height:1;color:transparent;flex-shrink:0;transition:color .15s ease;}
  .dest.on .destbox{background:var(--surface);border-color:var(--ink);color:var(--ink);}
  .pagecard{background:var(--surface);border:1.5px solid var(--frame);border-radius:0;padding:9px 12px;margin-bottom:8px;transition:border-color .18s ease,box-shadow .18s ease;}
  .pagecard:hover{box-shadow:0 4px 16px rgba(20,23,28,.06);}
  .pagecard.on{border-color:var(--frame);}
  .pagecard .page{background:transparent!important;border:none!important;margin-bottom:0;padding:4px 6px;}
  /* Libellé AU-DESSUS du champ : côte à côte, un libellé long ("Signature —
     ajoutée entre la légende et les hashtags") écrasait la zone de saisie
     jusqu'à la rendre illisible. */
  .tagrow{display:flex;flex-direction:column;align-items:stretch;gap:2px;margin-top:12px;padding:0 4px;}
  .tagrow > .taginput{flex:none;width:100%;}
  .tagrow > textarea.taginput{min-height:48px;resize:vertical;overflow-y:hidden;line-height:1.45;}
  .tagclosed{cursor:pointer;padding:7px 10px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;}
  .taghash{font-family:'Space Mono',ui-monospace,monospace;font-size:17px;font-weight:700;color:var(--muted);line-height:1;transition:color .15s ease;}
  .tagclosed:hover .taghash{color:var(--ink);}
  .tagclosed.open .taghash{color:var(--ink);}
  .tagtoggle{cursor:pointer;}
  .tagic{font-size:13px;opacity:.7;flex-shrink:0;}
  .taginput{flex:1;min-width:0;border:1.5px solid var(--border);background:var(--surface);border-radius:11px;padding:8px 11px;font-size:12.5px;color:var(--ink);font-family:inherit;}
  .taginput:focus{outline:none;border-color:var(--maple);}
  .msg{font-size:13px;padding:10px 12px;border-radius:12px;margin-top:10px;}
  .msg.err{background:#E3E6EA;color:#2B2F36;border-left:3px solid var(--ink);}
  .ok-circle{width:60px;height:60px;border-radius:50%;background:var(--surface);border:1.5px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:26px;color:var(--ink);}
  .done-line{display:flex;align-items:center;gap:10px;padding:6px 4px;font-size:13px;border-top:1px solid var(--frame);}
  .done-mark{font-weight:700;font-size:13px;width:14px;text-align:center;flex-shrink:0;}
  .done-ok{color:var(--ink);}
  .done-fail{color:var(--muted);}
  .done-dest{font-weight:600;color:var(--ink);}
  .done-right{margin-left:auto;display:flex;align-items:center;gap:14px;white-space:nowrap;}
  .done-link{font-size:13px;color:var(--ink);font-weight:600;text-decoration:none;}
  .done-link:hover{text-decoration:underline;}
  .done-share{font-size:12px;color:var(--muted);font-weight:600;text-decoration:none;}
  .done-err{font-size:12px;color:var(--muted);}
  .done-sched{font-size:12px;color:var(--ink);font-weight:600;}
  .see{margin-left:auto;font-size:13px;color:var(--maple);font-weight:600;text-decoration:none;}
  .hidden{display:none!important;}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite;}

/* Assemblage du texte d'une publication : légende, puis signature magasin,
   puis hashtags.

   Avec une limite de réseau (Bluesky 300, Threads 500), on ne laisse plus le
   réseau couper au caractère près — il tranchait au milieu d'un mot et
   emportait les hashtags, qui sont justement ce qui fait trouver la
   publication. On retire donc, dans cet ordre :
     1. la signature magasin — l'adresse part déjà dans le commentaire
        automatique sous la publication, c'est donc le seul vrai doublon ;
     2. les hashtags ;
     3. en dernier recours seulement, on coupe la légende, au dernier espace.
   composeInfo dit AUSSI ce qui a été retiré, pour que l'aperçu l'annonce :
   une suppression silencieuse serait pire que la coupure d'avant. */
function composeInfo(caption, tags, sig, limit) {
  const cap = (caption || "").trim();
  const s = (sig || "").trim();
  const t = (tags || "").trim();
  const join = (a) => a.filter(Boolean).join("\n\n");
  const niveaux = [

    { text: join([cap, t]), dropped: s ? ["la signature magasin"] : [] },
    { text: join([cap]), dropped: [s ? "la signature magasin" : null, t ? "les hashtags" : null].filter(Boolean) },

  if (!limit) return niveaux[0];
  for (const n of niveaux) if (n.text.length <= limit) return n;
  // La légende seule dépasse encore : on coupe au dernier espace, pas en plein mot.
  const dur = cap.slice(0, Math.max(1, limit - 1));
  const esp = dur.lastIndexOf(" ");
  const coupe = (esp > limit * 0.6 ? dur.slice(0, esp) : dur).trimEnd() + "…";
  return { text: coupe, dropped: niveaux[2].dropped.concat("la fin du texte") };

/* Découpe un texte en messages successifs, sans jamais couper un mot. On
   cherche d'abord une fin de paragraphe, puis une fin de ligne, puis un espace,
   et on ne se rabat sur la coupe brutale que si rien d'autre n'est trouvé dans
   la seconde moitié du message. */
function chunkText(txt, limit) {
  const out = [];
  let reste = (txt || "").trim();
  if (!limit) return reste ? [reste] : [];
  let garde = 0;
  while (reste.length > limit && garde++ < 50) {
    const bout = reste.slice(0, limit);
    let i = bout.lastIndexOf("\n\n");
    if (i < limit * 0.5) i = bout.lastIndexOf("\n");
    if (i < limit * 0.5) i = bout.lastIndexOf(" ");
    if (i < limit * 0.5) i = limit;
    out.push(reste.slice(0, i).trim());
    reste = reste.slice(i).trim();
  }
  if (reste) out.push(reste);
  return out;
}

   donc en plusieurs messages enchaînés — rien n'est perdu, et c'est l'usage
   normal de ces réseaux. Ne se déclenche que lorsque la légende SEULE dépasse
   la limite : en dessous, retirer la signature (composeInfo) donne un message
   unique et plus propre, ce qui vaut mieux qu'un fil inutile. */
function composeThread(caption, tags, sig, limit) {
  const info = composeInfo(caption, tags, sig, limit);
  if (!limit || !info.dropped.includes("la fin du texte")) {
    return { text: info.text, suites: [], dropped: info.dropped };
  }
  const t = (tags || "").trim();
  const morceaux = chunkText((caption || "").trim(), limit);
  const suites = morceaux.slice(1);
  if (t) {
    // Les hashtags rejoignent le dernier message s'ils y tiennent, sinon ils
    // forment le leur : ils doivent partir, c'est par eux qu'on vous trouve.
    const dernier = suites.length ? suites[suites.length - 1] : null;
    if (dernier !== null && (dernier + "\n\n" + t).length <= limit) suites[suites.length - 1] = dernier + "\n\n" + t;
    else suites.push(t);
  }

}

async function syncSettings() {
  let cloud = {};
  try {
    const r = await fetch(SETTINGS_URL + "?ts=" + Date.now(), { cache: "no-store" });
    if (r.ok) { const j = await r.json(); if (j && j.entries) cloud = j.entries; }
  } catch (_) {}
  const m = loadSettingsMeta();
  let localNewer = false, changed = false;
  new Set([...Object.keys(cloud), ...Object.keys(m)]).forEach((k) => {
    const ct = (cloud[k] && cloud[k].t) || 0;
    const lt = m[k] || 0;
    if (ct > lt) {
      const v = (cloud[k] && cloud[k].v) || "";
      try { localStorage.setItem("poster_" + k, v); } catch {}
      m[k] = ct; changed = true;
      applySettingToState(k, v);
    } else if (lt > ct) { localNewer = true; }
  });
  saveSettingsMeta(m);
  if (changed) render();
  if (localNewer) { clearTimeout(SETTINGS_PUSH_T); SETTINGS_PUSH_T = setTimeout(pushSettings, 1500); }
}

/* Un seul point de passage vers le serveur, et c'est lui qui dit qui parle.
   Le proprietaire envoie son mot de passe ; un client connecte envoie sa
   session. Le serveur en deduit l'espace de rangement. Tout le reste de
   l'interface ignore completement la question — c'est l'interet d'avoir un
   seul endroit. */
/* Les liens d'autorisation partent en pleine page vers TikTok, Google ou
   Facebook : ils ne passent pas par api() et doivent donc porter l'identite
   eux-memes. Un seul endroit la construit, pour qu'aucun bouton n'oublie. */
function lienAutorisation(chemin) {
  return state.cliSession
    ? chemin + "?session=" + encodeURIComponent(state.cliSession)
    : chemin + "?pwd=" + encodeURIComponent(state.pwd || "");
}
const api = (path, payload) => {
  const corps = { ...(payload || {}) };
  if (state.cliSession && !corps.pwd) corps.session = state.cliSession;
  else if (state.pwd && !corps.pwd && !corps.session) corps.pwd = state.pwd;
  return fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corps) })
    .then(async (r) => ({ ok: r.ok, data: await r.json().catch(() => ({})) }))
    .catch(() => ({ ok: false, data: { error: "Connexion impossible. Vérifiez votre connexion internet." } }));
};

/* ---------- Brouillon persistant (IndexedDB : supporte les vidéos) ---------- */
const DRAFT_DB = "poster_db", DRAFT_STORE = "draft", DRAFT_KEY = "current";
function draftDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DRAFT_DB, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(DRAFT_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function saveDraft() {
  try {
    const db = await draftDB();
    db.transaction(DRAFT_STORE, "readwrite").objectStore(DRAFT_STORE)
      .put({ caption: state.caption, product: state.product, media: state.media, optimized: state.optimized, mediaList: state.mediaList, postComments: state.postComments }, DRAFT_KEY);
  } catch {}
}
async function loadDraft() {
  try {
    const db = await draftDB();
    return await new Promise((resolve) => {
      const r = db.transaction(DRAFT_STORE, "readonly").objectStore(DRAFT_STORE).get(DRAFT_KEY);
      r.onsuccess = () => resolve(r.result || null);
      r.onerror = () => resolve(null);
    });
  } catch { return null; }
}
async function clearDraft() {
  try {
    const db = await draftDB();
    db.transaction(DRAFT_STORE, "readwrite").objectStore(DRAFT_STORE).delete(DRAFT_KEY);
  } catch {}
}

// Écrans de consultation dont on se souvient d'un rechargement à l'autre : on
// peut ainsi recharger « Rediffusions en cours » sans retomber sur l'accueil.
// Les écrans liés à un travail en cours (publication, résultat) en sont exclus.
const KEEP_VIEWS = ["schedules", "history", "plan", "stats", "failed", "settings", "apercu", "comptes", "fermetures", "reseaux"];
function rememberView() {
  try {
    if (KEEP_VIEWS.includes(state.view)) sessionStorage.setItem("poster_view", state.view);
    else sessionStorage.removeItem("poster_view");
  } catch (e) { /* navigation privée : on s'en passe */ }
}
function restoreView() {
  try {
    const v = sessionStorage.getItem("poster_view");
    if (v && KEEP_VIEWS.includes(v)) {
      state.view = v;
      if (v === "failed") loadFailed();
      // Ces deux ecrans lisent le serveur : sans ca, un rechargement les
      // rouvrirait vides.
      if (v === "comptes") loadComptes();
      if (v === "fermetures") loadFermetures();
    }
  } catch (e) { /* idem */ }
}

// Bouton Retour ajoute en bas des ecrans de consultation : ces pages sont
// longues, remonter tout en haut pour revenir est penible.
function addBottomBack() {
  try {
    if (!KEEP_VIEWS.includes(state.view)) return;
    // L'apercu doit rester fidele : le client n'a pas ce bouton.
    if (state.view === "apercu" || state.view === "reseaux") return;
    const wrap = root.querySelector(".wrap") || root.firstElementChild;
    if (!wrap || wrap.querySelector("[data-backbottom]")) return;
    const d = document.createElement("div");
    d.className = "center";
    d.style.cssText = "margin:22px 0 8px;";
    d.innerHTML = `<button class="btn-ghost" data-backbottom="1" style="padding:8px 14px;">← Retour</button>`;
    wrap.appendChild(d);
    d.querySelector("[data-backbottom]").onclick = () => {
      state.view = (state.view === "schedules") ? "main" : null;
      render();
      try { window.scrollTo({ top: 0 }); } catch {}
    };
  } catch (e) { /* jamais bloquant */ }
}

function render() {
  if (state.view !== "apercu") {
    state.apercu = false;
    try { document.querySelectorAll("[data-ap-barre]").forEach((n) => n.remove()); root.style.paddingBottom = ""; } catch (e) {}
  }
  setTimeout(syncDividers, 0);
  setTimeout(addBottomBack, 0);
  rememberView();
  if (state.view === "reseaux") return renderReseaux();
  if (state.view === "apercu") return renderApercuClient();
  /* Un client sans page connectee voit l'ecran d'accueil : lui montrer
     l'atelier de publication alors qu'il n'a rien a publier serait cruel.
     Des qu'il a connecte une page, il obtient l'application entiere. */
  if (state.cliCompte && !(state.cliPages && state.cliPages.length)) return renderEspaceClient();
  if (state.cliVue === "connexion") return renderConnexionClient();
  if (!state.authed && !state.cliCompte) return renderLogin();
  if (state.view === "schedules") return renderSchedules();
  if (state.view === "history") return renderHistory();
  if (state.view === "plan") return renderPlan();
  if (state.view === "messages") return renderMessages();
  if (state.view === "comments") return renderComments();
  if (state.view === "stats") return renderStats();
  if (state.view === "settings") return renderSettings();
  if (state.view === "failed") return renderFailed();
  if (state.view === "fermetures") return renderFermetures();
  if (state.view === "comptes") return renderComptes();
  if (state.done) return renderDone();
  renderMain();
}

/* Les créneaux conseillés étaient écrits en dur — une intuition, pas une
   mesure, et 58 envois sont partis à 12h30 sur cette seule foi. Ils se
   calculent désormais sur l'historique réel, et se rafraîchissent à chaque
   passage par l'écran Stats. Deux précautions : on écarte les réseaux qui ne
   rendent aucun engagement (ils tireraient toutes les heures vers zéro), et
   on n'affiche qu'une heure vue au moins deux fois — une heure essayée une
   seule fois ne prouve rien, c'est l'erreur qu'on vient de corriger. */
const SLOTS_DEFAUT = [{ h: 10, m: 0 }, { h: 12, m: 30 }, { h: 18, m: 30 }];
const NET_NOMS = { fb: "Facebook", ig: "Instagram", threads: "Threads", bsky: "Bluesky" };

function computeBestSlots(posts) {
  const list = (posts || []).filter((s) => s && s.date);
  if (list.length < 8) return null;
  const parNet = {};
  list.forEach((s) => (parNet[s.net] = parNet[s.net] || []).push(s));
  const vivants = Object.keys(parNet).filter((n) => parNet[n].reduce((a, x) => a + (x.score || 0), 0) > 0);
  if (!vivants.length) return null;
  const utiles = list.filter((s) => vivants.includes(s.net));
  const parH = {};
  utiles.forEach((s) => {
    const d = new Date(s.date);
    if (!isNaN(d.getTime())) (parH[d.getHours()] = parH[d.getHours()] || []).push(s);
  });
  // Moyenne générale : sert d'ancre pour ne pas couronner une heure essayée
  // deux fois par chance. Une heure vue 3 fois est tirée vers la moyenne,
  // une heure vue 10 fois garde son résultat — c'est ce qui évite de refaire
  // l'erreur du 12h30 conseillé sur une intuition.
  const moyGen = utiles.reduce((a, x) => a + (x.score || 0), 0) / Math.max(1, utiles.length);
  const K = 3;
  const minuteDominante = (l) => {
    const c = {};
    l.forEach((s) => { const m = Math.min(45, Math.round(new Date(s.date).getMinutes() / 15) * 15); c[m] = (c[m] || 0) + 1; });
    return +Object.entries(c).sort((a, b) => b[1] - a[1] || a[0] - b[0])[0][0];
  };
  const arr = Object.entries(parH).map(([h, l]) => {
    const somme = l.reduce((a, x) => a + (x.score || 0), 0);
    return {
      h: +h,
      n: l.length,
      avg: Math.round((somme / l.length) * 10) / 10,
      pondere: (somme + K * moyGen) / (l.length + K),
      m: minuteDominante(l),
    };
  }).filter((x) => x.n >= 2).sort((a, b) => b.pondere - a.pondere || b.n - a.n);
  if (arr.length < 2) return null;
  return { slots: arr.slice(0, 3), base: utiles.length, nets: vivants, at: Date.now() };
}
function saveBestSlots(posts) {
  try {
    const r = computeBestSlots(posts);
    if (r) localStorage.setItem("poster_best_slots", JSON.stringify(r));
  } catch (e) { /* localStorage indisponible : on gardera les créneaux génériques */ }
}
function loadBestSlots() {
  try {
    const r = JSON.parse(localStorage.getItem("poster_best_slots") || "null");
    return (r && Array.isArray(r.slots) && r.slots.length) ? r : null;
  } catch (e) { return null; }
}

          ? `Calculés sur vos ${bs.base} dernières publications ${escapeHtml(nets)} — les réseaux qui ne rendent aucun engagement sont écartés du calcul, sinon ils tireraient toutes les heures vers zéro. Score moyen : ${chips.map((c) => `<b>${String(c.h).padStart(2, "0")}h</b> ${c.avg} <span style="opacity:.75;">(${c.n} pub${c.n > 1 ? "s" : ""})</span>`).join(" · ")}. Ils se recalculent à chaque passage par 📊 Stats : le jour où vos chiffres changent, ces créneaux changent aussi.`
          : `⚠️ Ces trois créneaux sont génériques, pas les vôtres. Ouvrez 📊 Stats une fois et ils seront remplacés par ce que votre propre historique montre.`}
          <br><b>Fil et Reel Facebook</b> partent par la programmation native de Meta, à l'heure exacte. <b>Story, Instagram, Threads, Bluesky et Google Business</b> passent par le robot Frendo : ils partent à l'heure choisie ou dans les minutes qui suivent — jamais avant, parfois jusqu'à un quart d'heure après. Un retard de quelques minutes est normal et ne signale aucune panne.</div>`;
        })()}
        ${(() => {
          // Story, Threads, Bluesky et Google Business passent par notre propre robot de
          // programmation (pas la programmation native de Meta) — celui-ci peut désormais
          // programmer jusqu'à 1 an à l'avance (plan "pay as you go" Upstash, activé le
          // 27.08.2026 — avant cette date la limite était de 7 jours sur le plan gratuit).
          const sat = state.scheduleAt;
          if (!sat || sat - Date.now() <= 365 * 24 * 3600 * 1000) return "";
          const anyLimited = state.pages.some(p => pageDests(p).includes("story") || pageDests(p).includes("igstory"))

          return anyLimited ? `<div class="muted" style="font-size:11.5px;margin-top:8px;line-height:1.5;color:#a1493c;">⚠️ Au-delà d'un an, la programmation échouera pour Story, Story Instagram, Threads, Bluesky et Google Business (limite technique).</div>` : "";
        })()}` : ""}
    </div>

    ${anyStorySel ? `
    <div class="step">
      <div class="step-h"><span class="step-n">06</span><span class="step-l">Répétition (story uniquement)</span></div>
      <div class="when-row">

        <button class="when-opt ${state.rebroadcast.on ? "on" : ""}" id="rb-on">🔁 Rediffuser auto</button>${aideBouton("rediffusion")}
      </div>
      ${state.rebroadcast.on ? `
        <div class="rb-cfg">
          <label class="rb-lbl">Tous les <input type="number" id="rb-interval" min="1" max="14" value="${state.rebroadcast.intervalDays}" class="rb-num"> jours</label>
          <label class="rb-lbl"><input type="number" id="rb-times" min="2" max="20" value="${state.rebroadcast.times}" class="rb-num"> fois au total</label>

      ` : ""}

    ${state.error ? `<div class="msg err">${state.error}</div>` + dbgHtml() : ""}
`;
}

function wireComposerSteps(opts) {
  opts = opts || {};
  document.getElementById("file").onchange = onFile;
  const _pr = document.getElementById("prod");
  if (_pr) _pr.oninput = (e) => { state.product = e.target.value; saveDraft(); };
  document.getElementById("cap").oninput = (e) => { state.caption = e.target.value; state.optimized = null; renderOptSlot(); saveDraft(); renderPages(); paintCounts(); };
  const _pca = document.getElementById("pcom-add");
  if (_pca) _pca.onclick = () => { if (!Array.isArray(state.postComments)) state.postComments = []; state.postComments.push(""); render(); };
  document.querySelectorAll("textarea[data-pcom]").forEach((inp) => {
    inp.oninput = (e) => { state.postComments[parseInt(inp.getAttribute("data-pcom"), 10)] = e.target.value; saveDraft(); };
  });
  document.querySelectorAll("[data-pcom-del]").forEach((btn) => {
    btn.onclick = (e) => { e.stopPropagation(); state.postComments.splice(parseInt(btn.getAttribute("data-pcom-del"), 10), 1); saveDraft(); render(); };
  });
  document.getElementById("opt").onclick = improve;
  const _tt = document.getElementById("tpl-toggle");
  if (_tt) _tt.onclick = () => { state.tplOpen = !state.tplOpen; renderTplSlot(); if (state.tplOpen) loadTpl(); };
  renderTplSlot();
  const _m = document.getElementById("master"); if (_m) _m.onclick = () => {
    const anyOnNow = state.pages.some(p => pageDests(p).length > 0) || ttSelected().length > 0 || ytSelected().length > 0 || thSelected().length > 0 || bsSelected().length > 0 || gbpSelected().length > 0;
    const v = !anyOnNow; // s'il y a quelque chose de coché → tout décocher ; sinon → tout cocher
    state.pages.forEach(p => { state.pageDest[p.id] = { feed: v, reel: v, story: v, ig: v, igstory: v }; });
    (state.ttAccounts || []).forEach(a => { if (!a.expired) state.ttOn[a.open_id] = v; });
    if (!state.ytOn) state.ytOn = {};
    (state.ytAccounts || []).forEach(a => { state.ytOn[a.channel_id] = v; });
    if (!state.thOn) state.thOn = {};
    (state.thAccounts || []).forEach(a => { if (a.id) state.thOn[a.key] = v; });
    if (!state.bsOn) state.bsOn = {};
    (state.bsAccounts || []).forEach(a => { if (a.ok) state.bsOn[a.key] = v; });
    if (!state.gbpOn) state.gbpOn = {};
    (state.gbpLocations || []).forEach(l => { if (l.location_name) state.gbpOn[l.location_name] = v; });
    if (!state.gbpGallery) state.gbpGallery = {};
    // La galerie suit le mouvement, mais seulement si le média s'y prête.
    (state.gbpLocations || []).forEach(l => { if (l.location_name) state.gbpGallery[l.location_name] = v; });
    renderPages();
    paintCounts();
  };
  const _pub = document.getElementById("pub");
  if (_pub) _pub.onclick = () => {
    if (opts.planMode && !state.activePlanId) {
      const nameEl = document.getElementById("plan-pub-name");
      const nm = (nameEl && nameEl.value.trim()) || "Publication";
      const created = planAddLocal({ name: nm, date: state.scheduleAt ? new Date(state.scheduleAt).toISOString().slice(0, 10) : todayStr(), note: state.caption, type: "pub" });
      state.activePlanId = created.id;
    }
    // Nom du produit demandé AVANT l'envoi : à la fin, la vidéo est déjà partie
    // et on a pu quitter l'écran. Au clic, on est encore devant son téléphone.
    askProductIfMissing(() => publish());
  };
  // Test du stockage R2 : outil de diagnostic, volontairement caché.
  // Appui long (700 ms) sur le numéro de version, au doigt comme à la souris.
  const _r2t = document.getElementById("r2test");
  if (_r2t) {
    let _r2timer = null;
    const _r2start = (ev) => { if (ev.type === "mousedown" && ev.button !== 0) return; clearTimeout(_r2timer); _r2timer = setTimeout(testR2, 700); };
    const _r2stop = () => { clearTimeout(_r2timer); };
    _r2t.addEventListener("mousedown", _r2start);
    _r2t.addEventListener("touchstart", _r2start, { passive: true });
    ["mouseup", "mouseleave", "touchend", "touchcancel", "touchmove"].forEach((n) => _r2t.addEventListener(n, _r2stop));
    _r2t.addEventListener("contextmenu", (ev) => ev.preventDefault());
  }
  const _wn = document.getElementById("when-now"); if (_wn) _wn.onclick = () => { state.scheduleAt = null; render(); };
  const _ws = document.getElementById("when-sched"); if (_ws) _ws.onclick = () => { if (!state.scheduleAt) { const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(9, 0, 0, 0); state.scheduleAt = d.getTime(); } render(); };
  const _si = document.getElementById("sched-input");
  if (_si) {
    // Un render() complet ici détruisait le champ pendant la frappe : sur un champ
    // datetime-local, "change" part dès qu'un segment forme une date valide, donc
    // taper le jour suffisait à faire perdre le focus et à annuler la saisie.
    // On met donc à jour uniquement les éléments qui dépendent de la valeur.
    const _syncSchedAtSilent = () => {
      if (!_si.value) return;
      const t = new Date(_si.value).getTime();
      if (!isFinite(t)) return;
      state.scheduleAt = t;
      document.querySelectorAll(".slot").forEach(b => {
        const cls = slotActive(+b.dataset.h, +b.dataset.m);
        b.className = "slot" + (cls ? " " + cls : "");
      });
      saveDraft();
    };
    _si.oninput = _syncSchedAtSilent;
    _si.onchange = _syncSchedAtSilent;
    // La reconstruction n'a lieu qu'une fois la saisie terminée.
    _si.onblur = () => { _syncSchedAtSilent(); render(); };
  }
  document.querySelectorAll(".slot").forEach(b => b.onclick = () => setSchedTime(+b.dataset.h, +b.dataset.m));
  const _rboff = document.getElementById("rb-off"); if (_rboff) _rboff.onclick = () => { state.rebroadcast.on = false; render(); };
  const _rbon = document.getElementById("rb-on"); if (_rbon) _rbon.onclick = () => { state.rebroadcast.on = true; render(); };
  const _rbi = document.getElementById("rb-interval"); if (_rbi) _rbi.onchange = () => { state.rebroadcast.intervalDays = Math.max(1, Math.min(14, parseInt(_rbi.value || 2, 10))); };
  const _rbt = document.getElementById("rb-times"); if (_rbt) _rbt.onchange = () => { state.rebroadcast.times = Math.max(2, Math.min(20, parseInt(_rbt.value || 8, 10))); };
}

function renderMediaSlot() {
  const slot = document.getElementById("media-slot"); if (!slot) return;

  if (state.media && state.media.kind === "carousel" && (!state.mediaList || state.mediaList.length < 2)) {
    state.media = null; state.mediaList = []; state.slideVideo = null;
  }

    slot.innerHTML = `<div class="drop" id="drop">

  } else if (state.media.kind === "carousel") {

    const strip = state.mediaList.map((m, i) => `

        <div style="display:flex;justify-content:center;gap:4px;margin-top:3px;">
          <button class="car-l" data-i="${i}" ${i === 0 ? "disabled" : ""} style="border:1px solid var(--border);background:none;border-radius:6px;cursor:pointer;font-size:11px;padding:1px 7px;">◀</button>

    slot.innerHTML = `<div class="pagecard" style="padding:12px 14px;">

    document.getElementById("rm").onclick = () => { state.media = null; state.mediaList = []; state.slideVideo = null; render(); saveDraft(); };

        state.music = _smus.value; state.musicFile = null;
        if (state.music) playMusicPreview(MUSIC_BASE + state.music); else stopMusicPreview(false);

      }
    };
    const _mstop = document.getElementById("music-stop");
    if (_mstop) _mstop.onclick = () => stopMusicPreview(true);
    if (_smf) _smf.onchange = () => {
      const f = _smf.files && _smf.files[0];
      if (f) { state.music = "custom"; state.musicFile = f; playMusicPreview(URL.createObjectURL(f)); }
      else if (state.music === "custom" && !state.musicFile) { state.music = ""; }
      renderMediaSlot();
    };
    const _sm = document.getElementById("slide-make");
    if (_sm) _sm.onclick = () => generateSlideshow();
    const _sr = document.getElementById("slide-redo");
    if (_sr) _sr.onclick = () => { state.slideVideo = null; render(); setTimeout(() => generateSlideshow(), 50); };
    const _sx = document.getElementById("slide-del");
    if (_sx) _sx.onclick = () => { state.slideVideo = null; renderPages(); render(); };
    const _ca = document.getElementById("car-add");
    if (_ca) _ca.onclick = () => document.getElementById("file").click();
    slot.querySelectorAll(".car-x").forEach(b => b.onclick = () => {
      state.mediaList.splice(parseInt(b.getAttribute("data-i"), 10), 1);
      if (state.mediaList.length < 2) { const last = state.mediaList[0]; state.media = null; state.mediaList = []; if (last && last.file) handleFile(last.file); else render(); }
      else { const c0 = state.mediaList[0]; state.media.previewUrl = c0.thumb || c0.previewUrl; state.media.thumb = c0.thumb || state.media.thumb; state.media.name = c0.name; render(); }
      saveDraft();
    });
    const swap = (i, j) => { const t = state.mediaList[i]; state.mediaList[i] = state.mediaList[j]; state.mediaList[j] = t; const c0 = state.mediaList[0]; state.media.previewUrl = c0.thumb || c0.previewUrl; state.media.thumb = c0.thumb || state.media.thumb; state.media.name = c0.name; state.slideVideo = null; render(); saveDraft(); };
    slot.querySelectorAll(".car-l").forEach(b => b.onclick = () => { const i = parseInt(b.getAttribute("data-i"), 10); if (i > 0) swap(i, i - 1); });
    slot.querySelectorAll(".car-r").forEach(b => b.onclick = () => { const i = parseInt(b.getAttribute("data-i"), 10); if (i < state.mediaList.length - 1) swap(i, i + 1); });
    return;
  } else {
    const preview = state.media.kind === "video"
      ? `<video src="${state.media.previewUrl}" controls playsinline></video>`
      : `<img src="${state.media.previewUrl}">`;
    const meta = state.media.kind === "video"
      ? (state.media.duration ? Math.round(state.media.duration) + "s · vidéo" : "vidéo")
      : "image";
    const thumbPicker = state.media.kind === "video" ? `
      <div class="pagecard" style="padding:12px 14px;margin-top:10px;">
        <div style="display:flex;align-items:center;gap:12px;">
          <img id="thumb-prev" src="${state.thumbDataUrl || ""}" alt="" style="width:54px;height:54px;object-fit:cover;border-radius:8px;background:#000;flex:0 0 auto;${state.thumbDataUrl ? "" : "display:none;"}">
          <div style="flex:1;min-width:0;">
            <div style="font-weight:600;font-size:13px;">🖼 Vignette de la vidéo ${state.thumbCustom ? `<span class="muted" style="font-weight:400;">· image importée</span>` : state.thumbTs != null ? `<span class="muted" style="font-weight:400;">· ${state.thumbTs.toFixed(1)}s</span>` : `<span class="muted" style="font-weight:400;">· automatique</span>`}</div>
            <input id="thumb-slider" type="range" min="0" max="1000" value="${state.thumbSlider || 0}" style="width:100%;margin-top:8px;${state.thumbCustom ? "opacity:.35;pointer-events:none;" : ""}">
            <div class="muted" style="font-size:11px;margin-top:2px;">${state.thumbCustom ? "Image importée : elle remplace l'extrait de la vidéo." : "Glissez pour choisir l'image de couverture — appliquée aux Reels Facebook, Instagram et au Fil."}</div>
            <div style="margin-top:8px;">
              ${state.thumbCustom
                ? `<button id="thumb-clear" class="link-btn" style="font-size:11.5px;">✕ Revenir à une image de la vidéo</button>`
                : `<button id="thumb-import" class="link-btn" style="font-size:11.5px;">⬆️ Importer une image à la place</button>`}
              <input id="thumb-file" type="file" accept="image/*" style="display:none;">
            </div>
          </div>
        </div>
      </div>` : "";
    const gbpPhotoPicker = (state.media.kind === "video" && (state.gbpLocations || []).length > 0) ? `
      <div class="pagecard" style="padding:12px 14px;margin-top:10px;">
        <div style="display:flex;align-items:center;gap:10px;">
          ${state.gbpPhoto && state.gbpPhoto.previewUrl
            ? `<img src="${state.gbpPhoto.previewUrl}" style="width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--border);flex:0 0 auto;">`
            : `<div style="width:52px;height:52px;border-radius:8px;border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto;">📷</div>`}
          <div style="flex:1;min-width:0;">
            <div style="font-weight:600;font-size:13px;">📍 Photo pour Google Business <span class="muted" style="font-weight:400;">· optionnel</span></div>
            <div class="muted" style="font-size:11px;margin-top:2px;">La <b>publication</b> Google n'accepte pas la vidéo. Sans photo choisie ici, c'est la <b>vignette de la vidéo</b> qui sera envoyée — verticale, donc recadrée par Google. Une photo au format paysage donne un bien meilleur rendu.<br>La vidéo elle-même part sur la fiche par la case <b>🎬 Galerie</b>, plus bas.</div>
          </div>
          ${state.gbpPhoto
            ? `<button id="gbp-photo-remove" class="btn-ghost" style="padding:6px 10px;font-size:12px;color:#c0564f;flex:0 0 auto;">Retirer</button>`
            : `<button id="gbp-photo-add" class="btn-ghost" style="padding:6px 12px;font-size:12px;flex:0 0 auto;">+ Choisir</button>`}
          <input id="gbp-photo-file" type="file" accept="image/*" class="hidden">
        </div>
      </div>` : "";
    slot.innerHTML = `<div class="media-box">${preview}<button class="media-x" id="rm" aria-label="Retirer le média">✕</button><div class="media-tag">${meta}</div></div>${gbpPhotoPicker}${thumbPicker}`;
    document.getElementById("rm").onclick = () => { state.media = null; state.thumbTs = null; state.thumbDataUrl = null; state.thumbSlider = 0; state.thumbCustom = false; state.gbpPhoto = null; state.gbpGallery = {}; render(); saveDraft(); };
    const _gpAdd = document.getElementById("gbp-photo-add");
    const _gpFile = document.getElementById("gbp-photo-file");
    const _gpRemove = document.getElementById("gbp-photo-remove");
    if (_gpAdd && _gpFile) _gpAdd.onclick = () => _gpFile.click();
    if (_gpFile) _gpFile.onchange = () => {
      const f = _gpFile.files && _gpFile.files[0];
      if (!f) return;
      state.gbpPhoto = { file: f, previewUrl: URL.createObjectURL(f) };
      renderMediaSlot();
    };
    if (_gpRemove) _gpRemove.onclick = () => { state.gbpPhoto = null; renderMediaSlot(); };
    const thSlider = document.getElementById("thumb-slider");
    if (thSlider) {
      const vid = slot.querySelector("video");
      let seekPending = false;
      const capture = () => {
        try {
          if (!vid || !vid.videoWidth) return;
          const cv = document.createElement("canvas");
          const scale = Math.min(1, 1080 / vid.videoWidth);
          cv.width = Math.round(vid.videoWidth * scale);
          cv.height = Math.round(vid.videoHeight * scale);
          cv.getContext("2d").drawImage(vid, 0, 0, cv.width, cv.height);
          state.thumbDataUrl = cv.toDataURL("image/jpeg", 0.85);
          state.thumbTs = vid.currentTime;
          buildThumbSmall();
          const pv = document.getElementById("thumb-prev");
          if (pv) { pv.src = state.thumbDataUrl; pv.style.display = ""; }
          const lbl = thSlider.parentElement.querySelector("div");
          if (lbl) lbl.innerHTML = `🖼 Vignette de la vidéo <span class="muted" style="font-weight:400;">· ${state.thumbTs.toFixed(1)}s</span>`;
        } catch {}
      };
      if (vid) vid.addEventListener("seeked", () => { if (seekPending) { seekPending = false; capture(); } });

      // Import d'une image de couverture qui n'est PAS tiree de la video.
      // Elle prend le dessus sur le curseur tant qu'elle n'est pas retiree.
      const thFile = document.getElementById("thumb-file");
      const thImport = document.getElementById("thumb-import");
      const thClear = document.getElementById("thumb-clear");
      if (thImport && thFile) thImport.onclick = () => thFile.click();
      if (thFile) thFile.onchange = () => {
        const f = thFile.files && thFile.files[0];
        if (!f) return;
        const rd = new FileReader();
        rd.onload = () => {
          const im = new Image();
          im.onload = () => {
            // Meme traitement que la capture : JPEG 1080 px de large, pour rester
            // sous les limites de taille des reseaux.
            const c = document.createElement("canvas");
            const w = 1080, h = Math.round(im.height * (w / im.width));
            c.width = w; c.height = h;
            c.getContext("2d").drawImage(im, 0, 0, w, h);
            state.thumbDataUrl = c.toDataURL("image/jpeg", 0.85);
            state.thumbCustom = true;
            state.thumbTs = null;
            render(); saveDraft();
          };
          im.onerror = () => alert("Image illisible.");
          im.src = rd.result;
        };
        rd.readAsDataURL(f);
      };
      if (thClear) thClear.onclick = () => {
        state.thumbCustom = false;
        state.thumbDataUrl = null;
        state.thumbTs = null;
        render(); saveDraft();
      };
      // Capture automatique dès que la vidéo est prête : sans ça, aucune vignette
      // n'était envoyée et chaque réseau choisissait lui-même son image.
      // Position fixe à 1 seconde, pour que le résultat soit toujours le même et
      // sans surprise. On évite l'instant 0, où le décodeur n'a souvent encore
      // rien produit et où beaucoup de vidéos ouvrent sur une image noire.
      // Le curseur reste là pour choisir un autre instant.
      if (vid && !state.thumbDataUrl && !state.thumbCustom) {
        const autoCapture = () => {
          if (state.thumbDataUrl || state.thumbCustom) return;
          const d = isFinite(vid.duration) && vid.duration ? vid.duration : 0;
          if (!d) { capture(); return; }
          vid.addEventListener("seeked", () => {
            requestAnimationFrame(() => requestAnimationFrame(() => {
              if (!state.thumbDataUrl) capture();
            }));
          }, { once: true });
          try { vid.currentTime = Math.min(d - 0.05, 1); } catch { capture(); }
        };
        if (vid.readyState >= 2) autoCapture();
        else vid.addEventListener("loadeddata", autoCapture, { once: true });
      }
      thSlider.oninput = () => {
        if (state.thumbCustom) return; // une image importee prime sur le curseur
        state.thumbSlider = parseInt(thSlider.value, 10) || 0;
        if (!vid || !isFinite(vid.duration) || !vid.duration) return;
        seekPending = true;
        vid.currentTime = Math.min(vid.duration - 0.05, (state.thumbSlider / 1000) * vid.duration);
      };
    }
  }
}

function renderOptSlot() {
  const slot = document.getElementById("opt-slot"); if (!slot) return;
  if (!state.optimized) { slot.innerHTML = ""; return; }
  slot.innerHTML = `<div class="opt-card">
    <div style="font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--maple);margin-bottom:8px;">✨ Suggestion — vous gardez le choix</div>
    <div class="opt-text">${escapeHtml(state.optimized)}</div>
    <button class="opt-use" id="useOpt">Utiliser ce texte →</button></div>`;
  document.getElementById("useOpt").onclick = () => { state.caption = state.optimized; state.optimized = null; render(); };
}

// Repeint UNE seule page (ses cases + sa grande coche) sans reconstruire la liste
function paintPage(pid) {
  const box = document.getElementById("pages"); if (!box) return;
  const av = destAvailability();
  const p = state.pages.find(x => x.id === pid); if (!p) return;
  const d = state.pageDest[pid] || { feed: false, reel: false, story: false };
  box.querySelectorAll('.dest[data-pid="' + pid + '"]').forEach(el => {
    const k = el.getAttribute("data-k");
    el.classList.toggle("on", av[k].ok && d[k]);
  });
  // Cette page peut avoir deux cartes : une dans la section Facebook, une dans la section Instagram
  box.querySelectorAll('.page[data-id="' + pid + '"]').forEach(pageEl => {
    const net = pageEl.getAttribute("data-net") || "fb";
    const anyOn = netDests(p, net).length > 0;
    const card = pageEl.closest(".pagecard");
    pageEl.classList.toggle("on", anyOn);
    if (card) card.classList.toggle("on", anyOn);
    const chk = pageEl.querySelector(".check");
    if (chk) { chk.classList.toggle("on", anyOn); chk.textContent = anyOn ? "✓" : ""; }
  });
}

// Met à jour le bouton « Tout retirer/sélectionner » et le bouton Publier (compteur)
function paintCounts() {
  const chosen = state.pages.filter(p => pageDests(p).length > 0);
  const ttN = ttSelected().length;
  const ytN = ytSelected().length;
  const thN = thSelected().length;
  const bsN = bsSelected().length;

    pub.innerHTML = (state.scheduleAt ? "🗓️ Programmer sur " : "✈ Publier sur ") + total + " compte" + (total > 1 ? "s" : "");
  }

// Destinations actives d'une page pour UN réseau ("fb" ou "ig")
function netDests(p, net) {
  const av = destAvailability();
  const d = state.pageDest[p.id] || {};
  const keys = net === "ig" ? ["ig", "igstory"] : ["feed", "reel", "story"];
  if (net === "ig" && !(state.ig && state.ig[p.id])) return [];
  return keys.filter(k => d[k] && av[k].ok);
}

  };
  const fbDefs = [
    { key: "feed", label: "Fil" },
    { key: "reel", label: "Reel" },

    { key: "ig", label: "Fil / Reel" },
    { key: "igstory", label: "Story" }

  // --- Section FACEBOOK : une carte par page ---
  const fbCards = state.pages.map(p => {

    </div>`;
  }).join("");
  // --- Section INSTAGRAM : une carte indépendante par compte relié ---
  const igPages = state.pages.filter(p => state.ig && state.ig[p.id]);
  const igCards = igPages.map(p => {
    const ig = state.ig[p.id];
    const anyOn = netDests(p, "ig").length > 0;

      ? `<img src="${ig.picture}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`
      : `<img src="https://graph.facebook.com/${p.id}/picture?width=72&height=72" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`;

      state.bsOn[key] = !state.bsOn[key];
      renderPages(); paintCounts();
    });
  box.querySelectorAll("[data-gbpcard]").forEach(el =>
    el.onclick = () => {
      const key = el.getAttribute("data-gbpcard");
      if (!state.gbpOn) state.gbpOn = {};
      if (!state.gbpGallery) state.gbpGallery = {};
      // Cocher l'établissement coche TOUT ce qu'il sait recevoir : sinon le
      // raccourci ne sert à rien et on oublie la moitié de la fiche.
      const v = !state.gbpOn[key];
      state.gbpOn[key] = v;
      state.gbpGallery[key] = v;
      renderPages(); paintCounts();
    });
  box.querySelectorAll("[data-gbpdest]").forEach(el =>
    el.onclick = (e) => {
      e.stopPropagation();
      const key = el.getAttribute("data-gbpdest");
      if (!state.gbpOn) state.gbpOn = {};
      state.gbpOn[key] = !state.gbpOn[key];
      renderPages(); paintCounts();
    });
  box.querySelectorAll("[data-gbpgal]").forEach(el =>
    el.onclick = (e) => {
      e.stopPropagation();
      const key = el.getAttribute("data-gbpgal");
      if (!state.gbpGallery) state.gbpGallery = {};
      state.gbpGallery[key] = !state.gbpGallery[key];
      renderPages(); paintCounts();
    });
  const _gd = document.getElementById("gal-days");
  if (_gd) _gd.onchange = () => {
    state.galleryDays = parseInt(_gd.value, 10) || 0;
    try { localStorage.setItem("poster_gallery_days", String(state.galleryDays)); } catch (e) { /* navigation privée */ }
  };
  // Clic sur une case individuelle
  box.querySelectorAll(".dest[data-pid]").forEach(el =>
    el.onclick = (e) => {
      e.stopPropagation();
      const pid = el.getAttribute("data-pid"), k = el.getAttribute("data-k");
      if (!av[k].ok) return;
      if (!state.pageDest[pid]) state.pageDest[pid] = { feed: false, reel: false, story: false, ig: false, igstory: false };
      state.pageDest[pid][k] = !state.pageDest[pid][k];
      paintPage(pid); paintCounts();
    });
  syncDividers();
}

/* ---------- RÉGLAGES DES PAGES ----------
   Hashtags, signature, commentaire automatique et marquage de lieu : des
   réglages qu'on écrit une fois et qu'on ne touche plus. Ils vivaient derrière
   les pastilles # et 📍 de chaque carte du composeur, où ils encombraient
   l'écran de publication. Ils sont désormais réunis ici. */
function settingsGet(store, prefix, key, fallback) {
  if (store[key] !== undefined && store[key] !== null) return store[key];
  let v = null;
  try { v = localStorage.getItem(prefix + key); } catch {}
  return (v !== null) ? v : (fallback || "");
}
function setBlock(title, sub, fields) {
  return `<div class="pagecard" style="margin-bottom:12px;">
    <div style="font-weight:600;font-size:13.5px;">${title}</div>
    ${sub ? `<div class="muted" style="font-size:11px;margin-top:2px;">${sub}</div>` : ""}
    ${fields}
  </div>`;
}
function setField(label, html) {
  return `<div class="tagrow"><label class="muted" style="font-size:11.5px;display:block;margin-bottom:4px;">${label}</label>${html}</div>`;
}
/* ---- Versions réellement en ligne -----------------------------------------
   Le 18 octobre 2026, trois fichiers périmés ont été découverts un par un,
   chacun par une panne en production : une galerie qui refuse de se programmer,
   un robot qui réclame un jeton Facebook pour une tâche Google, une vidéo rangée
   sous « Extérieur ». À chaque fois la cause était la même — le fichier en ligne
   n'était pas celui qu'on croyait — et rien, dans Frendo, ne permettait de le
   voir. Chaque fonction déclare donc sa date ; cet écran les interroge et les
   compare à ce qui est attendu. Une fonction qui ne répond pas est forcément
   antérieure à ce contrôle, donc périmée elle aussi. */
/* Avec l'heure, pas seulement la date : le 18 octobre 2026, deux versions de
   youtube.js ont été écrites à vingt minutes d'intervalle et une date au jour
   ne permettait pas de savoir laquelle tournait. */
const EXPECTED_API = {
  "api/stories-schedule.js": "2026-11-07 18:30",
  "api/pages.js": "2026-11-05 16:10",
  "api/youtube.js": "2026-11-05 18:50",
  "api/cron-stories.js": "2026-11-05 13:45",
  "api/tiktok.js": "2026-11-05 18:40",
};
async function fetchApiVersions() {
  const rows = [];
  for (const [url, name] of [
    ["/api/stories-schedule", "api/stories-schedule.js"],
    ["/api/youtube", "api/youtube.js"],
    ["/api/tiktok", "api/tiktok.js"],
  ]) {
    try {
      const { ok, data } = await api(url, { pwd: state.pwd, action: "version" });
      rows.push((ok && data && data.ok)
        ? { file: data.file || name, version: data.version || null, commit: data.commit || null, commitMsg: data.commitMsg || null }
        : { file: name, version: null });
    } catch (e) { rows.push({ file: name, version: null }); }
  }
  // cron-stories refuse les POST non signés par QStash : il se consulte en GET.
  try {
    const r = await fetch("/api/cron-stories?version=1&pwd=" + encodeURIComponent(state.pwd));
    const d = await r.json().catch(() => ({}));
    rows.push((d && d.ok)
      ? { file: d.file || "api/cron-stories.js", version: d.version || null, commit: d.commit || null, commitMsg: d.commitMsg || null }
      : { file: "api/cron-stories.js", version: null });
  } catch (e) { rows.push({ file: "api/cron-stories.js", version: null }); }
  return rows;
}
function isStaleRow(r) {
  const want = EXPECTED_API[r.file];
  return !r.version || (want && r.version < want);
}
function versionsHtml(rows) {
  const dep = rows.find((r) => r.commit) || {};
  const line = (mark, file, val, bad) => `<div style="display:flex;gap:8px;align-items:baseline;padding:3px 0;font-size:12px;">
      <span>${mark}</span><code style="font-size:11.5px;">${escapeHtml(file)}</code>
      <span style="margin-left:auto;${bad ? "color:#9b1c2e;font-weight:600;" : ""}">${escapeHtml(val)}</span>
    </div>`;
  const body = rows.map((r) => {
    const bad = isStaleRow(r);
    return line(bad ? "⚠️" : "✓", r.file, r.version || "pas de réponse", bad);
  }).join("");
  const stale = rows.filter(isStaleRow).length;
  /* Le verdict d'abord, le detail ensuite : on vient ici pour savoir si tout
     est monte, pas pour lire quatre dates. */
  const verdict = `<div style="padding:8px 10px;border-radius:10px;margin-bottom:8px;font-size:13px;font-weight:600;background:${stale ? "#fdecea" : "#eaf5ec"};color:${stale ? "#9b1c2e" : "#1b5e20"};">`
    + (stale ? "⚠️ " + stale + (stale > 1 ? " fichiers ne sont pas montés" : " fichier n'est pas monté") : "✅ Tout est monté — " + APP_VERSION + " · " + API_LOT)
    + `</div>`;
  return verdict + body
    + `<div style="border-top:1px solid var(--border);margin-top:6px;padding-top:6px;">`
    + line("✓", "public/index.html", APP_VERSION, false) + `</div>`
    + (dep.commit ? `<div class="muted" style="font-size:11px;margin-top:8px;line-height:1.5;">Déploiement <code>${escapeHtml(dep.commit)}</code>${dep.commitMsg ? " — " + escapeHtml(dep.commitMsg) : ""}</div>` : "")
    + `<div class="muted" style="font-size:11px;margin-top:6px;line-height:1.5;">${stale
        ? "⚠️ " + stale + (stale > 1 ? " fichiers périmés" : " fichier périmé") + " : poussez-les sur GitHub, puis attendez le « Ready » de Vercel et revérifiez."
        : "Tout est à jour."}</div>`;
}
