// Lit le message d'erreur Instagram et ajoute un indice si c'est un problème de permissions.
function igErrMsg(r) {
  const e = r && r.error;
  if (!e) return "";
  let m = e.error_user_msg || e.message || "";
  if (/permission|OAuth|#200|#10\b|#803/i.test(m + " (#" + (e.code || "") + ")")) {
    m += " — le jeton n'a probablement pas les permissions Instagram. Il faudra le régénérer (je vous guiderai).";
  }
  return m;
}
// Publie sur Instagram. kind = "feed" (post/reel) | "story".
// Vidéo → Reel (ou story vidéo). Image → post photo (ou story photo).
async function publishInstagram(igId, token, kind, mediaUrl, isVideo, caption, onStep) {
  onStep && onStep("Préparation…");
  let qs;
  if (isVideo) {
    qs = "media_type=" + (kind === "story" ? "STORIES" : "REELS") + "&video_url=" + encodeURIComponent(mediaUrl);
    if (kind !== "story" && state.thumbTs != null) qs += "&thumb_offset=" + Math.max(0, Math.round(state.thumbTs * 1000));
  } else {
    qs = (kind === "story" ? "media_type=STORIES&" : "") + "image_url=" + encodeURIComponent(mediaUrl);
  }
  if (caption && kind !== "story") qs += "&caption=" + encodeURIComponent(caption);
  const cr = await fbPost(FBV + igId + "/media?" + qs + "&access_token=" + encodeURIComponent(token));
  if (!cr.id) return { ok: false, error: igErrMsg(cr) || "Instagram n'a pas accepté le média." };
  // Instagram prépare le média de son côté : on attend qu'il soit prêt.
  onStep && onStep("Traitement par Instagram…");
  for (let i = 0; i < 60; i++) {
    await sleep(3000);
    const s = await fbGet(FBV + cr.id + "?fields=status_code&access_token=" + encodeURIComponent(token));
    if (s.status_code === "FINISHED") break;
    if (s.status_code === "ERROR" || s.status_code === "EXPIRED") {
      return { ok: false, error: "Instagram a refusé le média (format, durée ou proportions ?). Astuce : vidéo verticale MP4, image JPEG." };
    }
    if (!s.status_code) { if (s.error) return { ok: false, error: igErrMsg(s) }; break; }
  }
  onStep && onStep("Publication…");
  const pub = await fbPost(FBV + igId + "/media_publish?creation_id=" + encodeURIComponent(cr.id) + "&access_token=" + encodeURIComponent(token));
  if (!pub.id) return { ok: false, error: igErrMsg(pub) || "Échec de la publication Instagram." };
  // Vérification réelle (Story uniquement) : Meta peut renvoyer un id de media_publish,
  // et même laisser l'objet consultable ensuite, sans jamais le distribuer dans les
  // Stories actives du compte (rejet silencieux après coup, constaté en pratique).
  // On vérifie donc la VRAIE liste des Stories actives, pas juste l'existence de l'objet.
  if (kind === "story") {
    onStep && onStep("Vérification…");
    let verifyOk = false, verifyErr = null;
    try {
      const list = await fbGet(FBV + igId + "/stories?fields=id&access_token=" + encodeURIComponent(token));
      if (list && Array.isArray(list.data)) {
        verifyOk = list.data.some((x) => x.id === pub.id);
        if (!verifyOk) verifyErr = "absente de la liste des Stories actives du compte";
      } else if (list && list.error) {
        verifyErr = igErrMsg(list);
      } else {
        verifyErr = "réponse de vérification vide";
      }
    } catch (e) { verifyErr = "réseau : " + (e && e.message ? e.message : e); }
    if (!verifyOk) {
      return { ok: false, error: "Instagram a répondu OK à la publication de la Story mais elle n'apparaît pas dans les Stories actives du compte" + (verifyErr ? " (" + verifyErr + ")" : "") + " — rejetée après coup par Meta." };
    }
  }
  let url = null;
  try {
    const perm = await fbGet(FBV + pub.id + "?fields=permalink&access_token=" + encodeURIComponent(token));
    url = perm.permalink || null;
  } catch {}
  return { ok: true, id: pub.id, url };
}

// Programme une photo en Fil (photo hébergée → Facebook la publie à l'heure dite).
async function publishScheduledPhoto(pageId, token, photoUrl, caption, ts) {
  let url = FBV + pageId + "/photos?published=false&scheduled_publish_time=" + ts + "&url=" + encodeURIComponent(photoUrl) + "&access_token=" + encodeURIComponent(token);
  if (caption) url += "&message=" + encodeURIComponent(caption);
  const r = await fbPost(url);
  if (r.id || r.post_id) return { ok: true, url: "https://www.facebook.com/" + pageId };
  return { ok: false, error: (r.error && r.error.message) || "Échec de la programmation." };
}

async function publish() {
  state.busy = "pub"; state.error = ""; state.progress = null; state.thumbReport = []; render();
  await recaptureThumb(); // photo exacte de l'instant choisi, prise proprement
  const chosen = state.pages.filter(p => pageDests(p).length > 0);
  const isVideo = !!state.media && state.media.kind === "video";
  const av = destAvailability();
  const labelOf = { feed: "Fil", reel: "Reel", story: "Story", ig: "Instagram", igstory: "Story Instagram", tiktok: "TikTok", threads: "Threads", bluesky: "Bluesky", gbp: "Google Business", gbpgal: "Galerie Google" };

  const scheduleTs = state.scheduleAt ? Math.floor(state.scheduleAt / 1000) : null;
  if (scheduleTs) {
    const now = Math.floor(Date.now() / 1000);
    if (scheduleTs < now + 600) { state.busy = false; state.error = "La date de programmation doit être au moins 10 minutes dans le futur."; render(); return; }
    if (scheduleTs > now + 30 * 24 * 3600) { state.busy = false; state.error = "La date de programmation doit être au maximum 30 jours dans le futur."; render(); return; }
  }

  // Chaque page a ses propres destinations
  const plan = chosen.map(p => ({ p, dests: pageDests(p) })).filter(x => x.dests.length > 0);
  const ttChosen = ttSelected();
  const ytChosen = ytSelected();
  const thChosen = thSelected();
  const bsChosen = bsSelected();
  const gbpChosen = gbpSelected();
  const gbpGalChosen = gbpGallerySelected();

  // La galerie compte comme destination à part entière : sans elle dans cette
  // liste, un envoi « galerie seule » était refusé alors que la case était cochée.
  if (plan.length === 0 && ttChosen.length === 0 && ytChosen.length === 0 && thChosen.length === 0 && bsChosen.length === 0 && gbpChosen.length === 0 && gbpGalChosen.length === 0) { state.busy = false; state.error = "Cochez au moins une destination (Fil, Reel, Story, TikTok, YouTube, Threads, Bluesky, Google Business ou sa galerie)."; render(); return; }

  /* La galerie exige elle aussi le média sur R2 : c'est son adresse publique
     que Google va chercher. Sans elle dans cette liste, un envoi « galerie
     seule » n'hébergeait rien et échouait sur « aucune vidéo à déposer ». */
  const needBlob = (!!state.media && state.media.kind === "carousel") || ttChosen.length > 0 || ytChosen.length > 0 || thChosen.length > 0 || bsChosen.length > 0 || gbpChosen.length > 0 || gbpGalChosen.length > 0 || plan.some(x => x.dests.includes("reel") || x.dests.includes("ig") || x.dests.includes("igstory") || x.dests.includes("story") || (scheduleTs && x.dests.includes("feed") && !isVideo));

  const isCarousel = !!state.media && state.media.kind === "carousel";
  try {
    // Média hébergé une seule fois si un Reel ou une Story est demandé quelque part.
    let mediaUrl = null;
    let mediaUrls = null;
    let mediaItems = null;      // [{url, kind}] — pour FB/IG qui acceptent le mélange photo+vidéo
    let hasVideoInCarousel = false;
    let videoUrlInCarousel = null; // URL de la 1ère vidéo du carrousel (fallback Threads/Bluesky)
    if (isCarousel) {
      mediaItems = [];
      for (let i = 0; i < state.mediaList.length; i++) {
        state.progress = { label: "Hébergement des médias… (" + (i + 1) + "/" + state.mediaList.length + ")", pct: Math.round(i / state.mediaList.length * 100) }; paintProgress();
        const u = await uploadToBlob(state.mediaList[i].file, () => {});
        mediaItems.push({ url: u, kind: state.mediaList[i].kind === "video" ? "video" : "image" });
      }
      mediaUrls = mediaItems.map(x => x.url);
      mediaUrl = mediaUrls[0];
      hasVideoInCarousel = mediaItems.some(x => x.kind === "video");
      videoUrlInCarousel = (mediaItems.find(x => x.kind === "video") || {}).url || null;
    } else if (needBlob && state.media) {
      state.progress = { label: "Hébergement du média…", pct: 0 }; paintProgress();
      mediaUrl = await uploadToBlob(state.media.file, (pct) => { state.progress = { label: "Hébergement du média…", pct }; paintProgress(); });
    }

    // Diaporama hébergé une seule fois si un Reel est demandé en mode carrousel
    let slideUrl = null;
    if (isCarousel && state.slideVideo && plan.some(x => x.dests.includes("reel") || x.dests.includes("story") || x.dests.includes("igstory"))) {
      state.progress = { label: "Hébergement du diaporama…", pct: 0 }; paintProgress();
      slideUrl = await uploadToBlob(state.slideVideo.file, (pct) => { state.progress = { label: "Hébergement du diaporama…", pct }; paintProgress(); });
    }

    // Photo spécifique à Google Business (quand le média principal est une vidéo, non
    // supportée par ce réseau) — hébergée séparément, utilisée UNIQUEMENT pour ce réseau.
    let gbpPhotoUrl = null;
    if (gbpChosen.length > 0 && state.gbpPhoto && state.gbpPhoto.file) {
      state.progress = { label: "Hébergement de la photo Google Business…", pct: 0 }; paintProgress();
      gbpPhotoUrl = await uploadToBlob(state.gbpPhoto.file, (pct) => { state.progress = { label: "Hébergement de la photo Google Business…", pct }; paintProgress(); });
    } else if (gbpChosen.length > 0 && isVideo) {
      /* Filet de sécurité : la publication Google n'accepte pas la vidéo, et une
         légende écrite POUR la vidéo ne veut rien dire sans image — « vendu
         depuis 1952 en Pennsylvanie » n'explique pas de quoi on parle. Faute de
         photo dédiée, on envoie la vignette de la vidéo. Elle est verticale et
         Google la recadrera : c'est moins bon qu'une photo paysage choisie à la
         main, et l'avertissement le dit avant l'envoi. Mieux vaut ça qu'un
         texte orphelin. */
      try {
        const tb = thumbBlobOrNull();
        if (tb) {
          state.progress = { label: "Hébergement de la vignette pour Google Business…", pct: 0 }; paintProgress();
          gbpPhotoUrl = await uploadToBlob(new File([tb], "gbp-vignette.jpg", { type: "image/jpeg" }), (pct) => {
            state.progress = { label: "Hébergement de la vignette pour Google Business…", pct }; paintProgress();
          });
        }
      } catch (e) { /* sans vignette, la publication part en texte seul : pas de quoi tout arrêter */ }
    }

    // Versions allégées pour Bluesky (limite ~1 Mo par image) — inutile si on envoie la vidéo seule
    let bskyUrls = mediaUrls;
    let bskyUrl = mediaUrl;
    if (bsChosen.length > 0 && !isVideo && !hasVideoInCarousel && state.media) {
      const srcs = isCarousel ? state.mediaList : [state.media];
      const urls = isCarousel ? mediaUrls : [mediaUrl];
      const out = [];
      for (let i = 0; i < srcs.length; i++) {
        const f = srcs[i].file;
        if (f && f.size > 900000) {
          state.progress = { label: "Optimisation pour Bluesky… (" + (i + 1) + "/" + srcs.length + ")", pct: Math.round(i / srcs.length * 100) }; paintProgress();
          const small = await compressForBsky(srcs[i].previewUrl);
          if (small) { out.push(await uploadToBlob(new File([small], "bsky-" + i + ".jpg", { type: "image/jpeg" }), () => {})); continue; }
        }
        out.push(urls[i]);
      }
      bskyUrls = isCarousel ? out : mediaUrls;
      bskyUrl = out[0] || mediaUrl;
    }

    // ---- Exécution EN PARALLÈLE : toutes les destinations partent en même temps. ----
    const needsToken = (dest) =>
      dest === "reel" || dest === "ig" || dest === "igstory" ||
      (!scheduleTs && dest === "story") || (dest === "feed" && isVideo) ||
      (scheduleTs && dest === "feed" && !isVideo) ||
      (dest === "feed" && isCarousel) ||
      (dest === "feed" && !state.media);

    // 1) Jetons de page récupérés en parallèle, une seule fois par page.
    const tokenMap = {};
    await Promise.all(plan.map(async ({ p, dests }) => {
      if (dests.some(needsToken)) tokenMap[p.id] = await getPageToken(p.id);
    }));

    // 2) Liste des tâches (page × destination) avec suivi individuel.
    const tasks = [];
    plan.forEach(({ p, dests }) => dests.forEach(dest => tasks.push({ p, dest })));
    ttChosen.forEach((a) => {
      const ttName = a.username ? "@" + a.username : (a.display_name || "TikTok");
      tasks.push({ p: { id: "tt:" + a.open_id, name: ttName }, dest: "tiktok", ttAccount: a });
    });
    ytChosen.forEach((a) => {
      tasks.push({ p: { id: "yt:" + a.channel_id, name: a.title || "YouTube" }, dest: "youtube", ytAccount: a });
    });
    thChosen.forEach((a) => {
      tasks.push({ p: { id: "th:" + a.key, name: "@" + (a.username || a.key) }, dest: "threads", thAccount: a });
    });
    bsChosen.forEach((a) => {
      tasks.push({ p: { id: "bs:" + a.key, name: "@" + (a.handle || a.key) }, dest: "bluesky", bsAccount: a });
    });
    gbpChosen.forEach((l) => {
      tasks.push({ p: { id: "gbp:" + l.location_name, name: l.title || "Google Business" }, dest: "gbp", gbpLocation: l });
    });
    gbpGalChosen.forEach((l) => {
      tasks.push({ p: { id: "gbpgal:" + l.location_name, name: l.title || "Google Business" }, dest: "gbpgal", gbpLocation: l });
    });
    const items = tasks.map(t => ({ name: t.p.name, destLabel: labelOf[t.dest], label: "en attente…", done: false, ok: null }));
    state.progress = { parallel: true, items, total: tasks.length, doneCount: 0 };
    paintProgress();

    async function runTask(t, step) {
      const { p, dest } = t;
      const token = tokenMap[p.id];
      if (needsToken(dest) && !token) return { ok: false, name: p.name, dest: labelOf[dest], error: "Jeton de page introuvable." };
      const pageText = composeText(state.caption, state.pageTags[p.id], state.pageSig[p.id], NET_LIMITS.fb);
      // ---- Mode CARROUSEL : circuits dédiés ----
      if (isCarousel) {
        if (dest === "reel") {
          const reelUrl = slideUrl || videoUrlInCarousel;
          if (!reelUrl) return { ok: false, name: p.name, dest: "Reel", error: "Ajoutez une vidéo au carrousel ou créez d'abord le diaporama (bouton 🎬)." };
          const r = await publishVerticalVideo(p.id, token, "reel", reelUrl, pageText, step, scheduleTs);
          return r.ok ? { ok: true, pageId: p.id, network: "fb", name: p.name, dest: "Reel", url: r.url || null, postId: r.id || null, sched: !!scheduleTs } : { ok: false, name: p.name, dest: "Reel", error: r.error };
        }
        if (dest === "feed") {
          if (hasVideoInCarousel) {
            step(scheduleTs ? "Programmation de la vidéo…" : "Publication de la vidéo…");
            const r = await fbVideoOnlyFeed(p.id, token, videoUrlInCarousel, pageText, scheduleTs);
            if (r.ok && r.id) autoComment(p.id, token, r.id);
            return r.ok ? { ok: true, pageId: p.id, network: "fb", name: p.name, dest: "Fil (vidéo seule)", url: r.url, postId: r.id || null, sched: !!scheduleTs } : { ok: false, name: p.name, dest: "Fil", error: r.error };
          }
          step(scheduleTs ? "Programmation du carrousel…" : "Publication du carrousel…");
          const r = await fbCarouselFeed(p.id, token, mediaItems, pageText, scheduleTs);
          if (r.ok && r.id) autoComment(p.id, token, r.id);
          return r.ok ? { ok: true, pageId: p.id, network: "fb", name: p.name, dest: "Fil", url: r.url, postId: r.id || null, sched: !!scheduleTs } : { ok: false, name: p.name, dest: "Fil", error: r.error };
        }
        if (dest === "story") {
          const storyVideoUrl = slideUrl || videoUrlInCarousel;
          if (storyVideoUrl) {
            // Une vidéo (réelle ou diaporama) existe : elle part en story (plus vivant que des photos)
            if (scheduleTs) {
              try {
                const rbOn = state.rebroadcast.on;
                const add = await api("/api/stories-schedule", {
                  pwd: state.pwd, action: "add",
                  job: {
                    pageId: p.id, pageName: p.name, mediaUrl: storyVideoUrl,
                    once: !rbOn, kind: "video", caption: "",
                    comment: combinedComment(p.id),
                    intervalDays: state.rebroadcast.intervalDays,
                    remaining: rbOn ? Math.max(1, state.rebroadcast.times) : 1,
                    nextRun: state.scheduleAt
                  }
                });
                if (add.ok && add.data && add.data.ok) return { ok: true, pageId: p.id, network: "fb", name: p.name, dest: "Story (vidéo)", url: null, sched: true, jobId: (add.data.job && add.data.job.id) || null, rebroadcast: rbOn };
                return { ok: false, name: p.name, dest: "Story", error: (add.data && add.data.error) || "échec de la programmation" };
              } catch (e) { return { ok: false, name: p.name, dest: "Story", error: "échec de la programmation" }; }
            }
            const rv = await publishVerticalVideo(p.id, token, "story", storyVideoUrl, "", step);
            return rv.ok ? { ok: true, pageId: p.id, network: "fb", name: p.name, dest: "Story (vidéo)", url: "https://www.facebook.com/" + p.id, postId: rv.id || null } : { ok: false, name: p.name, dest: "Story", error: rv.error };
          }
          if (scheduleTs) return { ok: false, name: p.name, dest: "Story", error: "carrousel non programmable en story (v1)" };
          const imgUrls = mediaItems.filter(x => x.kind !== "video").map(x => x.url);
          if (imgUrls.length === 0) return { ok: false, name: p.name, dest: "Story", error: "carrousel 100% vidéo non supporté en story sans diaporama (v1)" };
          const storyIds = [];
          for (let i = 0; i < imgUrls.length; i++) {
            step("Story " + (i + 1) + "/" + imgUrls.length + "…");
            const r = await publishPhotoStory(p.id, token, imgUrls[i]);
            if (!r.ok) return { ok: false, name: p.name, dest: "Story", error: "photo " + (i + 1) + " : " + r.error };
            if (r.id) storyIds.push(r.id);
          }
          return { ok: true, pageId: p.id, network: "fb", name: p.name, dest: "Story (" + imgUrls.length + " photos)", url: "https://www.facebook.com/" + p.id, postId: storyIds[0] || null, postIds: storyIds };
        }
        if (dest === "ig" || dest === "igstory") {
          const igAcc = state.ig[p.id];
          const igLabel = dest === "ig" ? "Instagram" : "Story Instagram";
          const igStorySchedUrl = slideUrl || videoUrlInCarousel;
          if (!igAcc) return { ok: false, name: p.name, dest: igLabel, error: "Pas de compte Instagram relié à cette page." };
          if (scheduleTs && !(dest === "igstory" && igStorySchedUrl)) return { ok: false, name: p.name, dest: igLabel, error: "carrousel non programmable sur Instagram (v1)" };
          if (scheduleTs && dest === "igstory" && igStorySchedUrl) {
            try {
              const rbOn = state.rebroadcast.on;
              const add = await api("/api/stories-schedule", {
                pwd: state.pwd, action: "add",
                job: {
                  pageId: p.id,
                  pageName: igAcc.username ? "@" + igAcc.username : p.name,
                  network: "ig", igUserId: igAcc.id, igTarget: "story",
                  once: !rbOn, mediaUrl: igStorySchedUrl, kind: "video", caption: "",
                  comment: combinedComment(p.id),
                  intervalDays: state.rebroadcast.intervalDays,
                  remaining: rbOn ? Math.max(1, state.rebroadcast.times) : 1,
                  nextRun: state.scheduleAt
                }
              });
              if (add.ok && add.data && add.data.ok) return { ok: true, pageId: p.id, igUserId: igAcc.id, network: "ig", name: p.name, dest: "Story Instagram (vidéo)", url: null, sched: true, jobId: (add.data.job && add.data.job.id) || null, rebroadcast: rbOn };
              return { ok: false, name: p.name, dest: igLabel, error: (add.data && add.data.error) || "échec de la programmation" };
            } catch (e) { return { ok: false, name: p.name, dest: igLabel, error: "échec de la programmation" }; }
          }
          const igText = composeText(state.caption, state.pageTags[p.id + "_ig"], state.pageSig[p.id], NET_LIMITS.ig);
          if (dest === "ig") {
            const r = await igCarousel(igAcc.id, token, mediaItems, igText, step);
            if (r.ok && r.id) autoComment(p.id, token, r.id);
            return r.ok ? { ok: true, pageId: p.id, igUserId: igAcc.id, network: "ig", name: p.name, dest: "Instagram", url: r.url, postId: r.id || null } : { ok: false, name: p.name, dest: "Instagram", error: r.error };
          }
          const igStoryVideoUrl = slideUrl || videoUrlInCarousel;
          if (igStoryVideoUrl) {
            const rv = await publishInstagram(igAcc.id, token, "story", igStoryVideoUrl, true, "", step);
            return rv.ok ? { ok: true, pageId: p.id, igUserId: igAcc.id, network: "ig", name: p.name, dest: "Story Instagram (vidéo)", url: igAcc.username ? "https://www.instagram.com/stories/" + igAcc.username + "/" : null, postId: rv.id || null } : { ok: false, name: p.name, dest: igLabel, error: rv.error };
          }
          const igImgUrls = mediaItems.filter(x => x.kind !== "video").map(x => x.url);
          if (igImgUrls.length === 0) return { ok: false, name: p.name, dest: igLabel, error: "carrousel 100% vidéo non supporté en story sans diaporama (v1)" };
          const igStoryIds = [];
          for (let i = 0; i < igImgUrls.length; i++) {
            step("Story " + (i + 1) + "/" + igImgUrls.length + "…");
            const r = await publishInstagram(igAcc.id, token, "story", igImgUrls[i], false, "", () => {});
            if (!r.ok) return { ok: false, name: p.name, dest: igLabel, error: "photo " + (i + 1) + " : " + r.error };
            if (r.id) igStoryIds.push(r.id);
          }
          return { ok: true, pageId: p.id, igUserId: igAcc.id, network: "ig", name: p.name, dest: "Story Instagram (" + igImgUrls.length + " photos)", url: igAcc.username ? "https://www.instagram.com/stories/" + igAcc.username + "/" : null, postId: igStoryIds[0] || null, postIds: igStoryIds };
        }
      }
      if (dest === "feed") {
        if (!state.media) {
          step(scheduleTs ? "Programmation du texte…" : "Publication du texte…");
          const r = await fbTextFeed(p.id, token, pageText, scheduleTs);
          if (r.ok && r.id) autoComment(p.id, token, r.id);
          return r.ok ? { ok: true, pageId: p.id, network: "fb", name: p.name, dest: "Fil", url: r.url, postId: r.id || null, sched: !!scheduleTs } : { ok: false, name: p.name, dest: "Fil", error: r.error };
        }
        if (isVideo) {
          const r = await uploadVideo(p.id, token, (state.media.file || b64toBlob(state.media.base64, state.media.mime)), pageText, (pct) => step((scheduleTs ? "Programmation vidéo" : "Envoi vidéo") + " · " + pct + "%"), scheduleTs, thumbBlobOrNull());
          if (r.ok && r.id) autoComment(p.id, token, r.id);
          return r.ok ? { ok: true, pageId: p.id, network: "fb", name: p.name, dest: "Fil", url: scheduleTs ? null : "https://www.facebook.com/watch/?v=" + r.id, postId: r.id || null, sched: !!scheduleTs } : { ok: false, name: p.name, dest: "Fil", error: r.error };
        } else if (scheduleTs) {
          step("Programmation");
          const r = await publishScheduledPhoto(p.id, token, mediaUrl, pageText, scheduleTs);
          return r.ok ? { ok: true, pageId: p.id, network: "fb", name: p.name, dest: "Fil", url: null, sched: true } : { ok: false, name: p.name, dest: "Fil", error: r.error };
        } else {
          step("Publication");
          const { ok, data } = await api("/api/publish", { pwd: state.pwd, message: pageText, imageBase64: state.media.base64, imageMime: state.media.mime, kind: "image", pageIds: [p.id] });
          const rr = ok && data.results && data.results[0];
          if (rr && rr.ok && rr.url) {
            const m = String(rr.url).match(/fbid=(\d+)|\/(\d+_\d+)(?:$|[\/?])|posts\/(\d+)/);
            const oid = m && (m[1] || m[2] || m[3]);
            if (oid) autoComment(p.id, token, oid);
          }
          return rr && rr.ok ? { ok: true, pageId: p.id, network: "fb", name: p.name, dest: "Fil", url: rr.url, postId: rr.postId || null } : { ok: false, name: p.name, dest: "Fil", error: (rr && rr.error) || (data && data.error) || "Échec." };
        }
      }
      if (dest === "reel") {
        const r = await publishVerticalVideo(p.id, token, "reel", mediaUrl, pageText, step, scheduleTs);
        if (r.ok && r.id) autoComment(p.id, token, r.id);
        return r.ok ? { ok: true, pageId: p.id, network: "fb", name: p.name, dest: "Reel", url: scheduleTs ? null : r.url, postId: r.id || null, sched: !!scheduleTs } : { ok: false, name: p.name, dest: "Reel", error: r.error };
      }
      if (dest === "ig" || dest === "igstory") {
        const igAcc = state.ig[p.id];
        const igLabel = labelOf[dest];
        if (!igAcc) return { ok: false, name: p.name, dest: igLabel, error: "Pas de compte Instagram relié à cette page." };
        const igText = composeText(state.caption, state.pageTags[p.id + "_ig"], state.pageSig[p.id], NET_LIMITS.ig);
        if (scheduleTs) {
          // Programmation via le robot : on enregistre un job à date unique
          // (ou une série si Rediffuser auto est activé sur une story).
          try {
            const rbOn = dest === "igstory" && state.rebroadcast.on;
            const add = await api("/api/stories-schedule", {
              pwd: state.pwd, action: "add",
              job: {
                pageId: p.id,
                pageName: igAcc.username ? "@" + igAcc.username : p.name,
                network: "ig", igUserId: igAcc.id,
                igTarget: dest === "ig" ? "feed" : "story",
                once: !rbOn,
                mediaUrl, kind: isVideo ? "video" : "photo",
                caption: dest === "ig" ? igText : "",
                comment: combinedComment(p.id),
                intervalDays: state.rebroadcast.intervalDays,
                remaining: rbOn ? Math.max(1, state.rebroadcast.times) : 1,
                nextRun: state.scheduleAt
              }
            });
            if (add.ok && add.data && add.data.ok) return { ok: true, pageId: p.id, igUserId: igAcc.id, network: "ig", name: p.name, dest: igLabel, url: null, sched: true, jobId: (add.data.job && add.data.job.id) || null, rebroadcast: rbOn };
            return { ok: false, name: p.name, dest: igLabel, error: (add.data && add.data.error) || "échec de la programmation" };
          } catch (e) { return { ok: false, name: p.name, dest: igLabel, error: "échec de la programmation" }; }
        }
        const r = await publishInstagram(igAcc.id, token, dest === "ig" ? "feed" : "story", mediaUrl, isVideo, dest === "ig" ? igText : "", step);
        if (r.ok && r.id && dest === "ig") autoComment(p.id, token, r.id);
        let igScheduled = false;
        if (r.ok && dest === "igstory" && state.rebroadcast.on && mediaUrl) {
          try {
            const add = await api("/api/stories-schedule", {
              pwd: state.pwd, action: "add",
              job: {
                pageId: p.id,
                pageName: igAcc.username ? "@" + igAcc.username : p.name,
                network: "ig", igUserId: igAcc.id,
                igTarget: dest === "ig" ? "feed" : "story",
                mediaUrl, kind: isVideo ? "video" : "photo", caption: dest === "ig" ? igText : "",
                comment: combinedComment(p.id),
                intervalDays: state.rebroadcast.intervalDays,
                remaining: Math.max(1, state.rebroadcast.times - 1),
                nextRun: Date.now() + state.rebroadcast.intervalDays * 86400000
              }
            });
            igScheduled = !!(add.ok && add.data && add.data.ok);
          } catch (e) { igScheduled = false; }
        }
        return r.ok ? { ok: true, pageId: p.id, igUserId: igAcc.id, network: "ig", name: p.name, dest: igLabel, url: r.url || (dest === "igstory" && igAcc.username ? "https://www.instagram.com/stories/" + igAcc.username + "/" : null), postId: r.id || null, rebroadcast: igScheduled } : { ok: false, name: p.name, dest: igLabel, error: r.error };
      }
      if (dest === "tiktok") {
        if (isCarousel) return { ok: false, name: p.name, dest: "TikTok", error: "carrousel non supporté (v1)" };
        if (scheduleTs) return { ok: false, name: p.name, dest: "TikTok", error: "non programmable — à publier le jour même" };
        const m = state.media;
        if (isVideo && m && m.duration && (m.duration < 3 || m.duration > 600)) {
          return { ok: false, name: p.name, dest: "TikTok", error: "vidéo de " + Math.round(m.duration) + " s (TikTok : 3 s à 10 min)" };
        }
        step("Envoi à TikTok…");
        const acc = t.ttAccount || {};
        const tagKey = "tt_" + (acc.open_id || "");
        const ttText = composeText(state.caption, state.pageTags[tagKey] !== undefined ? state.pageTags[tagKey] : state.pageTags["tiktok"]);
        const { ok, data } = await api("/api/tiktok", { pwd: state.pwd, action: "publish", open_id: acc.open_id, mediaUrl, kind: isVideo ? "video" : "photo", caption: ttText });
        if (ok && data && data.ok) {
          const priv = data.privacy === "SELF_ONLY" ? " (publié en privé — audit TikTok en attente)" : "";
          const pend = data.pending ? " — traitement en cours côté TikTok" : "";
          return { ok: true, name: p.name, dest: "TikTok" + priv + pend, url: null };
        }
        return { ok: false, name: p.name, dest: "TikTok", error: (data && data.error) || "Échec TikTok." };
      }
      if (dest === "youtube") {
        if (isCarousel) return { ok: false, name: p.name, dest: "YouTube", error: "carrousel non supporté" };
        if (!isVideo) return { ok: false, name: p.name, dest: "YouTube", error: "vidéo uniquement" };
        step(scheduleTs ? "Programmation sur YouTube…" : "Envoi à YouTube…");
        const acc = t.ytAccount || {};
        const title = (state.caption || "Vidéo Frendo").split("\n")[0].slice(0, 90) || "Vidéo Frendo";
        const publishAt = scheduleTs ? new Date(scheduleTs * 1000).toISOString() : null;
        // Vignette : on réutilise l'image déjà recapturée par recaptureThumb() (même
        // source que pour les Reels/Fil Facebook), envoyée en base64 pour un appel
        // séparé côté serveur (thumbnails.set — l'API YouTube l'exige à part).
        const ytThumbB64 = state.thumbDataUrl ? state.thumbDataUrl.split(",")[1] : undefined;
        const { ok, data } = await api("/api/youtube", {
          pwd: state.pwd, action: "publish", channel_id: acc.channel_id, mediaUrl, title,
          description: (state.caption ? state.caption + "\n\n" : "") + YT_SIGNATURE,
          privacyStatus: publishAt ? "private" : "public",
          publishAt,
          thumbnailBase64: ytThumbB64,
        });
        if (ok && data && data.ok) {
          const thumbNote = data.thumbnailError ? " (vignette refusée : " + data.thumbnailError + ")"
            : (data.thumbnailInfo ? " (vignette : " + data.thumbnailInfo + ")" : "");
          // Rappel de vignette : inscrit tout de suite, que la vidéo parte en direct
          // ou en programmation — Studio accepte la vignette dès l'envoi et elle
          // tient (plus aucun second envoi de l'API ne vient l'écraser depuis v247).
          // Plus de tâche différée : le jour de la diffusion, il n'y a plus rien à faire.
          if (data.videoId) ytPendingAdd(data.videoId, p.name || "YouTube", state.product);
          return { ok: true, name: p.name, network: "youtube", channelId: acc.channel_id, videoId: data.videoId, dest: "YouTube" + thumbNote, url: data.url, sched: !!scheduleTs };
        }
        // L'appel a échoué — mais Vercel coupe la fonction à 60 s, et YouTube a pu
        // recevoir la vidéo entière avant la coupure. On vérifie avant de conclure.
        step("Vérification sur YouTube…");
        const chk = await api("/api/youtube", { pwd: state.pwd, action: "find", channel_id: acc.channel_id, title, sinceMinutes: 30 });
        if (chk.ok && chk.data && chk.data.ok && chk.data.found) {
          return { ok: true, name: p.name, network: "youtube", channelId: acc.channel_id, videoId: chk.data.videoId, dest: "YouTube (confirmée après délai)", url: chk.data.url, sched: !!scheduleTs };
        }
        return { ok: false, name: p.name, dest: "YouTube", error: (data && data.error) || "Échec YouTube." };
      }
      if (dest === "threads") {
        const acc = t.thAccount || {};
        // Légende trop longue pour 500 caractères : on la publie en fil plutôt
        // que de l'amputer. thSuites part avant le commentaire d'adresse.
        const thFil = composeThread(state.caption, state.pageTags["th_" + (acc.key || "")], state.pageSig["th_" + (acc.key || "")], NET_LIMITS.th);
        const thText = thFil.text;
        const thComment = [...(state.postComments || []).map((t) => (t || "").trim()).filter(Boolean), ((state.pageComment["th_" + (acc.key || "")] || "").trim())].filter(Boolean).join("\n\n");
        const thVideoOnly = isCarousel && hasVideoInCarousel;
        const thMediaUrl = thVideoOnly ? videoUrlInCarousel : mediaUrl;
        const thMediaUrls = thVideoOnly ? null : (isCarousel ? mediaUrls : null);
        const thKind = thVideoOnly ? "video" : (isCarousel ? "photo" : (isVideo ? "video" : (mediaUrl ? "photo" : "text")));
        if (scheduleTs) {
          step("Programmation Threads…");
          const add = await api("/api/stories-schedule", { pwd: state.pwd, action: "add", job: {
            network: "threads", accountKey: acc.key, once: true, remaining: 1,
            intervalDays: state.rebroadcast.intervalDays,
            mediaUrl: thMediaUrl || null, mediaUrls: thMediaUrls,
            kind: thKind,
            caption: thText, comment: thComment || "", comments: [...thFil.suites, thComment].filter(Boolean),
            nextRun: scheduleTs * 1000,
          } });
          return (add.ok && add.data && add.data.ok)
            ? { ok: true, accountKey: acc.key, network: "threads", name: p.name, dest: "Threads", url: null, sched: true, jobId: (add.data.job && add.data.job.id) || null }
            : { ok: false, name: p.name, dest: "Threads", error: (add.data && add.data.error) || "échec programmation." };
        }
        step("Envoi à Threads…");
        let { ok, data } = await api("/api/threads", { pwd: state.pwd, action: "publish", accountKey: acc.key, mediaUrl: thMediaUrl, mediaUrls: thMediaUrls || undefined, kind: thKind, text: thText, comments: [...thFil.suites, thComment].filter(Boolean), comment: thComment || undefined });
        // Vidéo longue : Threads n'a pas fini de traiter dans le temps imparti à
        // une fonction Vercel (60 s). Le serveur rend la main, on le relance
        // jusqu'à ce que ce soit prêt — environ 5 minutes au total.
        let tries = 0;
        while (ok && data && data.pending && data.creationId && tries < 9) {
          tries++;
          step("Threads traite la vidéo… (" + tries + ")");
          await sleep(8000);
          ({ ok, data } = await api("/api/threads", {
            pwd: state.pwd, action: "finish_media",
            accountKey: data.accountKey || acc.key, creationId: data.creationId,
          }));
        }
        if (ok && data && data.pending) {
          return { ok: false, name: p.name, dest: "Threads", error: "Threads traite encore la vidéo après 5 minutes — réessaie plus tard (rien n'a été publié)." };
        }
        if (!ok || !data || !data.ok) return { ok: false, name: p.name, dest: "Threads", error: (data && data.error) || "Échec Threads." };
        return { ok: true, accountKey: acc.key, network: "threads", name: p.name, dest: "Threads", url: data.url || null, postId: data.postId || null };
      }
      if (dest === "bluesky") {
        const acc = t.bsAccount || {};
        // Même principe que Threads, avec la limite de 300 caractères de Bluesky.
        const bsFil = composeThread(state.caption, state.pageTags["bs_" + (acc.key || "")], state.pageSig["bs_" + (acc.key || "")], NET_LIMITS.bs);
        const bsText = bsFil.text;
        const bsComment = [...(state.postComments || []).map((t) => (t || "").trim()).filter(Boolean), ((state.pageComment["bs_" + (acc.key || "")] || "").trim())].filter(Boolean).join("\n\n").slice(0, 300);
        const bsVideoOnly = isCarousel && hasVideoInCarousel;
        const bsMediaUrl = bsVideoOnly ? videoUrlInCarousel : bskyUrl;
        const bsMediaUrls = bsVideoOnly ? null : (isCarousel ? bskyUrls : null);
        const bsKind = bsVideoOnly ? "video" : (isCarousel ? "photo" : (isVideo ? "video" : "photo"));
        if (scheduleTs) {
          step("Programmation Bluesky…");
          const add = await api("/api/stories-schedule", { pwd: state.pwd, action: "add", job: {
            network: "bluesky", accountKey: acc.key, once: true, remaining: 1,
            intervalDays: state.rebroadcast.intervalDays,
            mediaUrl: bsMediaUrl || null, mediaUrls: bsMediaUrls,
            kind: bsKind,
            caption: bsText, comment: bsComment || "", comments: [...bsFil.suites, bsComment].filter(Boolean),
            nextRun: scheduleTs * 1000,
          } });
          return (add.ok && add.data && add.data.ok)
            ? { ok: true, accountKey: acc.key, network: "bluesky", name: p.name, dest: "Bluesky", url: null, sched: true, jobId: (add.data.job && add.data.job.id) || null }
            : { ok: false, name: p.name, dest: "Bluesky", error: (add.data && add.data.error) || "échec programmation." };
        }
        step("Envoi à Bluesky…");
        const { ok, data } = await api("/api/threads", { pwd: state.pwd, action: "bsky_publish", accountKey: acc.key, mediaUrl: bsMediaUrl, mediaUrls: bsMediaUrls || undefined, kind: bsKind, text: bsText, comments: [...bsFil.suites, bsComment].filter(Boolean), comment: bsComment || undefined });
        if (!ok || !data || !data.ok) return { ok: false, name: p.name, dest: "Bluesky", error: (data && data.error) || "Échec Bluesky." };
        return { ok: true, accountKey: acc.key, network: "bluesky", name: p.name, dest: "Bluesky", url: data.url || null, postId: data.url || null };
      }
      if (dest === "gbp") {
        const loc = t.gbpLocation || {};
        const gbpText = composeText(state.caption, null, null, NET_LIMITS.gbp);
        let gbpMediaUrl = null;
        if (gbpPhotoUrl) {
          gbpMediaUrl = gbpPhotoUrl; // photo dédiée choisie exprès pour Google Business (média principal = vidéo)
        } else if (isCarousel) {
          if (!hasVideoInCarousel && mediaUrls && mediaUrls[0]) gbpMediaUrl = mediaUrls[0];
        } else if (!isVideo && mediaUrl) {
          gbpMediaUrl = mediaUrl;
        }
        if (scheduleTs) {
          step("Programmation Google Business…");
          const add = await api("/api/stories-schedule", { pwd: state.pwd, action: "add", job: {
            network: "gbp", locationName: loc.location_name, once: true, remaining: 1,
            mediaUrl: gbpMediaUrl || null,
            kind: gbpMediaUrl ? "photo" : "text",
            caption: gbpText,
            nextRun: scheduleTs * 1000,
          } });
          return (add.ok && add.data && add.data.ok)
            ? { ok: true, accountKey: loc.location_name, network: "gbp", name: p.name, dest: "Google Business", url: null, sched: true, jobId: (add.data.job && add.data.job.id) || null }
            : { ok: false, name: p.name, dest: "Google Business", error: (add.data && add.data.error) || "échec programmation." };
        }
        step("Envoi à Google Business…");
        const { ok, data } = await api("/api/youtube", { pwd: state.pwd, action: "gbp_publish", location_name: loc.location_name, summary: gbpText, mediaUrl: gbpMediaUrl || undefined });
        if (!ok || !data || !data.ok) return { ok: false, name: p.name, dest: "Google Business", error: (data && data.error) || "Échec Google Business." };
        return { ok: true, accountKey: loc.location_name, network: "gbp", name: p.name, dest: "Google Business", url: data.url || null, postId: data.postName || null };
      }
      /* Galerie de la fiche : la vidéo elle-même, par un point d'entrée distinct
         de la publication. Le retrait est programmé dans la foulée du dépôt —
         jamais avant, sinon on programmerait le retrait d'une vidéo qui n'est
         pas arrivée. À 0 jour, on ne programme rien : elle reste. */
      if (dest === "gbpgal") {
        const loc = t.gbpLocation || {};
        const jours = state.galleryDays || 0;
        if (!mediaUrl) return { ok: false, name: p.name, dest: "Galerie Google", error: "aucune vidéo à déposer." };
        if (scheduleTs) {
          step("Programmation de la galerie…");
          const add = await api("/api/stories-schedule", { pwd: state.pwd, action: "add", job: {
            network: "gbpmedia", locationName: loc.location_name, once: true, remaining: 1,
            mediaUrl, kind: "video", galleryDays: jours,
            caption: (state.product || "").slice(0, 80),
            nextRun: scheduleTs * 1000,
          } });
          return (add.ok && add.data && add.data.ok)
            ? { ok: true, accountKey: loc.location_name, network: "gbpmedia", name: p.name, dest: "Galerie Google", url: null, sched: true, jobId: (add.data.job && add.data.job.id) || null }
            : { ok: false, name: p.name, dest: "Galerie Google", error: (add.data && add.data.error) || "échec programmation." };
        }
        step("Dépôt dans la galerie Google…");
        const { ok, data } = await api("/api/youtube", { pwd: state.pwd, action: "gbp_media_add", location_name: loc.location_name, mediaUrl, mediaFormat: "VIDEO" });
        if (!ok || !data || !data.ok) return { ok: false, name: p.name, dest: "Galerie Google", error: (data && data.error) || "Échec du dépôt dans la galerie." };
        if (data.mediaName && jours > 0) {
          try {
            await api("/api/stories-schedule", { pwd: state.pwd, action: "add", job: {
              network: "gbpmedia", locationName: loc.location_name, mediaName: data.mediaName,
              once: true, remaining: 1, kind: "text",
              caption: (state.product || "").slice(0, 80),
              nextRun: Date.now() + jours * 86400000,
            } });
          } catch (e) { /* le dépôt a réussi : on ne le fait pas échouer pour un retrait non programmé */ }
        }
        return { ok: true, accountKey: loc.location_name, network: "gbpmedia", name: p.name, dest: "Galerie Google", url: data.url || null, postId: data.mediaName || null };
      }
      if (dest === "story") {
        if (scheduleTs) {
          try {
            const rbOn = state.rebroadcast.on;
            const add = await api("/api/stories-schedule", {
              pwd: state.pwd, action: "add",
              job: {
                pageId: p.id, pageName: p.name, mediaUrl,
                once: !rbOn,
                kind: isVideo ? "video" : "photo", caption: "",
                comment: combinedComment(p.id),
                intervalDays: state.rebroadcast.intervalDays,
                remaining: rbOn ? Math.max(1, state.rebroadcast.times) : 1,
                nextRun: state.scheduleAt
              }
            });
            if (add.ok && add.data && add.data.ok) return { ok: true, pageId: p.id, network: "fb", name: p.name, dest: "Story", url: null, sched: true, jobId: (add.data.job && add.data.job.id) || null, rebroadcast: rbOn };
            return { ok: false, name: p.name, dest: "Story", error: (add.data && add.data.error) || "échec de la programmation" };
          } catch (e) { return { ok: false, name: p.name, dest: "Story", error: "échec de la programmation" }; }
        }
        const r = isVideo
          ? await publishVerticalVideo(p.id, token, "story", mediaUrl, "", step)
          : (step("Publication de la story"), await publishPhotoStory(p.id, token, mediaUrl));
        let scheduled = false;
        if (r.ok && state.rebroadcast.on && mediaUrl) {
          try {
            const add = await api("/api/stories-schedule", {
              pwd: state.pwd, action: "add",
              job: {
                pageId: p.id, pageName: p.name, mediaUrl,
                kind: isVideo ? "video" : "photo", caption: "",
                comment: combinedComment(p.id),
                intervalDays: state.rebroadcast.intervalDays,
                remaining: Math.max(1, state.rebroadcast.times - 1),
                nextRun: Date.now() + state.rebroadcast.intervalDays * 86400000
              }
            });
            scheduled = !!(add.ok && add.data && add.data.ok);
          } catch (e) { scheduled = false; }
        }
        return r.ok ? { ok: true, pageId: p.id, network: "fb", name: p.name, dest: "Story", url: r.url, postId: r.id || null, rebroadcast: scheduled } : { ok: false, name: p.name, dest: "Story", error: r.error };
      }
      return { ok: false, name: p.name, dest: labelOf[dest] || dest, error: "Destination inconnue." };
    }

    // Erreurs génériques/passagères côté Meta : celles-là seules déclenchent 1 nouvel essai automatique.
    // Les erreurs de permission, jeton, ou contenu refusé restent visibles immédiatement (pas de retry).
    function isTransientError(msg) {
      const m = String(msg || "").toLowerCase();
      return /unexpected error|internal error|erreur interne|please retry|temporarily|momentané|réessaie|timeout|try again/.test(m);
    }
    const wait = (ms) => new Promise((res) => setTimeout(res, ms));

    // 3) Jusqu'à 6 tâches en même temps en publication directe.
    //    En PROGRAMMATION (scheduleTs actif), on force 1 seule à la fois :
    //    plusieurs appels "add" simultanés vers /api/stories-schedule se marchent
    //    dessus (lecture-modification-écriture non protégée côté serveur sur le
    //    même fichier JSON R2) et peuvent silencieusement s'écraser entre eux.
    //    Coût : programmation un peu plus lente. Aucun impact sur la publication directe.
    const results = new Array(tasks.length);
    let cursor = 0;
    async function worker() {
      while (cursor < tasks.length) {
        const idx = cursor++;
        const item = items[idx];
        const step = (label) => { item.label = label; paintProgress(); };
        item.label = "démarrage…"; paintProgress();
        let r;
        try { r = await runTask(tasks[idx], step); }
        catch (e) { r = { ok: false, name: tasks[idx].p.name, dest: labelOf[tasks[idx].dest], error: (e && e.message) || "erreur" }; }
        if (!r.ok && isTransientError(r.error)) {
          item.label = "nouvel essai…"; paintProgress();
          await wait(4000);
          try { r = await runTask(tasks[idx], step); }
          catch (e) { r = { ok: false, name: tasks[idx].p.name, dest: labelOf[tasks[idx].dest], error: (e && e.message) || "erreur" }; }
        }
        results[idx] = r;
        item.done = true; item.ok = r.ok; item.label = r.ok ? "✓ terminé" : (r.error || "échec");
        state.progress.doneCount += 1;
        paintProgress();
      }
    }
    await Promise.all(Array.from({ length: scheduleTs ? 1 : Math.min(6, tasks.length) }, () => worker()));
    // Contexte gardé en mémoire : permet de réessayer uniquement les échecs
    state.retryRun = { tasks, runTask };

    // Identifiant de la publication : sert a rattacher le rapport de verification.
    const entryId = "e" + Date.now() + "-" + Math.random().toString(36).slice(2, 7);
    // …et à retrouver l'entrée d'historique quand une reprise réussit.
    state.retryRun.entryId = entryId;
    try {
      addHistory({
        entryId,
        ts: scheduleTs ? scheduleTs * 1000 : Date.now(),
        name: (state.media && state.media.file && state.media.file.name) || "média",
        product: (state.product || "").slice(0, 120),
        kind: state.media ? state.media.kind : "",
        thumb: thumbSmallOrDefault(),
        caption: (state.caption || "").slice(0, 5000),
        scheduled: !!scheduleTs,
        items: results.map((r) => ({
          name: r.name, dest: r.dest, ok: !!r.ok, err: r.ok ? undefined : (r.error || "").slice(0, 160),
          network: r.network || null, pageId: r.pageId || null, igUserId: r.igUserId || null, accountKey: r.accountKey || null,
          postId: r.postId || null, url: r.url || null, sched: !!r.sched, jobId: r.jobId || null,
          videoId: r.videoId || null, channelId: r.channelId || null,
        }))
      });
    } catch {}

    // Verification differee : quelques minutes plus tard, Frendo interroge chaque
    // reseau pour confirmer que le post est bien en ligne. Lecture seule — ca ne
    // republie rien, ca signale seulement ce qui a echoue en silence.
    try {
      const toCheck = results.filter(r => r.ok && !r.sched && (r.postId || r.videoId)).map(r => ({
        name: r.name, dest: r.dest, network: r.network || null,
        pageId: r.pageId || null, postId: r.postId || null,
        videoId: r.videoId || null, channelId: r.channelId || null,
      }));
      if (toCheck.length) {
        await api("/api/stories-schedule", {
          pwd: state.pwd, action: "add",
          job: {
            network: "verify", once: true, kind: "text",
            entryId, verifyItems: toCheck,
            pageName: "Verification", remaining: 1, intervalDays: 1,
            nextRun: Date.now() + 5 * 60 * 1000,
          },
        });
      }
    } catch (e) { /* la verification est un bonus : jamais bloquante */ }
    state.lastShare = (mediaUrl && !scheduleTs) ? { mediaUrl, isVideo } : null;
    if (results.some(r => r.ok)) {
      if (state.activePlanId) {
        // Publication lancée depuis le plan de bataille : on coche l'entrée existante (sauf si programmée pour plus tard), et on revient à la vue Tâche pour voir le résultat
        try { planPatchLocal(state.activePlanId, { done: !scheduleTs }); } catch {}
        state.activePlanId = null;
        state.planAddType = "task";
      } else {
        // Publication spontanée : on l'ajoute au plan de bataille — cochée si publiée maintenant, sinon visible dans « À venir »
        try {
          let fname = (state.media && state.media.name) ? state.media.name.replace(/\.[^.]+$/, "") : "Publication";
          if (isCarousel) fname += " (carrousel " + state.mediaList.length + " photos)";
          // Publication programmée : l'entrée porte la date de diffusion prévue
          let planDate = todayStr();
          let pubAt = Date.now();
          if (scheduleTs) {
            const d = new Date(scheduleTs * 1000);
            planDate = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
            pubAt = scheduleTs * 1000;
          }
          if (!Array.isArray(state.plan)) state.plan = [];
          state.plan.push({
            id: "p_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
            name: fname.slice(0, 120) + (scheduleTs ? " 🗓️" : ""),
            date: planDate,
            note: (state.caption || "").slice(0, 2200),
            type: "pub",
            done: !scheduleTs,
            createdAt: Date.now(),
            publishedAt: scheduleTs ? null : pubAt,
          });
          savePlan();
        } catch {}
      }
    } else if (state.activePlanId) {
      state.activePlanId = null;
    }
    // Publication terminée : on vide le composeur tout de suite (média, légende, programmation),
    // pour que "01 Image" reparte à zéro quel que soit le bouton cliqué ensuite sur l'écran de résultats
    // (Nouvelle publication, Retour, ou Voir programmations).
    state.media = null; state.mediaList = []; state.slideVideo = null; state.caption = ""; state.product = ""; state.optimized = null;
    state.postComments = []; state.scheduleAt = null; state.rebroadcast = { on: false, intervalDays: 2, times: 8 };
    state.gbpPhoto = null;   // la sélection Galerie reste cochée, comme Publication
    state.busy = false; state.progress = null; state.results = results; state.done = true; state.ytPromptSeen = false; clearDraft(); render();
    state.autoRetryAttempt = 0;
    if (results.some((r) => r && !r.ok)) scheduleAutoRetry();
  } catch (e) {
    state.busy = false; state.progress = null;
    state.error = "Une erreur est survenue pendant l'envoi. Réessaie.";
    // Filet de sécurité : si au moins une publication a réellement abouti avant l'incident,
    // on vide quand même le composeur pour éviter de repartager le même média par erreur.
    try {
      if (typeof results !== "undefined" && Array.isArray(results) && results.some(r => r && r.ok)) {
        state.media = null; state.mediaList = []; state.slideVideo = null; state.gbpPhoto = null;
      }
    } catch {}
    render();
  }
}

async function loadNativeScheduled() {
  const box = document.getElementById("native-sched-list");
  const out = [];
  for (const p of state.pages) {
    try {
      const token = await getPageToken(p.id);
      if (!token) continue;
      const d = await fbGet(FBV + p.id + "/scheduled_posts?fields=id,message,scheduled_publish_time,created_time&access_token=" + encodeURIComponent(token));
      if (d.error) continue;
      (d.data || []).forEach((post) => {
        out.push({ id: post.id, pageId: p.id, pageName: p.name, token, message: post.message || "", scheduled_publish_time: post.scheduled_publish_time || null });
      });
    } catch (_) {}
  }
  if (!box) return;
  if (!out.length) {
    box.innerHTML = `<p class="muted" style="font-size:12.5px;">Aucune publication programmée nativement sur Facebook en ce moment.</p>`;
    return;
  }
  box.innerHTML = out.map((n) => `
    <div class="pagecard" style="padding:14px;margin-bottom:12px;">
      <div style="font-weight:600;font-size:14px;">${escapeHtml(n.pageName)}</div>
      <div class="muted" style="font-size:12.5px;margin-top:5px;">${n.scheduled_publish_time ? `Publication prévue : <strong>${fmtSchedule(n.scheduled_publish_time * 1000)}</strong>` : ""}</div>
      ${n.message ? `<div class="native-msg-preview muted" style="font-size:12px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">« ${escapeHtml(n.message.slice(0, 90))}${n.message.length > 90 ? "…" : ""} »</div>
      <div class="native-msg-full" style="display:none;font-size:12px;margin-top:4px;white-space:pre-wrap;">« ${escapeHtml(n.message)} »</div>` : ""}
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
        ${n.message && n.message.length > 90 ? `<button class="btn-ghost native-toggle-full" style="padding:8px 14px;font-size:13px;">Voir le texte complet</button>` : ""}
        <button class="btn-ghost native-cancel" data-id="${n.id}" data-token="${escapeHtml(n.token)}" style="padding:8px 14px;font-size:13px;color:#c0564f;">Annuler cette publication</button>
      </div>
    </div>`).join("");
  box.querySelectorAll(".native-toggle-full").forEach((b) => b.onclick = () => {
    const card = b.closest(".pagecard");
    const preview = card.querySelector(".native-msg-preview");
    const full = card.querySelector(".native-msg-full");
    const expanded = full.style.display !== "none";
    full.style.display = expanded ? "none" : "block";
    preview.style.display = expanded ? "block" : "none";
    b.textContent = expanded ? "Voir le texte complet" : "Réduire le texte";
  });
  box.querySelectorAll(".native-cancel").forEach((b) => b.onclick = async () => {
    if (!confirm("Annuler définitivement cette publication programmée ? Elle ne partira jamais.")) return;
    b.disabled = true; b.textContent = "…";
    const r = await fbDelete(FBV + b.dataset.id + "?access_token=" + encodeURIComponent(b.dataset.token));
    if (r.success === true || r.error == null) { loadNativeScheduled(); }
    else { alert("Annulation refusée : " + ((r.error && r.error.message) || "erreur inconnue")); b.disabled = false; b.textContent = "Annuler cette publication"; }
  });
}

  if (!jobs.length) {
    list.innerHTML = `<p class="muted" style="line-height:1.6;">Aucune rediffusion programmée pour l'instant.<br>Poste une story avec l'option « 🔁 Rediffuser auto » activée pour en créer une.</p>`;

  // une obligeait a defiler longuement — on les rassemble en un seul bloc, comme
  // dans l'historique. Les taches restent distinctes cote serveur : les actions

          ${j.caption ? `<div class="muted" style="font-size:12px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">« ${escapeHtml(j.caption.slice(0, 70))}${j.caption.length > 70 ? "…" : ""} »</div>` : ""}
          <div class="muted" style="font-size:12.5px;margin-top:5px;">${j.once ? `Publication : <strong>${fmtSchedule(j.nextRun)}</strong>` : `Encore <strong>${j.remaining}</strong> fois · prochaine : <strong>${fmtSchedule(j.nextRun)}</strong>`}</div>
          ${g.items.length > 1 ? `<div class="muted" style="font-size:11.5px;margin-top:6px;line-height:1.6;">${g.items.map(x => `${escapeHtml(x.pageName || x.pageId)} · ${netLabel(x)}${x.lastResult ? ` <span style="opacity:.75;">— ${escapeHtml(x.lastResult)}</span>` : ""}`).join("<br>")}</div>`

    + (groups.length > state.schedPageSize ? `<p class="center" style="margin-top:10px;"><button id="sched-more" class="btn-ghost" style="padding:8px 16px;font-size:12.5px;">⌄ Charger plus (${groups.length - state.schedPageSize} restant${groups.length - state.schedPageSize > 1 ? "s" : ""})</button></p>` : "");

  list.querySelectorAll(".sched-media").forEach(el => {

      if (ph && ph.classList.contains("sched-noimg")) ph.style.display = "flex";

    const msg = n > 1
      ? `Annuler définitivement cette ${what} sur ${n} destinations ?`
      : `Annuler définitivement cette ${what} ?`;
    if (!confirm(msg)) return;
    b.disabled = true; b.textContent = "…";
    for (const id of ids) {
      await api("/api/stories-schedule", { pwd: state.pwd, action: "cancel", id });
    }
    renderSchedules();
  });
  list.querySelectorAll(".sched-save").forEach(b => b.onclick = async () => {
    const key = b.dataset.key;

    const rEl = list.querySelector(`input[data-r="${CSS.escape(key)}"]`);
    b.disabled = true; b.textContent = "…";
    for (const id of ids) {
      await api("/api/stories-schedule", { pwd: state.pwd, action: "update", id, patch: { intervalDays: iEl.value, remaining: rEl.value } });
    }
    renderSchedules();
  });
  const _sm = document.getElementById("sched-more");
  if (_sm) _sm.onclick = () => { state.schedPageSize += 20; paintSchedJobsList(jobs); };
}

/* ---------- PLANNING ---------- */
function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
async function loadPlan(force) {
  if (state.plan !== null && !force) return;
  try {
    const { ok, data } = await api("/api/stories-schedule", { pwd: state.pwd, action: "plan_list" });
    state.plan = (ok && data && data.ok && Array.isArray(data.plan)) ? data.plan : [];
  } catch { state.plan = state.plan || []; }
  planReconcile();
  if (state.view === "plan") renderPlan(true);
  else if (state.authed && state.view === null && !state.done && !state.busy) render();
}
// Une publication programmée crée une entrée « 🗓️ » non cochée dans le plan.
// C'est le serveur (QStash) qui la diffuse, donc l'app n'a jamais su la cocher :
// ces entrées s'empilaient indéfiniment. Dès que leur date est passée, la
// diffusion a eu lieu — on les coche. Les entrées écrites à la main ne sont
// jamais touchées, et celles du jour ou à venir restent visibles.
function planReconcile() {
  if (!Array.isArray(state.plan)) return;
  const t = todayStr();
  let changed = 0;
  state.plan = state.plan.map((p) => {
    if (!p || p.done || p.type !== "pub") return p;
    if (!p.date || p.date >= t) return p;
    if (typeof p.name !== "string" || p.name.indexOf("🗓️") === -1) return p;
    changed++;
    let at = Date.now();
    try { at = new Date(p.date + "T12:00:00").getTime() || at; } catch {}
    return Object.assign({}, p, { done: true, publishedAt: at });
  });
  if (changed) savePlan();
}
// Petit rappel « au planning aujourd'hui » sur l'écran principal
function planDueLine() {
  if (!Array.isArray(state.plan)) return "";
  const t = todayStr();
  const due = state.plan.filter(p => !p.done && p.date && p.date <= t);
  if (!due.length) return "";
  // Au-delà de deux éléments, on annonce le nombre : lister vingt titres
  // tronqués sur l'accueil n'aide personne et noie la ligne.
  const label = due.length <= 2
    ? "⚔️ Au plan de bataille aujourd'hui : " + due.map(p => escapeHtml(p.name)).join(", ")
    : "⚔️ Plan de bataille : " + due.length + " éléments à traiter";
  return `<p class="center" style="margin-top:6px;"><button id="plan-due" class="link-btn" style="color:#c0564f;">${label}</button></p>`;
}
function fmtPlanDate(d) {
  if (!d) return "sans date";
  try { return new Date(d + "T12:00:00").toLocaleDateString("fr-CH", { weekday: "short", day: "numeric", month: "short" }); } catch { return d; }
}
// Sauvegarde du plan : l'app fait foi (modifications instantanées à l'écran),
// le serveur enregistre la liste complète — plus de coche perdue entre deux clics.
function savePlan() {
  try { api("/api/stories-schedule", { pwd: state.pwd, action: "plan_set", plan: state.plan || [] }); } catch {}
}
function planAddLocal(item) {
  if (!Array.isArray(state.plan)) state.plan = [];
  const created = {
    id: "p_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
    name: String(item.name).slice(0, 120),
    date: item.date || null,
    note: (item.note || "").slice(0, 2200),
    type: item.type === "task" ? "task" : "pub",
    recurYearly: item.type === "task" ? !!item.recurYearly : false,
    done: false,
    createdAt: Date.now(),
    publishedAt: null,
  };
  state.plan.push(created);
  savePlan();
  return created;
}
// Avance une date "AAAA-MM-JJ" d'exactement un an (même jour/mois, année suivante).
function addOneYear(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  d.setFullYear(d.getFullYear() + 1);
  return d.toISOString().slice(0, 10);
}
// Sauvegarde ce qui est actuellement tapé dans le formulaire d'ajout, pour ne pas le perdre au prochain rendu ni au rechargement.
function capturePlanDraft() {
  const nameEl = document.getElementById("plan-name") || document.getElementById("plan-pub-name");
  if (!nameEl) return;
  state.planDraft.name = nameEl.value;
  const dateEl = document.getElementById("plan-date");
  const noteEl = document.getElementById("plan-note");
  const recurEl = document.getElementById("plan-recur");
  if (dateEl) state.planDraft.date = dateEl.value;
  if (noteEl) state.planDraft.note = noteEl.value;
  state.planDraft.recur = !!(recurEl && recurEl.checked);
  try { localStorage.setItem("poster_plan_draft", JSON.stringify(state.planDraft)); } catch {}
}
function planPatchLocal(id, patch) {
  if (!Array.isArray(state.plan)) return;
  state.plan = state.plan.map((x) => {
    if (x.id !== id) return x;
    const u = Object.assign({}, x, patch);
    if (patch.done != null) u.publishedAt = patch.done ? Date.now() : null;
    return u;
  });
  savePlan();
}
function planDeleteLocal(id) {
  if (!Array.isArray(state.plan)) return;
  state.plan = state.plan.filter((x) => x.id !== id);
  savePlan();
}

// Identifiant de la video YouTube d'un resultat. On accepte le champ direct,
// mais on sait aussi le relire dans l'URL : si une seule de ces deux sources
// manque, le lien Studio doit quand meme apparaitre.
function ytVideoId(r) {
  if (!r || !r.ok) return "";
  if (r.videoId) return String(r.videoId);
  const u = String(r.url || "");
  if (!/youtu/i.test(u)) return "";
  const m = u.match(/(?:shorts\/|watch\?v=|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
  return m ? m[1] : "";
}

// Rappel des vignettes à poser : vidéos programmées désormais en ligne. L'API
// enregistre bien l'image mais YouTube ne l'affiche pas sur les Shorts, donc
// seul un dépôt dans Studio la rend visible.
// ---------- Vignettes YouTube à poser ----------
// Le rappel part dès l'envoi (direct ou programmation) et revient à chaque
// ouverture de l'app tant que la vignette n'a pas été marquée comme posée.
// Rien n'est renvoyé à YouTube par l'API : c'est Studio qui fait foi.
const YTP_KEY = "poster_ytpending";
function ytPendingGet() {
  try { const l = JSON.parse(localStorage.getItem(YTP_KEY) || "[]"); return Array.isArray(l) ? l.filter(x => x && x.videoId) : []; }
  catch { return []; }
}
function ytPendingSave(list) { try { localStorage.setItem(YTP_KEY, JSON.stringify(list.slice(-20))); } catch {} }
function ytPendingAdd(videoId, pageName, product) {
  if (!videoId) return;
  const l = ytPendingGet();
  if (l.some(x => x.videoId === videoId)) return;
  l.push({ videoId, pageName: pageName || "YouTube", product: product || "", at: Date.now() });
  ytPendingSave(l);
}
function ytPendingDone(videoId) { ytPendingSave(ytPendingGet().filter(x => x.videoId !== videoId)); }

/* ---- Rappel d'ouverture : ce qui attend une réponse -------------------------
   Messages, commentaires et avis Google vivent tout en bas de l'accueil. Pour
   savoir s'il y a quelque chose à traiter, il fallait descendre — chaque jour,
   et sans garantie : les compteurs ne se chargeaient qu'en ouvrant les écrans.
   Ce rappel va chercher les trois nombres à l'ouverture et ne se montre que
   s'il y a réellement quelque chose. Il attend que le rappel de vignette
   YouTube soit fermé plutôt que de se superposer à lui. */
async function refreshAvisCount() {
  try {
    const { ok, data } = await api("/api/youtube", { pwd: state.pwd, action: "gbp_reviews" });
    if (!ok || !data || !data.ok) return;
    // On garde les avis en mémoire : l'écran s'ouvrira déjà rempli.
    state.revData = data.locations || [];
    try { localStorage.setItem("poster_avis_attente", String(avisEnAttente())); } catch (e) {}
  } catch (e) { /* jamais bloquant */ }
}
function inboxSignature() {
  /* On signe l'IDENTITE de ce qui attend, pas son nombre. Avec un simple compte,
     repondre a deux messages pendant que deux autres arrivent laissait le total
     inchange : le rappel se taisait sur des messages jamais vus. */
  const ids = [];
  (state.msgConvs || []).forEach((c) => { if (c && c.unread) ids.push("m:" + c.convId + ":" + (c.updated || "")); });
  (state.cmtConvs || []).forEach((c) => { if (c && c.commentId) ids.push("c:" + c.commentId); });
  if (state.revData) {
    (state.revData || []).forEach((loc) => ((loc && loc.reviews) || []).forEach((r) => { if (r && !r.reply) ids.push("a:" + (r.name || r.id || "")); }));
  } else {
    const n = avisEnAttente();
    if (n) ids.push("a?:" + n); // avis non relus : on retombe sur le compte memorise
  }
  if (!ids.length) return "0-0-0";
  ids.sort();
  const t = ids.join("|");
  let h = 5381;
  for (let i = 0; i < t.length; i++) h = ((h * 33) ^ t.charCodeAt(i)) >>> 0;
  return ids.length + "-" + h.toString(36);
}
async function checkInbox() {
  try {
    if (state.inboxShown) return;
    // La vignette YouTube passe en premier ; on repassera à sa fermeture.
    if (document.getElementById("yt-pending")) return;
    await Promise.all([checkUnread(), checkComments(), refreshAvisCount()]);
    const sig = inboxSignature();
    if (sig === "0-0-0") return;
    let snooze = "", fait = "";
    try { snooze = sessionStorage.getItem("poster_inbox_snooze") || ""; } catch (e) {}
    try { fait = localStorage.getItem("poster_inbox_fait") || ""; } catch (e) {}
    // « Plus tard » vaut pour cette visite ; « Tout est traité » vaut jusqu'à ce
    // qu'un nouveau message, commentaire ou avis change les comptes.
    if (snooze || fait === sig) return;
    state.inboxShown = true;
    showInboxPrompt(sig);
  } catch (e) { /* un rappel n'est jamais bloquant */ }
}
function showInboxPrompt(sig) {

  const ov = document.createElement("div");
  ov.id = "inbox-prompt";

  ov.innerHTML = `<div class="pagecard" style="max-width:420px;padding:20px;background:var(--bg,#fff);max-height:80vh;overflow:auto;">

    ${lignes.map((l) => `<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line,#e5e5e5);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;">
      <div style="font-size:13px;">${l.icone} <b>${l.n}</b> ${escapeHtml(l.nom)}${l.n > 1 && !l.nom.endsWith("réponse") ? "s" : ""}</div>
      <button class="btn-ghost inbox-go" data-vue="${l.vue}" style="padding:7px 12px;font-size:12.5px;border-color:var(--maple);color:var(--maple);">Ouvrir →</button>

    <div style="margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      <button id="inbox-later" class="link-btn">Plus tard</button>

  document.body.appendChild(ov);
  const close = () => { const e = document.getElementById("inbox-prompt"); if (e) e.remove(); };
  ov.onclick = (ev) => { if (ev.target === ov) close(); };
  const _l = document.getElementById("inbox-later");
  if (_l) _l.onclick = () => { state.inboxEnCours = false; try { sessionStorage.setItem("poster_inbox_snooze", "1"); } catch (e) {} close(); };
  const _d = document.getElementById("inbox-done");

  ov.querySelectorAll(".inbox-go").forEach((b) => {

      state.inboxEnCours = true;
      close();

}

    close();
  };
  // Ouvrir Studio ne suffit pas : seul « C'est fait » retire la vidéo de la liste,
  // sinon le rappel reviendrait alors que la vignette a bien été posée — ou
  // disparaîtrait alors qu'elle ne l'a pas été.
  ov.querySelectorAll("[data-ytdone]").forEach(b => {
    b.onclick = () => {
      ytPendingDone(b.getAttribute("data-ytdone"));
      close();
      if (ytPendingGet().length) setTimeout(checkPendingThumbs, 150);
    };
  });
}

/* ---- Nom du produit : demandé juste avant l'envoi -------------------------
   Le champ de l'étape 02 est facultatif et s'oublie. On le redemande au clic
   sur Envoyer, pendant que le produit est encore en tête et que personne n'a
   quitté l'écran. « Passer » reste offert : une fenêtre qu'on ne peut pas
   fermer, un jour de presse au magasin, est pire que l'oubli qu'elle évite. */
function askProductIfMissing(next) {
  const go = () => { try { next(); } catch (e) { /* l'envoi ne doit jamais rester bloqué */ } };
  if ((state.product || "").trim()) { go(); return; }
  if (document.getElementById("prod-prompt")) { go(); return; }
  const ov = document.createElement("div");
  ov.id = "prod-prompt";
  ov.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9999;";
  ov.innerHTML = `<div class="pagecard" style="max-width:400px;padding:20px;background:var(--bg,#fff);">
    <div style="font-weight:700;font-size:16px;">🏷️ Comment nommer cette publication ?</div>
    <div class="muted" style="font-size:12.5px;margin-top:8px;line-height:1.55;">Le nom n'a pas été renseigné à l'étape 02. En l'ajoutant, vous retrouverez cet envoi d'un coup d'œil dans l'historique et dans les statistiques. Il n'est publié nulle part.</div>
    <input id="prodp-in" type="text" class="field" placeholder="Ex. Menu de midi, Nutella Peanut, Fermeture de Noël…" style="margin-top:14px;">
    <div style="display:flex;gap:8px;margin-top:14px;">
      <button id="prodp-save" class="btn-ghost" style="padding:10px 14px;font-size:13px;flex:1;border-color:var(--maple);color:var(--maple);font-weight:600;">✓ Enregistrer et envoyer</button>
      <button id="prodp-skip" class="btn-ghost" style="padding:10px 14px;font-size:13px;">Envoyer sans nom</button>
    </div>
    <div class="center" style="margin-top:10px;"><button id="prodp-cancel" class="link-btn" style="font-size:12px;opacity:.75;">✕ Annuler — ne rien envoyer</button></div>
  </div>`;
  document.body.appendChild(ov);
  const inp = document.getElementById("prodp-in");
  let done = false;
  /* Trois issues, et elles ne font pas la même chose.
     Révision 2026-10-11 — le clic à côté de la fenêtre appelait close(false),
     c'est-à-dire « envoyer sans nom » : on cherchait de quelle vidéo il
     s'agissait, on cliquait à côté pour réfléchir, et la publication partait.
     Sortir d'une fenêtre sans rien choisir ne doit jamais valoir un accord. */
  const close = (keep, cancel) => {
    if (done) return; done = true;
    if (keep && inp) state.product = inp.value.trim().slice(0, 120);
    const e = document.getElementById("prod-prompt"); if (e) e.remove();
    if (esc) document.removeEventListener("keydown", esc);
    if (cancel) { state.busy = false; render(); return; }
    go();
  };
  const esc = (e) => { if (e.key === "Escape") { e.preventDefault(); close(false, true); } };
  document.addEventListener("keydown", esc);
  ov.onclick = (ev) => { if (ev.target === ov) close(false, true); };
  const _sv = document.getElementById("prodp-save"); if (_sv) _sv.onclick = () => close(true, false);
  const _sk = document.getElementById("prodp-skip"); if (_sk) _sk.onclick = () => close(false, false);
  const _cn = document.getElementById("prodp-cancel"); if (_cn) _cn.onclick = () => close(false, true);
  if (inp) {
    inp.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); close(true, false); } };
    setTimeout(() => { try { inp.focus(); } catch {} }, 60);
  }
}

function renderDone() {
  const results = state.results || [];
  const byPage = {}; const order = [];
  results.forEach(r => {
    const key = r.name || r.pageId || "?";
    if (!byPage[key]) { byPage[key] = []; order.push(key); }
    byPage[key].push(r);
  });
  const okCount = results.filter(r => r.ok).length;
  const total = results.length;
  const cards = order.map(name => {
    const items = byPage[name];
    const lines = items.map(r => {
      let right;
      const _ytId = ytVideoId(r);
      const ytStudio = _ytId ? `<a href="https://studio.youtube.com/video/${encodeURIComponent(_ytId)}/edit" target="_blank" rel="noopener" class="done-share">✎ Studio</a>` : "";
      /* Galerie Google : ni lien, ni partage.
         — « Voir → » pointait sur googleUrl, que Google documente comme non
           pérenne (« not static since it may change over time ») et qui, pour
           une vidéo, désigne une image d'aperçu inexistante tant que le
           fichier est en traitement. Résultat : une erreur 404.

           publication Facebook. Partager un média de galerie sur un profil
           perso n'a de toute façon aucun sens.

      const isGal = r.dest === "Galerie Google";
      if (r.ok && r.sched) {
        right = `<span class="done-sched">programmé</span>` + ytStudio;
      } else if (r.ok && isGal) {
        right = `<span class="done-err">déposé</span>`;
      } else if (r.ok && r.url) {
        const isInsta = r.dest === "Instagram" || r.dest === "Story Instagram";

          (!isInsta && r.dest !== "Story" && r.dest !== "YouTube" ? `<a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(r.url)}" target="_blank" rel="noopener" class="done-share">↗ profil</a>` : "") +
          ytStudio;
      } else if (r.ok) {
        right = `<span class="done-err">publié</span>` + ytStudio;
      } else {
        right = `<span class="done-err">${escapeHtml(r.error || "échec")}</span>`;
      }
      return `<div class="done-line">
        <span class="done-mark ${r.ok ? "done-ok" : "done-fail"}">${r.ok ? "✓" : "✕"}</span>
        <span class="done-dest">${escapeHtml(r.dest || "")}${r.rebroadcast ? ` <span class="done-sched">🔁 rediffusion programmée</span>` : ""}</span>

    }).join("");
    // Réseau(x) du groupe : détermine la vignette et le sous-titre
    const dests = items.map(r => r.dest || "");
    const hasFb = dests.some(d => d === "Fil" || d === "Reel" || d === "Story");
    const hasIg = dests.some(d => d === "Instagram" || d === "Story Instagram");
    const hasTt = dests.includes("TikTok");
    const hasYt = dests.includes("YouTube");
    const hasTh = dests.includes("Threads");
    const hasBs = dests.includes("Bluesky");

    if (hasTh && !hasFb && !hasIg && !hasTt && !hasYt && !hasBs) { ic = `<div class="page-ic" style="background:#000;">＠</div>`; netLabel = "Threads"; }
    else if (hasBs && !hasFb && !hasIg && !hasTt && !hasYt && !hasTh) { ic = `<div class="page-ic" style="background:#0085ff;">🦋</div>`; netLabel = "Bluesky"; }
    else if (hasTt && !hasFb && !hasIg && !hasYt && !hasTh && !hasBs) { ic = `<div class="page-ic" style="background:#000;">tt</div>`; netLabel = "TikTok"; }

    }
