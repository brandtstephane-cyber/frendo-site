  const _db = document.getElementById("done-back");
  if (_db) _db.onclick = () => {
    clearAutoRetry(); state.autoRetryAttempt = 0;
    state.media = null; state.mediaList = []; state.slideVideo = null; state.caption = ""; state.product = ""; state.optimized = null; state.postComments = []; state.done = false; state.results = null; state.scheduleAt = null; state.lastShare = null; state.rebroadcast = { on: false, intervalDays: 2, times: 8 }; resetDests(); clearDraft();
    render();
  };
}

function escapeHtml(s) { return (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

// Les barres de séparation sont recréées à chaque redessin de la page, ce qui
// faisait repartir leur animation de zéro (à-coups au chargement). On cale donc
// la phase de chaque animation sur l'horloge : le mouvement reste continu.
function syncDividers() {
  const t = performance.now() / 1000;
  const set = (sel, dur) => document.querySelectorAll(sel).forEach(el => { el.style.animationDelay = (-(t % dur)) + "s"; });
  set(".sci-fi-divider .beam", 6.4);
  set(".sci-fi-divider .ring1", 4.8);
  set(".sci-fi-divider .ring2", 3.6);
  set(".sci-fi-divider .ring3", 2.4);
  set(".sci-fi-divider .heart", 4.8);
}

function applyTheme() {
  document.body.classList.toggle("dark", !!state.dark);
  // L'infobulle annonce ce que le clic va FAIRE : on n'appuie pas volontiers
  // sur un bouton dont on ignore l'effet.
  const b = document.getElementById("theme-toggle");
  if (b) {
    const txt = state.dark ? "Passer en fond clair" : "Passer en fond sombre";
    b.title = txt; b.setAttribute("aria-label", txt);
  }
}
function toggleTheme() {
  state.dark = !state.dark;
  try { localStorage.setItem("poster_dark", state.dark ? "1" : "0"); } catch {}
  applyTheme();
}

/* Le navigateur sert volontiers une copie gardee en memoire. On va donc lire
   la page telle qu'elle est REELLEMENT sur le serveur, et le dire si elle est
   plus recente que celle qui tourne. */
async function verifierVersionEnLigne() {
  try {
    const r = await fetch("/?_=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const txt = await r.text();
    const mv = txt.match(/const APP_VERSION = "(v\d+)"/);
    const ml = txt.match(/const API_LOT = "(s\d+)"/);
    if (!mv) return;
    const enLigne = mv[1] + " · " + (ml ? ml[1] : "?");
    const ici = APP_VERSION + " · " + API_LOT;
    if (enLigne === ici) return;
    const d = document.createElement("div");
    d.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;z-index:10000;background:#121B38;color:#fff;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center;flex-wrap:wrap;";
    d.innerHTML = '<span style="flex:1;min-width:180px;">Une version plus récente est en ligne : <b>' + enLigne + '</b>. Vous utilisez ' + ici + '.</span>'
      + '<button id="maj-go" style="padding:7px 14px;border-radius:999px;border:none;background:#fff;color:#121B38;font-weight:600;font-size:12.5px;cursor:pointer;">Mettre à jour</button>'
      + '<button id="maj-non" style="padding:7px 10px;border:none;background:none;color:#cfd6e4;font-size:12.5px;cursor:pointer;">Plus tard</button>';
    document.body.appendChild(d);
    d.querySelector("#maj-non").onclick = () => d.remove();
    d.querySelector("#maj-go").onclick = async () => {
      d.querySelector("#maj-go").textContent = "Mise à jour…";
      // On vide la copie locale, sinon le rechargement reservirait la meme page.
      try { if (window.caches) { const n = await caches.keys(); await Promise.all(n.map((k) => caches.delete(k))); } } catch (e) {}
      try {
        if (navigator.serviceWorker) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((g) => g.unregister()));
        }
      } catch (e) {}
      location.replace(location.pathname + "?maj=" + Date.now());
    };
  } catch (e) { /* hors ligne : on ne derange pas */ }
}
async function init() {
  // Sombre par defaut. Seul un choix explicite du proprietaire ramene au clair.
  try { state.dark = localStorage.getItem("poster_dark") !== "0"; } catch { state.dark = true; }
  applyTheme();
  const _t = document.getElementById("theme-toggle"); if (_t) _t.onclick = toggleTheme;
  setTimeout(verifierVersionEnLigne, 1500);
  /* Lien de connexion recu par courriel. On le consomme avant tout le reste et
     on l'efface de la barre d'adresse : un lien qui reste dans l'historique est
     un lien qu'on peut rejouer. */
  let cxJeton = null;
  try { cxJeton = new URLSearchParams(window.location.search).get("cx"); } catch (e) {}
  if (cxJeton) {
    try { window.history.replaceState({}, "", window.location.pathname); } catch (e) {}
    if (await cliOuvrirDepuisLien(cxJeton)) await demarrerEspaceClient();
    render(); return;
  }
  if (await cliReprendreSession()) { await demarrerEspaceClient(); render(); return; }
  let saved = null;
  try { saved = localStorage.getItem("poster_pwd"); } catch {}
  if (saved) {
    const { ok, data } = await api("/api/pages", { pwd: saved });
    if (ok) {
      state.authed = true; state.pwd = saved;
      state.pages = data.pages || []; seedPages(); detectInstagram(); detectTikTok(); detectYouTube(); detectThreads(); detectBluesky(); detectGbp(); loadPlan(); syncSettings(); setTimeout(checkUnread, 2500); setTimeout(checkComments, 3200);
      restoreView();
      // Frendo était fermé et c'est la notification qui vient de l'ouvrir :
      // l'écran demandé l'emporte sur celui qu'on avait quitté.
      try {
        const _nv = new URL(location.href).searchParams.get("v");
        if (_nv) {
          openFromNotification(location.href);
          history.replaceState(null, "", location.pathname); // l'adresse ne doit pas rester collée
        }
      } catch (e) { /* jamais bloquant */ }
      setTimeout(checkPendingThumbs, 1800);
      setTimeout(checkInbox, 3000);
      setTimeout(loadVerifyReports, 2200);
      setTimeout(loadHealthReport, 2600);
      setTimeout(checkPush, 1200);
      const draft = await loadDraft();
      if (draft) {
        state.caption = draft.caption || "";
        state.product = draft.product || "";
        state.media = draft.media || null;
        state.optimized = draft.optimized || null;
        state.mediaList = Array.isArray(draft.mediaList) ? draft.mediaList : [];
        state.postComments = Array.isArray(draft.postComments) ? draft.postComments : [];
        // Les aperçus (liens blob:) meurent au rechargement de la page :
        // on les régénère depuis les fichiers conservés dans la base locale.
        try {
          for (const m of state.mediaList) { if (m && m.file) m.previewUrl = URL.createObjectURL(m.file); }
          if (state.media && state.media.file) {
            state.media.previewUrl = URL.createObjectURL(state.media.file);
          } else if (state.media && state.media.kind === "carousel" && state.mediaList[0]) {
            const c0 = state.mediaList[0];
            state.media.previewUrl = c0.thumb || c0.previewUrl;
            state.media.name = c0.name;
          }
        } catch (_) {}
      }
    } else { try { localStorage.removeItem("poster_pwd"); } catch {} }
  }
  render();
}
// Retour de la fenêtre d'autorisation TikTok — on recharge une VRAIE page neuve :
// sur mobile, revenir de tiktok.com laisse la page dans un état bancal qui bloque
// ensuite l'hébergement du média à 0 %.
let ttReturn = false;
try {
  const params = new URLSearchParams(window.location.search);
  if (params.get("tiktok") === "ok") {
    ttReturn = true;
    alert("✅ Compte TikTok connecté à Frendo !");
    window.location.replace("/");
  } else if (params.get("tiktok") === "err") {
    ttReturn = true;
    alert("❌ Connexion TikTok échouée : " + (params.get("why") || "raison inconnue"));
    window.location.replace("/");
  } else if (params.get("youtube") === "ok") {
    ttReturn = true;
    alert("✅ Chaîne YouTube connectée à Frendo !");
    window.location.replace("/");
  } else if (params.get("fb") === "ok") {
    ttReturn = true;
    alert("✅ " + (params.get("n") || "") + " page(s) Facebook connectée(s) à Frendo !");
    window.location.replace("/");
  } else if (params.get("fb") === "err") {
    ttReturn = true;
    const why = params.get("why") || "raison inconnue";
    alert(why.indexOf("deja_pris:") === 0
      ? "❌ Ces pages sont déjà rattachées à un autre compte Frendo : " + why.slice(10)
      : "❌ Connexion Facebook échouée : " + why);
    window.location.replace("/");
  } else if (params.get("youtube") === "err") {
    ttReturn = true;
    alert("❌ Connexion YouTube échouée : " + (params.get("why") || "raison inconnue"));
    window.location.replace("/");
  }
} catch {}
if (!ttReturn) init();
